# newapp-e2e2's Argo CD project. Least privilege, as java-hello's: the service chart, its
# repo, the platform's repo, and its own namespaces.

apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: newapp-e2e2
  namespace: argocd
spec:
  description: newapp-e2e2's environments (apps/newapp-e2e2/envs)
  sourceRepos:
    - oci://ghcr.io/easypeasyops/charts/service
    - https://github.com/easypeasyops/newapp-e2e2.git
    - https://github.com/easypeasyops/platform.git
  destinations:
    - { server: https://kubernetes.default.svc, namespace: newapp-e2e2-staging }
  clusterResourceWhitelist: # by name: its own namespaces, no other
    - { group: "", kind: Namespace, name: newapp-e2e2-staging }
  namespaceResourceWhitelist:
    - { group: "*", kind: "*" }

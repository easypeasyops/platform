# pt90-dryrun's Argo CD project: a throwaway app for PT-90's tutorial dry run (removed after
# it). Least privilege, as java-hello's: the service chart, its repo, the platform's repo,
# and its own namespaces.

apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: pt90-dryrun
  namespace: argocd
spec:
  description: pt90-dryrun's environments (apps/pt90-dryrun/envs)
  sourceRepos:
    - oci://ghcr.io/easypeasyops/charts/service
    - https://github.com/easypeasyops/pt90-dryrun.git
    - https://github.com/easypeasyops/platform.git
  destinations:
    - { server: https://kubernetes.default.svc, namespace: pt90-dryrun-staging }
  clusterResourceWhitelist: # by name: its own namespaces, no other
    - { group: "", kind: Namespace, name: pt90-dryrun-staging }
  namespaceResourceWhitelist:
    - { group: "*", kind: "*" }

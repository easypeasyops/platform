# Every app's environments, from one folder per app (platform plan 3.3, onboarding):
#   apps/<app>/project.yaml       the app's AppProject: its repo and its namespaces
#   apps/<app>/envs/<env>.yaml    one Application each: <app>-<env> in namespace <app>-<env>
# Adding an app is adding a folder; removing it is deleting the folder. The platform owns
# HOW an app runs (this template, the service chart); the app's repo owns WHAT runs (its
# values files and image digest, read at the revision the env file names).
#
# Each Application renders the platform's service chart from GHCR, pinned by the digest in
# the env file (a chart version reaches staging before prod by editing one file at a time),
# with the values files listed there, layered in order, from the app's repo.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"] # a typo in an env file fails, never renders ""
  generators:
    - git:
        repoURL: https://github.com/easypeasyops/platform.git
        revision: main
        files:
          - path: apps/*/envs/*.yaml
  syncPolicy:
    # Deleting this ApplicationSet (or an env file) removes the Application, never the app:
    # its resources are orphaned, as with the platform's own Applications.
    preserveResourcesOnDeletion: true
  # Break glass turns auto-sync off on one Application (kubectl patch, or the UI's History
  # and rollback); without this, the controller would put it back within seconds. To restore
  # it from git, delete that Application: no finalizer, so its resources keep running, and
  # this ApplicationSet recreates it as the template says (RUNBOOK, break glass).
  ignoreApplicationDifferences:
    - jsonPointers: [/spec/syncPolicy]
  template:
    metadata:
      name: "{{ .app }}-{{ .env }}"
      annotations:
        # Compare with the API server's own dry run, not a client-side diff: the API server
        # fills defaults into the HTTPRoute's lists, which a client-side diff of a CRD reports
        # as drift, so self-heal would re-apply the route forever.
        argocd.argoproj.io/compare-options: ServerSideDiff=true
    spec:
      project: "{{ .app }}"
      sources: [] # templatePatch: the chart, then the app's repo for its values
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .app }}-{{ .env }}"
      syncPolicy:
        automated:
          prune: true # a resource removed from the chart is removed from the cluster
          selfHeal: true # a hand edit (kubectl edit, a stray helm upgrade) is reverted
        syncOptions:
          # A sync must not reset what ignoreDifferences ignores (the canary's weights).
          - RespectIgnoreDifferences=true
        retry:
          limit: 3
          backoff: { duration: 10s, factor: 2, maxDuration: 1m }
      # Fields Argo Rollouts owns when canary is on. Without these, Argo CD would see the app
      # as OutOfSync, and self-heal would undo the canary: the HTTPRoute's weights (it moves
      # them during a canary), and on the stable/canary Services the pod-template-hash it adds
      # to each selector and the annotation that marks the Service as its own.
      ignoreDifferences:
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          jqPathExpressions:
            - .spec.rules[].backendRefs[].weight
        - group: ""
          kind: Service
          jqPathExpressions:
            - .spec.selector["rollouts-pod-template-hash"]
            - .metadata.annotations["argo-rollouts.argoproj.io/managed-by-rollouts"]
  # The sources need a loop over the values files, which only a template patch can hold.
  templatePatch: |
    spec:
      sources:
        - repoURL: oci://ghcr.io/easypeasyops/charts/service
          targetRevision: {{ .chart.digest | quote }} # service {{ .chart.version }}
          path: .
          helm:
            releaseName: {{ .app | quote }}
            valueFiles:
            {{- range .values.files }}
              - {{ printf "$values/%s" . | quote }}
            {{- end }}
        - repoURL: {{ .values.repoURL | quote }}
          targetRevision: {{ .values.revision | quote }}
          ref: values

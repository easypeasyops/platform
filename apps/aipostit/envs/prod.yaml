# aipostit in prod: the Application aipostit-prod, in namespace aipostit-prod.
# It was called postitglobal until v0.3.8 (hotel_social_posts' postitglobal/v* tags).
app: aipostit
env: prod
# The platform's service chart, pinned by digest (the version is for people). Move a pin
# only to a released digest whose provenance verifies (the release's notes say how); move
# staging's first. 1.2.1 is the first with workers, redis and secretEnv.
chart:
  version: 1.2.1
  digest: sha256:ca3d68b758d57577660a870180415210590c9ed299d80756102debb502d012f4
# aipostit's values, from hotel_social_posts at this revision, layered in this order.
values:
  repoURL: https://github.com/easypeasyops/hotel_social_posts.git
  revision: main
  files:
    - apps/aipostit/deploy/service/values.yaml
    # The SLO rules, generated from aipostit's SLO spec. Prod only: the one release per
    # cluster that ships rules (monitoring.clusterWide); the SLO dashboard comes with them.
    - apps/aipostit/deploy/service/slo-rules.values.yaml
    - apps/aipostit/deploy/envs/prod.yaml

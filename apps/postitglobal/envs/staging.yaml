# postitglobal in staging: the Application postitglobal-staging, in namespace
# postitglobal-staging.
app: postitglobal
env: staging
# The platform's service chart, pinned by digest (the version is for people). Move a pin
# only to a released digest whose provenance verifies (the release's notes say how); move
# staging's first. 1.2.1 is the first with workers, redis and secretEnv.
chart:
  version: 1.2.1
  digest: sha256:ca3d68b758d57577660a870180415210590c9ed299d80756102debb502d012f4
# postitglobal's values, from hotel_social_posts at this revision, layered in this order.
# Pinned to a commit, not main, while the app is renamed to aipostit (apps/aipostit/):
# hotel_social_posts' main stops having apps/postitglobal/, and this keeps postitglobal
# running until aipostit replaces it.
values:
  repoURL: https://github.com/easypeasyops/hotel_social_posts.git
  revision: c955f4a21196c0fbc47537ff9708d61ad42b447c
  files:
    - apps/postitglobal/deploy/service/values.yaml
    - apps/postitglobal/deploy/envs/staging.yaml

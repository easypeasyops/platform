# rust-hello's Argo CD project: what its Applications may deploy, and where. Least
# privilege, as aipostit's: the platform's service chart, rust-hello's repo (its values, in
# easypeasyops/rust-hello apps/rust-hello/deploy/) and the platform's repo (the namespace's
# baseline, deploy/app-namespace), its namespaces (staging; prod's comes with its env
# file), and one cluster-scoped thing: those namespaces themselves, which its Applications
# create (CreateNamespace in apps/applicationset.yaml; Argo CD checks the namespace it
# creates against this project).

apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: rust-hello
  namespace: argocd
spec:
  description: rust-hello's environments (apps/rust-hello/envs)
  sourceRepos:
    - oci://ghcr.io/easypeasyops/charts/service
    - https://github.com/easypeasyops/rust-hello.git
    - https://github.com/easypeasyops/platform.git
  destinations:
    # One namespace per app and environment.
    - { server: https://kubernetes.default.svc, namespace: rust-hello-staging }
  clusterResourceWhitelist: # by name: its own namespaces, no other
    - { group: "", kind: Namespace, name: rust-hello-staging }
  namespaceResourceWhitelist:
    - { group: "*", kind: "*" }

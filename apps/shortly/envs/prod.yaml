# shortly in prod: the Application shortly-prod, in namespace shortly-prod.
app: shortly
env: prod
# The platform's service chart, pinned by digest (the version is for people). Move a pin
# only to a released digest whose provenance verifies (the release's notes say how); move
# staging's first.
chart:
  version: 1.0.0
  digest: sha256:20ee5f7b145bee5d59607eb39754bc8c6db81d0565a76492c5d912aa468c9bbd
# shortly's values, from links at this revision, layered in this order.
values:
  repoURL: https://github.com/easypeasyops/links.git
  revision: main
  files:
    - deploy/service/values.yaml
    - deploy/service/slo-rules.values.yaml
    - deploy/envs/prod.yaml

# The Argo CD project for the platform (deploy/argocd/platform/): what the cluster runs
# underneath the app. Broad on purpose, and kept apart from the app's project
# (project.yaml), which may not touch anything cluster-scoped: these charts install CRDs,
# ClusterRoles and admission webhooks, so this project may too. The sources are pinned:
# this repository and the chart registries, nothing else.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: The kind cluster's platform, deployed from git (app-of-apps)
  sourceRepos:
    - https://github.com/easypeasyops/platform.git
    - oci://registry-1.docker.io/envoyproxy/gateway-helm
    - oci://ghcr.io/argoproj/argo-helm/argo-rollouts
    - oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack
    - oci://ghcr.io/kyverno/charts/kyverno
    - oci://ghcr.io/external-secrets/charts/external-secrets
    - oci://quay.io/jetstack/charts/cert-manager
    - oci://ghcr.io/cloudnative-pg/charts/cloudnative-pg
    - oci://ghcr.io/cloudnative-pg/charts/plugin-barman-cloud
  destinations:
    # Platform namespaces only: staging and prod belong to the app's project.
    - { server: https://kubernetes.default.svc, namespace: argocd } # the child Applications, tool routes
    - { server: https://kubernetes.default.svc, namespace: kube-system } # metrics-server
    - { server: https://kubernetes.default.svc, namespace: envoy-gateway-system }
    - { server: https://kubernetes.default.svc, namespace: gateway }
    - { server: https://kubernetes.default.svc, namespace: argo-rollouts }
    - { server: https://kubernetes.default.svc, namespace: monitoring }
    - { server: https://kubernetes.default.svc, namespace: kyverno }
    - { server: https://kubernetes.default.svc, namespace: backups }
    - { server: https://kubernetes.default.svc, namespace: external-secrets }
    - { server: https://kubernetes.default.svc, namespace: secret-store }
    - { server: https://kubernetes.default.svc, namespace: cert-manager }
    - { server: https://kubernetes.default.svc, namespace: cnpg-system } # CloudNativePG and its plugin
  clusterResourceWhitelist:
    - { group: "*", kind: "*" }
  namespaceResourceWhitelist:
    - { group: "*", kind: "*" }

{{- if .Values.components.monitoring }}
# Argo CD's own monitoring: its application controller scraped, and alerts on it
# (files/argocd-rules.yaml); and the front door's metrics. Part of the root, in wave 1: the CRDs come with
# kube-prometheus-stack in wave 0. Prometheus selects ServiceMonitors and rules in every
# namespace (deploy/kind/monitoring-values.yaml).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: argocd-application-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # Its CRD comes with kube-prometheus-stack in wave 0. Argo CD dry-runs every resource
    # before the first wave, and the dry run of a kind that doesn't exist yet fails the
    # whole sync (seen in CI): skip it for this one.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  selector:
    matchLabels:
      # The metrics Service the Argo CD chart creates (controller.metrics.enabled,
      # deploy/kind/argocd-values.yaml).
      app.kubernetes.io/name: argocd-metrics
      app.kubernetes.io/component: application-controller
  endpoints:
    - port: http-metrics
      interval: 30s
---
# The front door's metrics (docs/RUNBOOK.md, The front door): what the Envoy proxies saw of
# every request, the ones that never reached an app included. Here, in the root's own
# namespace, and selecting across to envoy-gateway-system: Argo CD's dry run of a resource
# in a namespace that doesn't exist yet would fail the root's first sync on a fresh cluster.
# A PodMonitor, because the proxies' Service (shortly-gateway, deploy/kind/gateway.yaml)
# carries the listeners' ports only, not the metrics port.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: envoy-proxy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true # as above
spec:
  namespaceSelector:
    matchNames: [envoy-gateway-system]
  selector:
    matchLabels:
      # The labels Envoy Gateway gives every proxy pod it runs for a Gateway.
      app.kubernetes.io/name: envoy
      app.kubernetes.io/component: proxy
      app.kubernetes.io/managed-by: envoy-gateway
  jobLabel: app.kubernetes.io/name # job="envoy", not "argocd/envoy-proxy"
  podMetricsEndpoints:
    - port: metrics
      path: /stats/prometheus
      interval: 30s
      metricRelabelings:
        # Envoy names a route's backends "httproute/<namespace>/<name>/rule/<n>": as labels
        # of their own, so a query or an alert can say which app's route it is about. Not
        # `namespace`, which is the proxy pod's.
        - sourceLabels: [envoy_cluster_name]
          regex: httproute/([^/]+)/([^/]+)/rule/\d+
          targetLabel: route_namespace
          replacement: $1
        - sourceLabels: [envoy_cluster_name]
          regex: httproute/([^/]+)/([^/]+)/rule/\d+
          targetLabel: route
          replacement: $2
---
# Envoy Gateway's controller, which turns Gateways and HTTPRoutes into the proxies'
# configuration: through the Service its chart creates, which has the metrics port.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: envoy-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true # as above
spec:
  namespaceSelector:
    matchNames: [envoy-gateway-system]
  selector:
    matchLabels:
      control-plane: envoy-gateway
  endpoints:
    - port: metrics
      interval: 30s
---
# The front door's dashboard (files/front-door-dashboard.json, uid front-door): request
# rate, error rate and latency per route, and what the proxy answered itself. Grafana's
# sidecar loads every ConfigMap labelled grafana_dashboard=1, in any namespace.
apiVersion: v1
kind: ConfigMap
metadata:
  name: front-door-dashboard
  namespace: argocd
  labels:
    grafana_dashboard: "1"
data:
  front-door.json: |-
    {{- .Files.Get "files/front-door-dashboard.json" | trim | nindent 4 }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # Its CRD comes with kube-prometheus-stack in wave 0. Argo CD dry-runs every resource
    # before the first wave, and the dry run of a kind that doesn't exist yet fails the
    # whole sync (seen in CI): skip it for this one.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  {{- .Files.Get "files/argocd-rules.yaml" | fromYaml | toYaml | nindent 2 }}
---
# Alerts on Prometheus itself that replace the stack's (files/prometheus-rules.yaml).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: platform-prometheus
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # As above: the CRD comes in wave 0.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  {{- .Files.Get "files/prometheus-rules.yaml" | fromYaml | toYaml | nindent 2 }}
---
# Alerts on the log pipeline (files/logs-rules.yaml): the collector and VictoriaLogs, which
# the `log-collector` and `logs` Applications install and their charts have scraped. In
# the root's own namespace, for the fresh cluster's dry run (as the PodMonitor above).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: log-pipeline
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # As above: the CRD comes with kube-prometheus-stack in wave 0.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  {{- .Files.Get "files/logs-rules.yaml" | fromYaml | toYaml | nindent 2 }}
---
# The alerts on External Secrets (files/external-secrets-rules.yaml). Its ServiceMonitors
# come from its own chart (deploy/kind/external-secrets-values.yaml); its namespace exists
# since wave -1.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: external-secrets
  namespace: external-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # As above: the CRD comes with kube-prometheus-stack in wave 0.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  {{- .Files.Get "files/external-secrets-rules.yaml" | fromYaml | toYaml | nindent 2 }}
{{- end }}

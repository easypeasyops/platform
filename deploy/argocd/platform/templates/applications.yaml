{{- $v := .Values }}
{{- $dest := "https://kubernetes.default.svc" }}

# --------------------------------------------- wave -2: what the platform may deploy
---
# The platform's AppProject (deploy/argocd/platform-project.yaml): which registries and
# namespaces the children may use. scripts/cluster.sh applies it once, to bootstrap; from
# then on it comes from git like the rest, so a new chart registry or namespace reaches a
# running cluster with the change that needs it (on the laptop, a child stayed Unknown
# until cluster.sh re-applied the project by hand: platform #20, #23).
{{ include "platform.meta" (dict "name" "platform-project" "wave" -2) }}
spec:
  project: platform
  source:
    repoURL: {{ $v.repoURL }}
    targetRevision: {{ $v.revision }}
    path: deploy/argocd
    directory: { include: platform-project.yaml }
  destination: { server: {{ $dest }}, namespace: argocd }
  {{- include "platform.syncPolicy" (dict) | nindent 2 }}

# ------------------------------------------- wave -1: what the other waves' Secrets need
---
# External Secrets Operator: Secrets from the platform's store (deploy/secrets/). Before
# wave 0, whose charts read those Secrets (Grafana's admin password, the bucket's keys).
{{ include "platform.meta" (dict "name" "external-secrets" "wave" -1) }}
spec:
  project: platform
  {{- include "platform.chartSources" (dict "root" $ "chart" $v.charts.externalSecrets "release" "external-secrets" "values" "deploy/kind/external-secrets-values.yaml") | nindent 2 }}
  destination: { server: {{ $dest }}, namespace: external-secrets }
  {{- include "platform.syncPolicy" (dict "labels" (dict "pod-security.kubernetes.io/enforce" "restricted")) | nindent 2 }}
---
# cert-manager: the certificates the Barman Cloud plugin (wave 0) and CloudNativePG talk
# over. Before wave 0, whose plugin chart creates an Issuer and Certificates.
{{ include "platform.meta" (dict "name" "cert-manager" "wave" -1) }}
spec:
  project: platform
  {{- include "platform.chartSources" (dict "root" $ "chart" $v.charts.certManager "release" "cert-manager" "values" "deploy/kind/cert-manager-values.yaml") | nindent 2 }}
  destination: { server: {{ $dest }}, namespace: cert-manager }
  {{- include "platform.syncPolicy" (dict "labels" (dict "pod-security.kubernetes.io/enforce" "restricted")) | nindent 2 }}

# ------------------------------------------------------------------ wave 0: charts, CRDs
---
# The secret store: the namespace holding the platform's secrets, the ClusterSecretStores
# External Secrets reads it through (`platform`; `backup-bucket`, the bucket's keys for the
# apps' databases; one per app for its own keys, app-stores.yaml), and the generators that
# make each value once.
{{ include "platform.meta" (dict "name" "secret-store" "wave" 0) }}
spec:
  project: platform
  source:
    repoURL: {{ $v.repoURL }}
    targetRevision: {{ $v.revision }}
    path: deploy/secrets
    directory: { include: "{store.yaml,bucket-store.yaml,app-stores.yaml,generated.yaml}" }
  destination: { server: {{ $dest }}, namespace: secret-store }
  {{- include "platform.syncPolicy" (dict "labels" (dict "pod-security.kubernetes.io/enforce" "restricted")) | nindent 2 }}
---
# CloudNativePG: the operator that runs each app's Postgres (a Cluster the service chart
# renders in the app's namespace). Owns the namespace's labels; the plugin shares it.
{{ include "platform.meta" (dict "name" "cloudnative-pg" "wave" 0) }}
spec:
  project: platform
  {{- include "platform.chartSources" (dict "root" $ "chart" $v.charts.cloudnativePG "release" "cloudnative-pg" "values" "deploy/kind/cloudnative-pg-values.yaml") | nindent 2 }}
  destination: { server: {{ $dest }}, namespace: cnpg-system }
  {{- include "platform.syncPolicy" (dict "labels" (dict "pod-security.kubernetes.io/enforce" "restricted")) | nindent 2 }}
---
# The Barman Cloud plugin: the databases' base backups and WAL archive in the bucket. In the
# operator's namespace, as the plugin requires; the namespace's labels are set once, by the
# cloudnative-pg Application (two Applications managing them would fight).
{{ include "platform.meta" (dict "name" "barman-cloud" "wave" 0) }}
spec:
  project: platform
  {{- include "platform.chartSources" (dict "root" $ "chart" $v.charts.barmanCloud "release" "plugin-barman-cloud" "values" "deploy/kind/barman-cloud-values.yaml") | nindent 2 }}
  destination: { server: {{ $dest }}, namespace: cnpg-system }
  {{- include "platform.syncPolicy" (dict) | nindent 2 }}
{{- if $v.components.metricsServer }}
---
# metrics-server: CPU usage for the HorizontalPodAutoscaler. A vendored upstream manifest
# plus one kind-only patch (deploy/platform/metrics-server/).
{{ include "platform.meta" (dict "name" "metrics-server" "wave" 0) }}
spec:
  project: platform
  source:
    repoURL: {{ $v.repoURL }}
    targetRevision: {{ $v.revision }}
    path: deploy/platform/metrics-server
  destination: { server: {{ $dest }}, namespace: kube-system }
  {{- include "platform.syncPolicy" (dict) | nindent 2 }}
{{- end }}
---
# Envoy Gateway: the controller behind the cluster's front door (Gateway API).
{{ include "platform.meta" (dict "name" "envoy-gateway" "wave" 0) }}
spec:
  project: platform
  {{- include "platform.chartSources" (dict "root" $ "chart" $v.charts.envoyGateway "release" "eg" "values" "deploy/kind/envoy-gateway-values.yaml") | nindent 2 }}
  destination: { server: {{ $dest }}, namespace: envoy-gateway-system }
  # baseline: the Envoy proxy pods the controller creates don't all meet "restricted".
  {{- include "platform.syncPolicy" (dict "labels" (dict "pod-security.kubernetes.io/enforce" "baseline")) | nindent 2 }}
---
# Argo Rollouts: prod's canary releases, with the Gateway API traffic-router plugin for
# this node's architecture.
{{- $plugin := dict "name" "argoproj-labs/gatewayAPI" "location" (printf "https://github.com/argoproj-labs/rollouts-plugin-trafficrouter-gatewayapi/releases/download/%s/gatewayapi-plugin-linux-%s" $v.gatewayAPIPlugin.version $v.arch) "sha256" (required (printf "no Gateway API plugin checksum for arch %q" $v.arch) (get $v.gatewayAPIPlugin.sha256 $v.arch)) }}
{{ include "platform.meta" (dict "name" "argo-rollouts" "wave" 0) }}
spec:
  project: platform
  {{- include "platform.chartSources" (dict "root" $ "chart" $v.charts.argoRollouts "release" "argo-rollouts" "values" "deploy/kind/argo-rollouts-values.yaml" "valuesObject" (dict "controller" (dict "trafficRouterPlugins" (list $plugin)))) | nindent 2 }}
  destination: { server: {{ $dest }}, namespace: argo-rollouts }
  {{- include "platform.syncPolicy" (dict "labels" (dict "pod-security.kubernetes.io/enforce" "restricted")) | nindent 2 }}
{{- if $v.components.argocd }}
---
# Argo CD itself (PT-109): scripts/cluster.sh bootstraps it with Helm, from the same pin and
# values file; from then on this Application owns it, so a merged change to its values
# reaches the cluster like any other. The same release name as Helm's, so it adopts the
# same objects. Guards against it breaking itself: its CRDs are never pruned (Prune=false,
# deploy/kind/argocd-values.yaml), and automated sync refuses to prune everything (no
# allowEmpty). No namespace metadata: cluster.sh makes the namespace and its labels.
{{ include "platform.meta" (dict "name" "argocd" "wave" 0) }}
spec:
  project: platform
  {{- include "platform.chartSources" (dict "root" $ "chart" $v.charts.argocd "release" "argocd" "values" "deploy/kind/argocd-values.yaml") | nindent 2 }}
  destination: { server: {{ $dest }}, namespace: argocd }
  {{- include "platform.syncPolicy" (dict) | nindent 2 }}
{{- end }}
{{- if $v.components.monitoring }}
---
# kube-prometheus-stack, and the ExternalSecret that makes its Grafana admin login from the
# store (deploy/secrets/monitoring.yaml). With `components.slack`, also the ExternalSecret
# for Slack's bot token (deploy/secrets/alertmanager-slack.yaml); without, neither it nor
# Alertmanager's mount of its Secret: both would wait for good on a token nobody loaded.
{{- $slackFiles := ternary "deploy/secrets/{monitoring.yaml,alertmanager-slack.yaml}" "deploy/secrets/monitoring.yaml" $v.components.slack }}
{{- $noSlack := ternary (dict) (dict "alertmanager" (dict "alertmanagerSpec" (dict "secrets" (list)))) $v.components.slack }}
{{ include "platform.meta" (dict "name" "monitoring" "wave" 0) }}
spec:
  project: platform
  {{- include "platform.chartSources" (dict "root" $ "chart" $v.charts.kubePrometheusStack "release" "monitoring" "values" "deploy/kind/monitoring-values.yaml" "extra" $slackFiles "valuesObject" $noSlack) | nindent 2 }}
  destination: { server: {{ $dest }}, namespace: monitoring }
  # Every pod of the stack and of VictoriaLogs meets "restricted" (tests/test_platform.py);
  # node-exporter, which never could, has a namespace of its own (below).
  {{- include "platform.syncPolicy" (dict "labels" (dict "pod-security.kubernetes.io/enforce" "restricted")) | nindent 2 }}
  ignoreDifferences:
    # The chart's admission-webhook Job writes the CA bundle into these after install.
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions: [".webhooks[]?.clientConfig.caBundle"]
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions: [".webhooks[]?.clientConfig.caBundle"]
---
# VictoriaLogs: where the pods' logs are kept (docs/RUNBOOK.md, Logs). In kube-prometheus-stack's
# namespace, beside Grafana; the namespace's labels are set once, by the monitoring
# Application (two Applications managing them would fight). Its ServiceMonitor's CRD comes
# with that Application, in the same wave: the sync retry covers the race.
{{ include "platform.meta" (dict "name" "logs" "wave" 0) }}
spec:
  project: platform
  {{- include "platform.chartSources" (dict "root" $ "chart" $v.charts.victoriaLogs "release" "logs" "values" "deploy/kind/victoria-logs-values.yaml") | nindent 2 }}
  destination: { server: {{ $dest }}, namespace: monitoring }
  {{- include "platform.syncPolicy" (dict) | nindent 2 }}
---
# vlagent: reads every container's log file on the node and sends the lines to VictoriaLogs.
# A namespace of its own, because it needs "privileged": Pod Security allows a hostPath
# volume at no other level. Nothing else goes in it
# (deploy/kind/log-collector-values.yaml says what the pod gets).
{{ include "platform.meta" (dict "name" "log-collector" "wave" 0) }}
spec:
  project: platform
  {{- include "platform.chartSources" (dict "root" $ "chart" $v.charts.logCollector "release" "log-collector" "values" "deploy/kind/log-collector-values.yaml") | nindent 2 }}
  destination: { server: {{ $dest }}, namespace: log-collector }
  {{- include "platform.syncPolicy" (dict "labels" (dict "pod-security.kubernetes.io/enforce" "privileged")) | nindent 2 }}
---
# kubernetes-event-exporter: every Kubernetes event as a line on its stdout, which the log
# collector carries to VictoriaLogs, so the events outlive the API server's hour. With the
# logs, or it would write for nobody (deploy/kind/event-exporter.yaml).
{{ include "platform.meta" (dict "name" "event-exporter" "wave" 0) }}
spec:
  project: platform
  source:
    repoURL: {{ $v.repoURL }}
    targetRevision: {{ $v.revision }}
    path: deploy/kind
    directory: { include: event-exporter.yaml }
  destination:
    server: {{ $dest }}
    namespace: event-exporter
  {{- include "platform.syncPolicy" (dict "labels" (dict "pod-security.kubernetes.io/enforce" "restricted")) | nindent 2 }}
---
# node-exporter: the node's CPU, memory and disk, scraped by Prometheus. Its own chart, not
# the one kube-prometheus-stack bundles, and a namespace of its own for the same reason as
# the log collector: it reads the node through hostPath volumes, so the namespace is at
# "privileged" and nothing else goes in it (deploy/kind/node-exporter-values.yaml says what
# the pod gets). Its PodMonitor's CRD comes with the monitoring Application, in the same
# wave: the sync retry covers the race.
{{ include "platform.meta" (dict "name" "node-exporter" "wave" 0) }}
spec:
  project: platform
  {{- include "platform.chartSources" (dict "root" $ "chart" $v.charts.nodeExporter "release" "node-exporter" "values" "deploy/kind/node-exporter-values.yaml") | nindent 2 }}
  destination: { server: {{ $dest }}, namespace: node-exporter }
  {{- include "platform.syncPolicy" (dict "labels" (dict "pod-security.kubernetes.io/enforce" "privileged")) | nindent 2 }}
---
# The blackbox exporter: asks for each app's page through the front door, as a user would
# (docs/RUNBOOK.md, The front door; deploy/kind/blackbox-exporter-values.yaml). In
# kube-prometheus-stack's namespace, beside Prometheus, the only one that may ask it; the
# namespace's labels are set once, by the monitoring Application.
{{ include "platform.meta" (dict "name" "blackbox-exporter" "wave" 0) }}
spec:
  project: platform
  {{- include "platform.chartSources" (dict "root" $ "chart" $v.charts.blackboxExporter "release" "blackbox-exporter" "values" "deploy/kind/blackbox-exporter-values.yaml") | nindent 2 }}
  destination: { server: {{ $dest }}, namespace: monitoring }
  {{- include "platform.syncPolicy" (dict) | nindent 2 }}
{{- end }}
{{- if $v.components.policies }}
---
# Kyverno: admission control for staging and prod (deploy/policies/, wave 1).
{{ include "platform.meta" (dict "name" "kyverno" "wave" 0) }}
spec:
  project: platform
  {{- include "platform.chartSources" (dict "root" $ "chart" $v.charts.kyverno "release" "kyverno" "values" "deploy/kind/kyverno-values.yaml") | nindent 2 }}
  destination: { server: {{ $dest }}, namespace: kyverno }
  {{- include "platform.syncPolicy" (dict "labels" (dict "pod-security.kubernetes.io/enforce" "restricted")) | nindent 2 }}
{{- end }}
{{- if $v.components.backups }}
---
# The backup bucket (SeaweedFS S3), and the ExternalSecret that makes its S3 identity from
# the store (deploy/secrets/backups.yaml).
{{ include "platform.meta" (dict "name" "backups" "wave" 0) }}
spec:
  project: platform
  sources:
    - repoURL: {{ $v.repoURL }}
      targetRevision: {{ $v.revision }}
      path: deploy/kind
      directory: { include: backups.yaml }
    - repoURL: {{ $v.repoURL }}
      targetRevision: {{ $v.revision }}
      path: deploy/secrets
      directory: { include: backups.yaml }
  destination: { server: {{ $dest }}, namespace: backups }
  {{- include "platform.syncPolicy" (dict "labels" (dict "pod-security.kubernetes.io/enforce" "restricted")) | nindent 2 }}
---
# The restore drills' namespace, what the drills run as, and the bucket's keys for their
# scratch Clusters (deploy/restore-drill/; the CronJobs come from Kyverno, PT-44).
{{ include "platform.meta" (dict "name" "restore-drill" "wave" 0) }}
spec:
  project: platform
  source:
    repoURL: {{ $v.repoURL }}
    targetRevision: {{ $v.revision }}
    path: deploy/restore-drill
  destination: { server: {{ $dest }}, namespace: restore-drill }
  {{- include "platform.syncPolicy" (dict "labels" (dict "pod-security.kubernetes.io/enforce" "restricted")) | nindent 2 }}
{{- end }}

# The Gateway and the tool routes need only Envoy Gateway's CRDs, which arrive within
# seconds of wave 0 starting: until then their first sync fails and the retry (5 s, then
# 10 s...) catches up. In wave 1 they would wait for the slowest chart instead, and the
# Envoy proxy's start (about 2 minutes) would no longer overlap with it (seen in CI).
---
# The Gateway itself: its two listeners, and the NodePort Service the front door reaches.
{{ include "platform.meta" (dict "name" "gateway" "wave" 0) }}
spec:
  project: platform
  source:
    repoURL: {{ $v.repoURL }}
    targetRevision: {{ $v.revision }}
    path: deploy/kind
    directory: { include: gateway.yaml }
  destination: { server: {{ $dest }}, namespace: gateway }
  {{- include "platform.syncPolicy" (dict) | nindent 2 }}
---
# The dev tools' routes on the Gateway's `tools` listener (Argo CD always; the monitoring
# UIs when the stack is installed).
{{ include "platform.meta" (dict "name" "tool-routes" "wave" 0) }}
spec:
  project: platform
  source:
    repoURL: {{ $v.repoURL }}
    targetRevision: {{ $v.revision }}
    path: deploy/kind/tools
    directory: { include: {{ ternary "'{argocd.yaml,monitoring.yaml}'" "argocd.yaml" $v.components.monitoring }} }
  destination: { server: {{ $dest }}, namespace: argocd }
  {{- include "platform.syncPolicy" (dict) | nindent 2 }}

# --------------------------------------------- wave 1: what needs a slow chart running
{{- if $v.components.policies }}
---
# The admission policies. Kyverno's webhook validates them, so they wait for wave 0.
{{ include "platform.meta" (dict "name" "kyverno-policies" "wave" 1) }}
spec:
  project: platform
  source:
    repoURL: {{ $v.repoURL }}
    targetRevision: {{ $v.revision }}
    path: deploy/policies
  destination: { server: {{ $dest }}, namespace: kyverno }
  {{- include "platform.syncPolicy" (dict) | nindent 2 }}
{{- if $v.components.monitoring }}
---
# The provenance canary: a CronJob that asks, as a dry-run, for a Pod with a released image
# to be admitted, so a provenance policy that refuses releases is noticed before a deploy
# (deploy/kind/provenance-canary.yaml). Its CronJob runs in `monitoring`; the namespace
# here is the one it asks in, empty, with the label the policies select the apps'
# namespaces by. With the policies and the monitoring stack, or it would watch nothing for
# nobody.
{{ include "platform.meta" (dict "name" "provenance-canary" "wave" 1) }}
spec:
  project: platform
  source:
    repoURL: {{ $v.repoURL }}
    targetRevision: {{ $v.revision }}
    path: deploy/kind
    directory: { include: provenance-canary.yaml }
  destination:
    server: {{ $dest }}
    namespace: provenance-canary
  {{- /* app "shortly": the app of the image the canary asks for, so the allowlist policy
  (deploy/policies/allowed-images.yaml) has nothing to say about it. */}}
  {{- include "platform.syncPolicy" (dict "labels" (dict "pod-security.kubernetes.io/enforce" "restricted" "easypeasyops.github.io/app" "shortly")) | nindent 2 }}
{{- end }}
{{- end }}
{{- if $v.components.monitoring }}
---
# The chaos drill (deploy/platform/chaos-drill/): once a week it holds the External Secrets
# controller down until its alert reaches Alertmanager, then checks both come back. Its
# CronJob runs in `monitoring`, with the stack whose alert it checks.
{{ include "platform.meta" (dict "name" "chaos-drill" "wave" 1) }}
spec:
  project: platform
  source:
    repoURL: {{ $v.repoURL }}
    targetRevision: {{ $v.revision }}
    path: deploy/platform/chaos-drill
  destination: { server: {{ $dest }}, namespace: monitoring }
  {{- include "platform.syncPolicy" (dict) | nindent 2 }}
{{- end }}

# The platform under Argo CD (DESIGN, GitOps with Argo CD). scripts/cluster.sh sets the
# first block through the root Application's Helm parameters; the rest is the pin list.

# Where the git-backed children (manifests, policies, values files) come from. `main` on a
# laptop: a merged platform change reaches the cluster within a minute, like an app
# promotion. CI sets the PR's commit.
repoURL: https://github.com/easypeasyops/platform.git
revision: main
# The node's CPU architecture: the Argo Rollouts plugin is a per-architecture binary
# (amd64 in CI, arm64 on Apple silicon). cluster.sh reads it from the node.
arch: amd64
# What to install (cluster.sh's MONITORING, POLICIES, BACKUPS knobs; CI's delivery job
# skips the last two).
components:
  monitoring: true
  # Alertmanager posts to Slack: needs the webhooks in the store, which only a person can
  # load (RUNBOOK, Slack alerts). cluster.sh sets it from whether they are there.
  slack: true
  policies: true
  backups: true

# What the blackbox exporter asks for through the front door, every minute, as a user would
# (templates/monitoring.yaml: one Probe each; docs/RUNBOOK.md, The front door). A list in
# git, since Prometheus can't discover an HTTPRoute: scripts/check-apps.py fails CI when
# the `http` entries and the hostnames the apps' routes serve (their values, rendered as
# Argo CD renders them) disagree; tests/test_front_door.py, the same for the tool routes.
#   listener  the Gateway listener the hostname is on (a blackbox module per listener)
#   path      a page that answers 200 without a login: /healthz for an app (the service
#             chart's liveness probe, so the app contract), each tool's own health page
frontDoorProbes:
  - { hostname: aipostit.localhost, listener: http, path: /healthz } # aipostit-prod
  - { hostname: staging.aipostit.localhost, listener: http, path: /healthz } # aipostit-staging
  - { hostname: argocd.localhost, listener: tools, path: /healthz }
  - { hostname: grafana.localhost, listener: tools, path: /api/health }
  - { hostname: prometheus.localhost, listener: tools, path: /-/healthy }
  - { hostname: alertmanager.localhost, listener: tools, path: /-/healthy }


  # Argo CD v3.5.6 itself: scripts/cluster.sh bootstraps it with Helm before the platform,
  # from this pin and deploy/kind/argocd-values.yaml; the `argocd` Application, the same.
  argocd:
    repo: oci://ghcr.io/argoproj/argo-helm/argo-cd
    version: 10.11.1
    digest: sha256:2ac5224a5c201789f96aa9e085673d80732591d1b3e815a8a825a4db6d1d7c88
  kyverno: # Kyverno v1.19.1, the engine tests/test_admission_policies.py runs

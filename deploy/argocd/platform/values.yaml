# The platform under Argo CD (DESIGN, GitOps with Argo CD). scripts/cluster.sh sets the
# first block through the root Application's Helm parameters; the rest is the pin list.

# Where the git-backed children (manifests, policies, values files) come from. `main` on a
# laptop: a merged platform change reaches the cluster within a minute, like an app
# promotion. CI sets the PR's commit.
repoURL: https://github.com/easypeasyops/platform.git
revision: main
# The node's CPU architecture: the Argo Rollouts plugin is a per-architecture binary
# (amd64 in CI, arm64 on Apple silicon). cluster.sh reads it from the node.
arch: amd64
# What to install (cluster.sh's MONITORING, POLICIES, BACKUPS knobs; CI's delivery job
# skips the last two).
components:
  monitoring: true
  # Alertmanager posts to Slack: needs the bot token in the store, which only a person can
  # get from Slack (RUNBOOK, Slack alerts). cluster.sh sets it: on unless SLACK=0, and only
  # where the store has the token (without it, `up` fails after the rest is up).
  slack: true
  policies: true
  backups: true
  # The resource metrics API (cluster contract, resource metrics): off where the cluster
  # serves its own, as GKE does (modules/gke's cluster_components).
  metricsServer: true
  # Argo CD managing its own install (the `argocd` Application, PT-109). Off by default, so
  # a running cluster adopts it only when cluster.sh sets it (its next `up` or `install`),
  # where the Helm records are handed over in the same run, not on the merge.
  argocd: false

# What the blackbox exporter asks for through the front door, every minute, as a user would
# (templates/monitoring.yaml: one Probe each; docs/RUNBOOK.md, The front door): the tools'
# health pages. The apps' hostnames are in apps/front-door-probes.yaml (appFrontDoorProbes),
# which the root adds as a values file. Lists in git, since Prometheus can't discover an
# HTTPRoute: scripts/check-apps.py fails CI when the two lists and the hostnames the apps'
# routes serve (their values, rendered as Argo CD renders them), each on its listener,
# disagree; tests/test_front_door.py, the same for the tool routes (deploy/kind/tools/).
#   listener  the Gateway listener the hostname is on (a blackbox module per listener)
#   path      a page that answers 200 without a login: each tool's own health page
frontDoorProbes:
  - { hostname: argocd.localhost, listener: tools, path: /healthz }
  - { hostname: grafana.localhost, listener: tools, path: /api/health }
  - { hostname: prometheus.localhost, listener: tools, path: /-/healthy }
  - { hostname: alertmanager.localhost, listener: tools, path: /-/healthy }
  - { hostname: servicemonitor.localhost, listener: tools, path: /healthz } # servicemonitor-ops

# Helm charts, pulled by Argo CD from their OCI registries by DIGEST: the tag says what it

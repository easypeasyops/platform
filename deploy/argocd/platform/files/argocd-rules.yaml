# Alerts on Argo CD itself. With GitOps a merged promotion IS the deploy: if Argo CD stops
# syncing, nothing fails loudly, the merge just never lands. These make that loud.
# Shipped as a PrometheusRule by the platform chart (templates/monitoring.yaml); tested by
# deploy/prometheus/tests/argocd_test.yaml (promtool). Metrics: the application controller
# (argocd_app_info, argocd_app_sync_total) and the repo server (argocd_git_*), scraped
# through templates/monitoring.yaml.
groups:
  - name: argocd
    rules:
      - alert: ArgoCDDown
        # No controller scraped: no syncs, no self-heal, and the alerts below are blind.
        expr: absent(up{job="argocd-application-controller-metrics"} == 1)
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: Argo CD's application controller isn't running (or isn't scraped)
          description: Nothing in git reaches the cluster while it is down, and drift goes uncorrected. Running workloads are unaffected.
          runbook_url: https://github.com/easypeasyops/platform/blob/main/docs/RUNBOOK.md#argo-cd-alerts
      - alert: ArgoCDAppOutOfSync
        # Auto-sync applies a merge within about a minute; 15 minutes out of sync means it is
        # failing, or someone turned auto-sync off. (Unknown: Argo CD can't even compare.)
        expr: max by (name, project) (argocd_app_info{sync_status!="Synced"}) == 1
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.name }} has differed from git for 15 minutes"
          description: What runs is not what git says. A merged promotion or platform change hasn't landed, or someone changed the cluster by hand and self-heal can't undo it.
          runbook_url: https://github.com/easypeasyops/platform/blob/main/docs/RUNBOOK.md#argo-cd-alerts
      - alert: ArgoCDAppUnhealthy
        # Degraded (an aborted canary, a crash-looping pod), Missing (resources gone), or
        # Unknown. Not Progressing or Suspended: a canary between steps is both, for minutes.
        expr: max by (name, project) (argocd_app_info{health_status=~"Degraded|Missing|Unknown"}) == 1
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.name }} has been unhealthy for 10 minutes"
          description: Argo CD reports the application's resources as not working. For shortly-prod the SLO alerts say whether users notice; this one says the release itself needs attention.
          runbook_url: https://github.com/easypeasyops/platform/blob/main/docs/RUNBOOK.md#argo-cd-alerts
      - alert: ArgoCDSyncFailed
        # A sync that errored, even if a retry later succeeded: worth a look, not a page.
        expr: sum by (name, project) (increase(argocd_app_sync_total{phase=~"Error|Failed"}[15m])) > 0
        labels:
          severity: ticket
        annotations:
          summary: "Syncing {{ $labels.name }} failed in the last 15 minutes"
          description: Argo CD tried to apply git and the cluster refused (an admission policy, a bad manifest, a failed migration hook).
          runbook_url: https://github.com/easypeasyops/platform/blob/main/docs/RUNBOOK.md#argo-cd-alerts
      - alert: ArgoCDCantReachGit
        # The repo server failing to ls-remote or fetch: GitHub (or an app's repo) unreachable,
        # or its credentials refused. Every Application stays Synced and Healthy at the last
        # commit it saw, so nothing above fires. Summed over every repo: the failure
        # counters' `repo` is the repo server's checkout path, not the URL, so it names
        # nothing useful and can't be matched with argocd_git_request_total. A failure in
        # every 10 minutes for an hour: a blip, or the laptop offline for less than about
        # 50 minutes (a train ride), stays quiet. Quiet too while the repo server isn't
        # scraped (no series).
        expr: sum(increase({__name__=~"argocd_git_(lsremote|fetch)_fail_total"}[10m])) > 0
        for: 1h
        labels:
          severity: ticket
        annotations:
          summary: Argo CD has failed to read git for an hour
          description: Every Application stays Synced at the last commit Argo CD saw, so a merged change (a promotion included) never lands. Running workloads are unaffected.
          runbook_url: https://github.com/easypeasyops/platform/blob/main/docs/RUNBOOK.md#argo-cd-alerts

# Alerts on Argo Rollouts, which runs prod's canary releases: the controller, a canary
# aborted by an analysis that ended in Error (it couldn't measure: Prometheus didn't answer,
# the k6 Job didn't run) rather than Failed (it measured, and the release was bad), and a
# canary that stopped part-way without aborting: left paused, or timed out; and the
# controller running but failing, pass after pass, on one Rollout or AnalysisRun.
# Shipped as a PrometheusRule by the platform chart (templates/monitoring.yaml); tested by
# deploy/prometheus/tests/argo_rollouts_test.yaml (promtool). Metrics: the controller's,
# through the ServiceMonitor beside the rule; their own `namespace`, the Rollout's, is kept
# as exported_namespace.
# Severity warning, namespace argo-rollouts: what Alertmanager sends to the platform's
# channel (deploy/kind/monitoring-values.yaml), whichever app the Rollout belongs to. Not
# the app's channel too: an Error is the platform's to fix, and the app's channel already
# hears of the aborted canary from Argo CD (ArgoCDAppUnhealthy). The channel's message is
# the description, so it names the Rollout.
groups:
  - name: argo-rollouts
    rules:
      - alert: ArgoRolloutsControllerDown
        # 10 minutes: a restart takes seconds (with the Gateway API plugin's download), and
        # nothing in flight is lost meanwhile, only stalled.
        expr: absent(up{job="argo-rollouts"} == 1)
        for: 10m
        labels:
          severity: warning
          namespace: argo-rollouts # absent() has none to give: named for the route
        annotations:
          summary: The Argo Rollouts controller isn't running (or isn't scraped)
          description: The Argo Rollouts controller hasn't been scraped for 10 minutes. While it is down no release to prod starts, and a canary in flight neither moves on nor aborts.
          runbook_url: https://github.com/easypeasyops/platform/blob/main/docs/RUNBOOK.md#argo-rollouts-alerts
      - alert: CanaryAnalysisErrored
        # An AnalysisRun in Error, while its Rollout is aborted (rollout_info's phase "Abort";
        # a retry or a new release ends it). Its runs are kept after the abort, so the
        # Rollout's state is what makes the alert end. The Rollout is the run's owner, which
        # kube-state-metrics exports (argo_rollouts_analysisrun_owner_info,
        # deploy/kind/monitoring-values.yaml): not read from the run's name
        # (<rollout>-<pod hash>-<revision>...), which a Rollout named like "web-cdn-2" makes
        # ambiguous. So no owner series (kube-state-metrics down), no alert. max by on the
        # owner: two series for a run while kube-state-metrics restarts are still one owner.
        expr: |-
          max by (exported_namespace, rollout, analysisrun) (
            label_replace(analysis_run_info{phase="Error"}, "analysisrun", "$1", "name", "(.+)")
            * on (exported_namespace, analysisrun) group_left (rollout)
            max by (exported_namespace, analysisrun, rollout) (
              label_replace(argo_rollouts_analysisrun_owner_info{owner_kind="Rollout"}, "rollout", "$1", "owner", "(.+)")
            )
          )
          and on (exported_namespace, rollout)
            label_replace(rollout_info{phase="Abort"}, "rollout", "$1", "name", "(.+)")
        labels:
          severity: warning
          namespace: argo-rollouts
        annotations:
          summary: "Canary of {{ $labels.exported_namespace }}/{{ $labels.rollout }} aborted: its analysis errored"
          description: "Rollout {{ $labels.exported_namespace }}/{{ $labels.rollout }} is aborted, and its AnalysisRun {{ $labels.analysisrun }} ended in Error: it couldn't take its measurements (Prometheus didn't answer, or the k6 Job didn't run). That is the platform's to fix, not a verdict on the release. It stays aborted until it is retried or a new release starts."
          runbook_url: https://github.com/easypeasyops/platform/blob/main/docs/RUNBOOK.md#argo-rollouts-alerts
      - alert: CanaryPausedTooLong
        # rollout_info's phase is the Progressing condition's reason (the controller's
        # calculatePhase): "Paused" while the Rollout has any pause condition. A timed pause
        # step (the service chart's canary.pauseWithoutAnalysis, 60s a step) is one too, and
        # at a 15s scrape consecutive steps can read as one pause, so 30 minutes: longer than
        # every pause step of a release together. What is left is a pause nothing ends by
        # itself: an Inconclusive analysis, or `spec.paused` set by hand. Argo CD shows the
        # Application as Suspended, which ArgoCDAppUnhealthy leaves out, so nothing else says
        # it. By (exported_namespace, rollout), so a controller restart doesn't start the
        # 30 minutes again.
        expr: |-
          max by (exported_namespace, rollout) (
            label_replace(rollout_info{phase="Paused"}, "rollout", "$1", "name", "(.+)")
          ) == 1
        for: 30m
        labels:
          severity: warning
          namespace: argo-rollouts
        annotations:
          summary: "Canary of {{ $labels.exported_namespace }}/{{ $labels.rollout }} has been paused for 30 minutes"
          description: "Rollout {{ $labels.exported_namespace }}/{{ $labels.rollout }} has been paused for 30 minutes, longer than its timed steps take: an analysis ended Inconclusive, or it was paused by hand. The release is part-way: some traffic on the new version, and it neither moves on nor aborts until someone promotes or aborts it."
          runbook_url: https://github.com/easypeasyops/platform/blob/main/docs/RUNBOOK.md#argo-rollouts-alerts
      - alert: CanaryTimedOut
        # Phase "Timeout": the new pods weren't ready within progressDeadlineSeconds and the
        # Rollout stays as it is. Not the service chart's Rollouts: they set
        # progressDeadlineAbort, so the controller aborts them in the same pass (phase
        # "Abort", Argo CD Degraded: ArgoCDAppUnhealthy, to the app's channel). 5 minutes, so
        # that pass, or pods that get ready just after the deadline, don't alert.
        expr: |-
          max by (exported_namespace, rollout) (
            label_replace(rollout_info{phase="Timeout"}, "rollout", "$1", "name", "(.+)")
          ) == 1
        for: 5m
        labels:
          severity: warning
          namespace: argo-rollouts
        annotations:
          summary: "Canary of {{ $labels.exported_namespace }}/{{ $labels.rollout }} timed out: its new pods aren't ready"
          description: "Rollout {{ $labels.exported_namespace }}/{{ $labels.rollout }} passed its progress deadline: the new version's pods didn't become ready in time, and it is not set to abort by itself. The release is stuck where it stopped until the pods get ready, or someone aborts or retries it."
          runbook_url: https://github.com/easypeasyops/platform/blob/main/docs/RUNBOOK.md#argo-rollouts-alerts
      - alert: ArgoRolloutsReconcileFailing
        # rollout_reconcile_error counts every pass over a Rollout that returned an error (an API error, an object
        # it can't patch, the Gateway API plugin refusing a route). The controller retries
        # with a backoff of at most 10 seconds (its DefaultArgoRolloutsRateLimiter), so a
        # failure that lasts shows in every 5 minutes, and one error, or a burst that a retry
        # ends, is gone from the window 5 minutes later: 15 minutes of it is a failure that
        # isn't going away. increase(), not the value: the counter starts at 0 with the
        # controller, and is summed over its pods so a restart doesn't start the 15 minutes
        # again.
        expr: |-
          sum by (exported_namespace, name) (increase(rollout_reconcile_error[5m])) > 0
        for: 15m
        labels:
          severity: warning
          namespace: argo-rollouts
          kind: Rollout
        annotations:
          summary: "Argo Rollouts keeps failing to reconcile Rollout {{ $labels.exported_namespace }}/{{ $labels.name }}"
          description: "The Argo Rollouts controller has failed every attempt to reconcile Rollout {{ $labels.exported_namespace }}/{{ $labels.name }} for 15 minutes. The controller itself is running; this Rollout's release doesn't move, and neither aborts nor finishes. Its log says why: kubectl -n argo-rollouts logs deploy/argo-rollouts | grep {{ $labels.name }}"
          runbook_url: https://github.com/easypeasyops/platform/blob/main/docs/RUNBOOK.md#argo-rollouts-alerts
      - alert: ArgoRolloutsReconcileFailing
        # analysis_run_reconcile_error counts every pass over an AnalysisRun that returned an error (an API error, an object
        # it can't patch, the Gateway API plugin refusing a route). The controller retries
        # with a backoff of at most 10 seconds (its DefaultArgoRolloutsRateLimiter), so a
        # failure that lasts shows in every 5 minutes, and one error, or a burst that a retry
        # ends, is gone from the window 5 minutes later: 15 minutes of it is a failure that
        # isn't going away. increase(), not the value: the counter starts at 0 with the
        # controller, and is summed over its pods so a restart doesn't start the 15 minutes
        # again.
        expr: |-
          sum by (exported_namespace, name) (increase(analysis_run_reconcile_error[5m])) > 0
        for: 15m
        labels:
          severity: warning
          namespace: argo-rollouts
          kind: AnalysisRun
        annotations:
          summary: "Argo Rollouts keeps failing to reconcile AnalysisRun {{ $labels.exported_namespace }}/{{ $labels.name }}"
          description: "The Argo Rollouts controller has failed every attempt to reconcile AnalysisRun {{ $labels.exported_namespace }}/{{ $labels.name }} for 15 minutes. The controller itself is running; this run takes no measurements, so the canary waiting on it doesn't move. Its log says why: kubectl -n argo-rollouts logs deploy/argo-rollouts | grep {{ $labels.name }}"
          runbook_url: https://github.com/easypeasyops/platform/blob/main/docs/RUNBOOK.md#argo-rollouts-alerts

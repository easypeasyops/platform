# Alerts on the front door (docs/RUNBOOK.md, The front door), from the HTTPRoutes' status,
# which kube-state-metrics turns into series (deploy/kind/monitoring-values.yaml). An app's
# own alerts can't see a request that never reached it. Shipped as a PrometheusRule by the
# platform chart; tested by deploy/prometheus/tests/front_door_test.yaml (promtool).
groups:
  - name: front-door
    rules:
      - alert: FrontDoorRouteWithoutBackend
        # Envoy Gateway gives a route whose Service has no ready pod (503), or doesn't exist
        # (500), no Envoy cluster: the proxy answers itself, and counts that per listener
        # only. The route's status says which route: BackendsAvailable False
        # (EndpointsNotFound) or ResolvedRefs False (BackendNotFound). So this names the
        # route, and needs no traffic to it. Aggregated to the route's own labels, without
        # kube-state-metrics' pod or namespace: Alertmanager routes it by its name alone.
        # 5 minutes of it: a single pod restarting is not a ticket.
        expr: |
          max by (route_namespace, route, type, reason) (
            gateway_httproute_status_condition{job="kube-state-metrics", type=~"BackendsAvailable|ResolvedRefs"}
          ) == 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "Route {{ $labels.route_namespace }}/{{ $labels.route }} has no backend to send to ({{ $labels.reason }}): the front door answers 5xx itself"
          description: Requests to a route whose Service has no ready pod, or doesn't exist, get a 503 or 500 from the proxy. They never reach the app, so its own metrics and alerts don't show them.
          runbook_url: https://github.com/easypeasyops/platform/blob/main/docs/RUNBOOK.md#a-route-with-no-backend

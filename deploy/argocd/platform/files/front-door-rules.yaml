# Alerts on the front door (docs/RUNBOOK.md, The front door): the one path every user
# request takes. Its proxies and its controller, from `up` (the PodMonitor and the
# ServiceMonitor in templates/monitoring.yaml); the routes, from the HTTPRoutes' status,
# which kube-state-metrics turns into series (deploy/kind/monitoring-values.yaml). An app's
# own alerts can't see a request that never reached it. Shipped as a PrometheusRule by the
# platform chart; tested by deploy/prometheus/tests/front_door_test.yaml (promtool).
groups:
  - name: front-door
    rules:
      - alert: FrontDoorDown
        # No proxy scraped: every app and every tool is unreachable from outside, and
        # nothing else says so (probes and Prometheus go around the Gateway; with the pod
        # gone the stack's TargetDown has no target left to be down). The platform's one
        # critical alert. 3 minutes: the controller replaces a deleted proxy within
        # seconds, and a pod starts in well under a minute.
        expr: absent(up{job="envoy"} == 1)
        for: 3m
        labels:
          severity: critical
          namespace: envoy-gateway-system # absent() has none to give: where the proxies run
        annotations:
          summary: "The front door is down: no Envoy proxy is running (or scraped)"
          description: No Envoy proxy has been scraped for 3 minutes. Every request to every app and tool goes through it, so nothing is reachable from outside; the apps' own alerts stay quiet, as their pods are fine.
          runbook_url: https://github.com/easypeasyops/platform/blob/main/docs/RUNBOOK.md#the-front-door-is-down
      - alert: FrontDoorControllerDown
        # No Envoy Gateway controller scraped: Gateway and route changes stop reaching the
        # proxies, and a proxy that goes is not replaced. What runs keeps serving.
        expr: absent(up{job="envoy-gateway"} == 1)
        for: 10m
        labels:
          severity: warning
          namespace: envoy-gateway-system # absent() has none to give: named for the route
        annotations:
          summary: Envoy Gateway's controller isn't running (or isn't scraped)
          description: Envoy Gateway's controller hasn't been scraped for 10 minutes. The proxies keep serving the routes they have, but no route or Gateway change reaches them, and a proxy that goes away is not replaced.
          runbook_url: https://github.com/easypeasyops/platform/blob/main/docs/RUNBOOK.md#the-front-door-is-down
      - alert: FrontDoorRouteWithoutBackend
        # Envoy Gateway gives a route whose Service has no ready pod (503), or doesn't exist
        # (500), no Envoy cluster: the proxy answers itself, and counts that per listener
        # only. The route's status says which route: BackendsAvailable False
        # (EndpointsNotFound) or ResolvedRefs False (BackendNotFound). So this names the
        # route, and needs no traffic to it. Aggregated to the route's own labels, without
        # kube-state-metrics' pod or namespace: Alertmanager routes it by its name alone.
        # 5 minutes of it: a single pod restarting is not a ticket.
        expr: |
          max by (route_namespace, route, type, reason) (
            gateway_httproute_status_condition{job="kube-state-metrics", type=~"BackendsAvailable|ResolvedRefs"}
          ) == 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "Route {{ $labels.route_namespace }}/{{ $labels.route }} has no backend to send to ({{ $labels.reason }}): the front door answers 5xx itself"
          description: Requests to a route whose Service has no ready pod, or doesn't exist, get a 503 or 500 from the proxy. They never reach the app, so its own metrics and alerts don't show them.
          runbook_url: https://github.com/easypeasyops/platform/blob/main/docs/RUNBOOK.md#a-route-with-no-backend
          dashboard_url: /d/front-door # a path under Grafana's root_url: the Slack message links it

# Alerts on External Secrets. A sync that fails changes nothing that runs: the Secret keeps
# the value it last got, so a rotated key or a new one never arrives and nothing says so.
# Shipped as a PrometheusRule by the platform chart (templates/monitoring.yaml); tested by
# deploy/prometheus/tests/external_secrets_test.yaml (promtool). Metrics: the controller
# (externalsecret_status_condition), scraped through the chart's ServiceMonitor
# (deploy/kind/external-secrets-values.yaml). The scrape keeps the target's namespace in
# `namespace`, so the ExternalSecret's own is `exported_namespace`.
# Severity warning, namespace external-secrets: what Alertmanager sends to the platform's
# channel (deploy/kind/monitoring-values.yaml), whichever app the ExternalSecret belongs to.
# The channel's message is the description, so it names the object.
groups:
  - name: external-secrets
    rules:
      - alert: ExternalSecretsDown
        # No controller scraped: nothing refreshes, and the alert below is blind.
        expr: absent(up{job="external-secrets-metrics"} == 1)
        for: 10m
        labels:
          severity: warning
          namespace: external-secrets # absent() has none to give: named for the route
        annotations:
          summary: The External Secrets controller isn't running (or isn't scraped)
          description: The External Secrets controller hasn't been scraped for 10 minutes. No Secret is refreshed or created while it is down; existing Secrets keep their values.
          runbook_url: https://github.com/easypeasyops/platform/blob/main/docs/RUNBOOK.md#external-secrets-alerts
      - alert: ExternalSecretNotSyncing
        # Ready is False from the first failed sync until one succeeds. 15 minutes: longer
        # than a fresh cluster takes to bring up the store the ExternalSecrets read.
        expr: max by (namespace, exported_namespace, name) (externalsecret_status_condition{condition="Ready", status="False"}) == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "ExternalSecret {{ $labels.exported_namespace }}/{{ $labels.name }} hasn't synced for 15 minutes"
          description: "ExternalSecret {{ $labels.exported_namespace }}/{{ $labels.name }} hasn't synced for 15 minutes. Its Secret keeps the last value it got, or doesn't exist yet: what reads it runs on a stale secret or can't start."
          runbook_url: https://github.com/easypeasyops/platform/blob/main/docs/RUNBOOK.md#external-secrets-alerts

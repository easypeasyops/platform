# Alerts on CloudNativePG: the operator, the Barman Cloud plugin, and every app database's
# base backups. None of these failures breaks anything that runs: the databases serve queries without the operator, and
# a backup that stops is missed only on the day a restore is needed.
# Shipped as a PrometheusRule by the platform chart (templates/monitoring.yaml); tested by
# deploy/prometheus/tests/cloudnative_pg_test.yaml (promtool). Metrics: `up` for the
# operator (the PodMonitor beside the rule), the Barman Cloud plugin's, which each
# database instance reports through the PodMonitor the service chart renders with its
# Cluster (in the app's namespace, when the app has monitoring on), and kube-state-metrics'
# for the plugin's Deployment and for the list of databases with backups on (their
# ScheduledBackups, deploy/kind/monitoring-values.yaml).
# Severity warning, namespace cnpg-system: what Alertmanager sends to the platform's channel
# (deploy/kind/monitoring-values.yaml), whichever app the database belongs to; a warning in
# an app's namespace would go nowhere. The channel's message is the description, so it
# names the database.
groups:
  - name: cloudnative-pg
    rules:
      - alert: CloudNativePGOperatorDown
        # 10 minutes: nothing is urgent while the primaries are up, and a restart of the
        # operator takes seconds.
        expr: absent(up{job="cloudnative-pg"} == 1)
        for: 10m
        labels:
          severity: warning
          namespace: cnpg-system # absent() has none to give: named for the route
        annotations:
          summary: The CloudNativePG operator isn't running (or isn't scraped)
          description: The CloudNativePG operator hasn't been scraped for 10 minutes. The databases keep serving, but nothing fails over, no scheduled backup starts and no change to a Cluster is applied while it is down.
          runbook_url: https://github.com/easypeasyops/platform/blob/main/docs/RUNBOOK.md#cloudnativepg-alerts
      - alert: DatabaseBackupTooOld
        # The plugin's metric has no labels of its own: the database is its pod's namespace
        # (kept as exported_namespace, since `namespace` is set for the route) and the pod's
        # name without the instance number. Every instance reports the same value; 0 means
        # no backup yet, which is as old as it gets.
        # 24 hours: the service chart's default schedule is hourly, an app may choose up to
        # daily, and a laptop that slept catches up at the next run. WAL is archived
        # continuously, so until then a restore is slower, not impossible.
        expr: |-
          time() - max by (exported_namespace, cluster) (
            label_replace(
              label_replace(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp, "exported_namespace", "$1", "namespace", "(.+)"),
              "cluster", "$1", "pod", "(.+)-[0-9]+"
            )
          ) > 24 * 3600
        for: 1h
        labels:
          severity: warning
          namespace: cnpg-system
        annotations:
          summary: "Database {{ $labels.exported_namespace }}/{{ $labels.cluster }} has no base backup from the last 24 hours"
          description: "Database {{ $labels.exported_namespace }}/{{ $labels.cluster }} has no successful base backup from the last 24 hours (or none at all). A restore would have to replay every WAL file since the last one, and can't reach any moment once that backup passes its retention."
          runbook_url: https://github.com/easypeasyops/platform/blob/main/docs/RUNBOOK.md#cloudnativepg-alerts
      - alert: DatabaseBackupNotWatched
        # DatabaseBackupTooOld sees only the databases whose instances are scraped: one with
        # backups on and no backup series (the app's monitoring off, or its scrape broken)
        # would never warn. The databases with backups on are their ScheduledBackups.
        # 30 minutes: a new database's first scrape comes within a minute or two of its pod.
        expr: |-
          max by (exported_namespace, cluster) (cnpg_scheduledbackup_info{job="kube-state-metrics"})
          unless on (exported_namespace, cluster)
          max by (exported_namespace, cluster) (
            label_replace(
              label_replace(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp, "exported_namespace", "$1", "namespace", "(.+)"),
              "cluster", "$1", "pod", "(.+)-[0-9]+"
            )
          )
        for: 30m
        labels:
          severity: warning
          namespace: cnpg-system
        annotations:
          summary: "Database {{ $labels.exported_namespace }}/{{ $labels.cluster }} has backups on and no backup metrics"
          description: "Database {{ $labels.exported_namespace }}/{{ $labels.cluster }} has scheduled backups, but Prometheus has no backup metrics from it for 30 minutes: DatabaseBackupTooOld can't see it, so a backup that stops goes unnoticed. Its instances aren't scraped (the app's monitoring.enabled off, or the scrape failing)."
          runbook_url: https://github.com/easypeasyops/platform/blob/main/docs/RUNBOOK.md#cloudnativepg-alerts
      - alert: BarmanCloudPluginDown
        # The plugin's pod names no metrics port: its Deployment's available replicas, from
        # kube-state-metrics. Without it no WAL is archived and no base backup is taken, and
        # DatabaseBackupTooOld says so only a day later.
        expr: absent(kube_deployment_status_replicas_available{namespace="cnpg-system", deployment="plugin-barman-cloud"} >= 1)
        for: 10m
        labels:
          severity: warning
          namespace: cnpg-system
        annotations:
          summary: The Barman Cloud plugin isn't running
          description: The Barman Cloud plugin (cnpg-system/plugin-barman-cloud) has had no available replica for 10 minutes. No database archives WAL or takes a base backup while it is down, so a restore can't reach anything after it stopped.
          runbook_url: https://github.com/easypeasyops/platform/blob/main/docs/RUNBOOK.md#cloudnativepg-alerts
      # The restore drills (PT-44): a CronJob restore-drill/drill-<namespace> per database
      # with backups (deploy/policies/restore-drill.yaml), each a daily restore of its latest
      # backup into a scratch Cluster. These two read kube-state-metrics' CronJob and Job
      # series. `exported_namespace` is the database's namespace, from the CronJob's name.
      # The stack's KubeJobFailed on a drill's Job goes nowhere (restore-drill isn't a
      # platform route's namespace): this says it, and clears when a later run succeeds.
      - alert: DatabaseRestoreDrillFailed
        # The drill's latest run failed: a failed Job of it that started after its last
        # success (or, never successful, after it was created). As CronJobLastRunFailed
        # does for the apps' CronJobs (app-workloads-rules.yaml). max(): two
        # kube-state-metrics pods during its rollout are one Job.
        expr: |-
          label_replace(
            (
              max by (job_name) (kube_job_status_start_time{namespace="restore-drill"})
              * on (job_name) group_left (cronjob)
              max by (job_name, cronjob) (label_replace(kube_job_owner{namespace="restore-drill", owner_kind="CronJob", owner_name=~"drill-.+"}, "cronjob", "$1", "owner_name", "(.+)"))
              and on (job_name)
              max by (job_name) (kube_job_failed{namespace="restore-drill", condition="true"}) == 1
            )
            > on (cronjob) group_left ()
            (
              max by (cronjob) (kube_cronjob_status_last_successful_time{namespace="restore-drill"})
              or
              0 * max by (cronjob) (kube_cronjob_created{namespace="restore-drill"})
            ),
            "exported_namespace", "$1", "cronjob", "drill-(.+)"
          )
        for: 5m
        labels:
          severity: warning
          namespace: cnpg-system
        annotations:
          summary: "The restore drill of {{ $labels.exported_namespace }}'s database failed"
          description: "The latest restore drill of the database in {{ $labels.exported_namespace }} (Job restore-drill/{{ $labels.job_name }}) failed: its backups didn't restore into a healthy copy, or the drill itself broke. Until a drill passes, a restore of that database is unproven. The Job's log says which step failed."
          runbook_url: https://github.com/easypeasyops/platform/blob/main/docs/RUNBOOK.md#restore-drills
      - alert: DatabaseRestoreDrillStale
        # A database with backups (its ScheduledBackup, the list DatabaseBackupNotWatched
        # uses) whose drill hasn't passed for 2 days: failing, not running (the laptop asleep
        # at 04:30 past the 6-hour start deadline, admission refusing it), or never made (no
        # CronJob: the GeneratingPolicy or Kyverno's background controller). A new drill
        # counts from its CronJob's creation, so a new database gets a day to its first run.
        # 1 hour: a new database's CronJob is generated within seconds of its ScheduledBackup.
        expr: |-
          max by (exported_namespace, cluster) (cnpg_scheduledbackup_info{job="kube-state-metrics"})
          unless on (exported_namespace)
          label_replace(
            time() - max by (cronjob) (
              kube_cronjob_status_last_successful_time{namespace="restore-drill", cronjob=~"drill-.+"}
              or
              kube_cronjob_created{namespace="restore-drill", cronjob=~"drill-.+"}
            ) < 2 * 86400,
            "exported_namespace", "$1", "cronjob", "drill-(.+)"
          )
        for: 1h
        labels:
          severity: warning
          namespace: cnpg-system
        annotations:
          summary: "Database {{ $labels.exported_namespace }}/{{ $labels.cluster }} has had no passing restore drill for 2 days"
          description: "No restore drill of database {{ $labels.exported_namespace }}/{{ $labels.cluster }} has passed in 2 days, or it has no drill at all (no CronJob restore-drill/drill-{{ $labels.exported_namespace }}). Its backups are taken but not proven to restore."
          runbook_url: https://github.com/easypeasyops/platform/blob/main/docs/RUNBOOK.md#restore-drills

# Alerts on Prometheus itself that replace the stack's where the stack's is wrong for a
# cluster on a laptop (the stack's copy is turned off in deploy/kind/monitoring-values.yaml,
# defaultRules.disabled). Shipped as a PrometheusRule by the platform chart
# (templates/monitoring.yaml); tested by deploy/prometheus/tests/prometheus_test.yaml.
groups:
  - name: platform-prometheus
    rules:
      - alert: PrometheusMissingRuleEvaluations
        # A rule group skipped evaluations while Prometheus was running: the group takes
        # longer than its interval, or Prometheus is short of CPU. The stack's rule is the
        # first line alone, and a sleeping laptop sets it off (PT-15): the cluster's VM is
        # frozen, the clock jumps on wake, and every group counts the sleep as missed
        # evaluations. A sleep also leaves a hole in the scrapes, so the second line asks
        # for a window without one: 20 scrapes in 5 minutes at the 15s scrapeInterval, one
        # allowed late. The shortest sleep seen, 30 seconds, loses two.
        expr: |
          increase(prometheus_rule_group_iterations_missed_total{job="kps-prometheus"}[5m]) > 0
          and
          count_over_time(prometheus_rule_group_iterations_missed_total{job="kps-prometheus"}[5m]) >= 19
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Prometheus is skipping evaluations of a rule group
          description: "Prometheus {{ $labels.pod }} skipped {{ printf \"%.0f\" $value }} evaluations of {{ $labels.rule_group }} in the last 5 minutes while it was running. Its alerts, the SLO ones included, may be late."
          runbook_url: https://github.com/easypeasyops/platform/blob/main/docs/RUNBOOK.md#prometheus-misses-rule-evaluations

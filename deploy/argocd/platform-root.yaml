# The root of the platform (app-of-apps): renders deploy/argocd/platform/, one child
# Application per component. scripts/cluster.sh applies this file with its Helm
# parameters set (the node's architecture, the git revision, the components to install);
# Argo CD itself stays bootstrapped by cluster.sh, not by git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/easypeasyops/platform.git
    targetRevision: main # cluster.sh: PLATFORM_REVISION
    path: deploy/argocd/platform
    helm:
      parameters: [] # cluster.sh: arch, revision, components.*
  destination: { server: https://kubernetes.default.svc, namespace: argocd }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    # The same retry as the children (deploy/argocd/platform/templates/_helpers.tpl). The
    # root's sync fails while a child of the wave it is on is Degraded, which on a fresh
    # cluster happens for a moment; without a policy Argo CD's default backoff applied, and
    # the root sat in one retry for about 80 s after every child was ready (CI, links #114).
    retry:
      limit: 20
      backoff: { duration: 5s, factor: 2, maxDuration: 30s }

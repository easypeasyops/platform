# The other half of require-release-provenance: that policy checks our images, so an
# attacker would simply run a different image. This one allows only known images in the app
# namespaces at all, and of our images only the namespace's own app's (its
# easypeasyops.github.io/app label), so one app's namespace can't run another app.
#
# Audit in kind: local builds (an app's :dev and :e2e images) are how this cluster is developed and
# tested, so violations are only reported (kubectl get policyreport -A). On a real cluster use
# validationActions: [Deny]. Tested offline by tests/test_admission_policies.py.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: app-allowed-images
  annotations:
    policies.kyverno.io/title: Only allow known images in the app namespaces
    policies.kyverno.io/description: >-
      Pods in an app's namespaces may only run that app's released image (by digest),
      Postgres (the e2e's in-cluster client), the k6 load-test image, Redis 8 (the service
      chart's `redis`), or the images of a CloudNativePG database: its Postgres 17 image,
      the operator's (its instance manager) and the Barman Cloud plugin's sidecar.
spec:
  validationActions: [Audit]
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        # Every app's namespaces: the label the apps ApplicationSet gives them (platform plan
        # 5.7), so a new app is covered without editing this policy.
        - { key: easypeasyops.github.io/app, operator: Exists }
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: images
      expression: >-
        (object.spec.containers + object.spec.?initContainers.orValue([])
         + object.spec.?ephemeralContainers.orValue([])).map(c, c.image)
    # The namespace's app, as the apps ApplicationSet labels it.
    - name: app
      expression: namespaceObject.metadata.labels['easypeasyops.github.io/app']
    - name: allowed
      # Regexes, anchored. Postgres, Redis and k6 are pinned to their major line.
      expression: >-
        [
          '^ghcr\\.io/easypeasyops/[A-Za-z0-9_.-]+/' + variables.app + '@sha256:[0-9a-f]{64}$',
          '^(docker\\.io/(library/)?)?postgres:17-alpine(@sha256:[0-9a-f]{64})?$',
          '^(docker\\.io/)?grafana/k6:[0-9.]+(@sha256:[0-9a-f]{64})?$',
          '^(docker\\.io/(library/)?)?redis:8\\.[0-9.]+-alpine(@sha256:[0-9a-f]{64})?$',
          '^ghcr\\.io/cloudnative-pg/postgresql:17\\.[0-9]+-minimal-trixie(@sha256:[0-9a-f]{64})?$',
          '^ghcr\\.io/cloudnative-pg/cloudnative-pg:[0-9.]+(@sha256:[0-9a-f]{64})?$',
          '^ghcr\\.io/cloudnative-pg/plugin-barman-cloud-sidecar:v[0-9.]+(@sha256:[0-9a-f]{64})?$'
        ]
  validations:
    - expression: variables.images.all(i, variables.allowed.exists(r, i.matches(r)))
      messageExpression: >-
        'image not allowed in the namespaces of app ' + variables.app + ': ' +
        variables.images.filter(i, !variables.allowed.exists(r, i.matches(r))).join(', ')

# kube-prometheus-stack for the local kind cluster, deployed by Argo CD (deploy/argocd/platform/): enough
# to scrape shortly, evaluate its rules, route its alerts and show the SLO dashboard.
# Components that can't work in kind (or that shortly doesn't need) are off.

fullnameOverride: kps # predictable Service names: kps-prometheus, kps-alertmanager

# The control-plane components aren't reachable for scraping in kind; their targets and
# rules would only produce permanent TargetDown noise.
kubeEtcd: { enabled: false }
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeProxy: { enabled: false }
# The bundled node-exporter needs host access the namespace's Pod Security level forbids:
# it runs from its own chart in a namespace of its own (deploy/kind/node-exporter-values.yaml).
nodeExporter: { enabled: false }
windowsMonitoring: { enabled: false }
defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    node: false
    nodeExporterAlerting: false
    nodeExporterRecording: false
    windows: false

kube-state-metrics:
  fullnameOverride: kube-state-metrics

prometheus:
  prometheusSpec:
    scrapeInterval: 15s
    evaluationInterval: 15s
    # 10 days on a volume of its own, so the data outlives the pod (an emptyDir lost it at
    # every recreation). About 0.5 GB a day at today's scrape load; retentionSize keeps it
    # inside the claim if that grows.
    retention: 10d
    retentionSize: 12GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: standard # kind's local-path provisioner
          accessModes: [ReadWriteOnce]
          resources:
            requests: { storage: 15Gi }
    # Where it's reached (deploy/kind/tools/monitoring.yaml): alert links ("Source") use it.
    externalUrl: http://prometheus.localhost:8090
    # Select ServiceMonitors and PrometheusRules from every release in every namespace,
    # not only those labelled for this Helm release: shortly's chart ships its own.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 100m, memory: 400Mi }

alertmanager:
  alertmanagerSpec:
    externalUrl: http://alertmanager.localhost:8090 # links in notifications point here
    # The Slack webhooks (deploy/secrets/monitoring.yaml), mounted at
    # /etc/alertmanager/secrets/alertmanager-slack/<key> for the receivers' api_url_file.
    secrets: [alertmanager-slack]
    resources:
      requests: { cpu: 10m, memory: 32Mi }
  # Routing. aipostit's alerts go to its two Slack channels and the platform's own (Argo CD's,
  # and the stack's warning and critical alerts on the platform's namespaces)
  # to #platform-alerts (docs/RUNBOOK.md, Slack alerts). Any other app's go to named placeholders with no integration, so nothing of its leaves
  # the cluster; in a real setup `pager` gets pagerduty_configs and `tickets` slack_configs.
  # tests/test_alerting.py checks these routes and the Slack messages with amtool.
  config:
    templates: [/etc/alertmanager/config/*.tmpl] # templateFiles below
    route:
      receiver: "null"
      group_by: [alertname, namespace, slo]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: "null" # always-firing heartbeat from the stack: proves the pipeline works
          matchers: ['alertname = "Watchdog"']
        # aipostit, one Slack channel per environment, before the generic staging route.
        # Its own rules' severities only: the stack's warning/critical alerts on the same
        # pods stay on "null". For PagerDuty later, aipostit-prod gets child routes: one
        # for severity="page" to a receiver with pagerduty_configs, `continue: true`, and a
        # catch-all to aipostit-prod, so Slack still has every alert.
        - receiver: aipostit-staging
          matchers: ['namespace = "aipostit-staging"', 'severity =~ "page|ticket"']
          group_by: [alertname, namespace]
        - receiver: aipostit-prod
          matchers: ['namespace = "aipostit-prod"', 'severity =~ "page|ticket"']
          group_by: [alertname, namespace]
        # Argo CD's alerts on aipostit's Applications have no namespace, only the
        # Application's name and project: staging's go to staging, any other to prod, so
        # none is lost.
        - receiver: aipostit-staging
          matchers: ['project = "aipostit"', 'name = "aipostit-staging"']
          group_by: [alertname, name]
        - receiver: aipostit-prod
          matchers: ['project = "aipostit"']
          group_by: [alertname, name]
        # deploybot (hotel_social_posts' /aipostit Slack command, aipostit's release tool):
        # Argo CD's alerts on its Application go to aipostit's prod channel, as tickets. It
        # has no rules of its own: a crash loop, a pod never Ready (no Slack connection) or a
        # refused sync makes the Application unhealthy or its sync fail, which these cover.
        - receiver: aipostit-prod
          matchers: ['project = "deploybot"']
          group_by: [alertname, name]
        # The platform's own alerts (deploy/argocd/platform/files/argocd-rules.yaml), after
        # the apps' routes above: ArgoCDDown, which has no project (the empty alternative),
        # and Argo CD's alerts on the platform's Applications (projects platform and apps).
        # Another app's (shortly) still fall through to `tickets`.
        - receiver: platform
          matchers: ['alertname =~ "ArgoCD.+"', 'project =~ "|platform|apps"']
          group_by: [alertname, name]
        # The stack's own alerts (a crash loop, a volume filling up, a target down, a failed
        # rule evaluation) on the platform's namespaces, or on none (KubeAPIDown). The
        # namespaces are listed, so an app's never match: its own rules cover its pods.
        # tests/test_alerting.py checks the list has every namespace the platform chart
        # names. By severity too: some of these alerts exist as warning and as critical.
        - receiver: platform
          matchers:
            - 'severity =~ "warning|critical"'
            - 'namespace =~ "|argo-rollouts|argocd|backups|cert-manager|cnpg-system|envoy-gateway-system|external-secrets|gateway|kube-system|kyverno|local-path-storage|log-collector|monitoring|node-exporter|secret-store"'
          group_by: [alertname, namespace, severity]
        - receiver: staging # staging never pages anyone, whatever its severity
          # Any app's staging namespace, <app>-staging (platform plan, Phase 2).
          matchers: ['namespace =~ ".+-staging"']
        - receiver: pager
          matchers: ['severity = "page"']
        - receiver: tickets
          matchers: ['severity = "ticket"']
        # Everything else (the stack's info alerts, and its warning/critical alerts on an
        # app's namespace) goes to "null".
    inhibit_rules:
      # A page already covers the ticket for the same SLO and namespace.
      - source_matchers: ['severity = "page"']
        target_matchers: ['severity = "ticket"']
        equal: [alertname, namespace, slo]
      # aipostit: a page in an environment covers its tickets there (the API down covers its
      # errors and readiness; Redis down covers everything that needs Redis).
      - source_matchers: ['alertname =~ "Aipostit.+"', 'severity = "page"']
        target_matchers: ['alertname =~ "Aipostit.+"', 'severity = "ticket"']
        equal: [namespace]
    receivers:
      - name: "null"
      - name: pager
      - name: tickets
      - name: staging
      # The webhooks are files Alertmanager reads (alertmanagerSpec.secrets above), never
      # in this config.
      - name: aipostit-prod
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/aipostit-prod-webhook-url
            send_resolved: true
            title: '{{ template "aipostit.slack.title" . }}'
            text: '{{ template "aipostit.slack.text" . }}'
      - name: aipostit-staging
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/aipostit-staging-webhook-url
            send_resolved: true
            title: '{{ template "aipostit.slack.title" . }}'
            text: '{{ template "aipostit.slack.text" . }}'
      - name: platform
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/platform-webhook-url
            send_resolved: true
            title: '{{ template "platform.slack.title" . }}'
            text: '{{ template "platform.slack.text" . }}'
  # aipostit's Slack messages. Title: red for a page, yellow for a ticket, the alert and its
  # environment. Text: @channel on a firing page in prod only, each alert's summary, and its
  # runbook link. Resolved alerts say so (send_resolved).
  templateFiles:
    aipostit-slack.tmpl: |-
      {{ define "aipostit.slack.env" }}{{ if .CommonLabels.namespace }}{{ reReplaceAll "^aipostit-" "" .CommonLabels.namespace }}{{ else }}{{ reReplaceAll "^aipostit-" "" .CommonLabels.name }}{{ end }}{{ end }}
      {{ define "aipostit.slack.title" -}}
      {{ if eq .CommonLabels.severity "page" }}🔴{{ else }}🟡{{ end }} {{ if eq .Status "resolved" }}RESOLVED {{ end }}{{ .CommonLabels.alertname }} in {{ template "aipostit.slack.env" . }}
      {{- end }}
      {{ define "aipostit.slack.text" -}}
      {{ if and (eq .Status "firing") (eq .CommonLabels.severity "page") (eq .Receiver "aipostit-prod") }}<!channel> {{ end -}}
      severity *{{ .CommonLabels.severity }}*, env *{{ template "aipostit.slack.env" . }}*
      {{ range .Alerts -}}
      • {{ if eq .Status "resolved" }}resolved: {{ end }}{{ .Annotations.summary }}
      {{ end -}}
      {{ with (index .Alerts 0).Annotations.runbook_url }}<{{ . }}|Runbook>{{ end }}
      {{- end }}
    # The platform's Slack messages. Title: red for a critical alert, the alert and, when it
    # is about one, the Argo CD Application, or else its namespace. Text: each alert's summary
    # (Argo CD's, severity ticket) or, for the stack's, its description, which names the pod
    # or the volume; and the runbook link. Never @channel.
    platform-slack.tmpl: |-
      {{ define "platform.slack.title" -}}
      {{ if or (eq .CommonLabels.severity "page") (eq .CommonLabels.severity "critical") }}🔴{{ else }}🟡{{ end }} {{ if eq .Status "resolved" }}RESOLVED {{ end }}{{ .CommonLabels.alertname }}{{ if .CommonLabels.name }} on {{ .CommonLabels.name }}{{ else if .CommonLabels.namespace }} in {{ .CommonLabels.namespace }}{{ end }}
      {{- end }}
      {{ define "platform.slack.text" -}}
      {{ range .Alerts -}}
      • {{ if eq .Status "resolved" }}resolved: {{ end }}{{ if eq .Labels.severity "ticket" }}{{ .Annotations.summary }}{{ else }}{{ or .Annotations.description .Annotations.summary }}{{ end }}
      {{ end -}}
      {{ with (index .Alerts 0).Annotations.runbook_url }}<{{ . }}|Runbook>{{ end }}
      {{- end }}

grafana:
  fullnameOverride: grafana
  admin:
    existingSecret: grafana-admin # from the secret store (deploy/secrets/monitoring.yaml)
  # Reached at this address (deploy/kind/tools/monitoring.yaml); Grafana builds its links
  # and login redirects from it.
  grafana.ini:
    server:
      root_url: http://grafana.localhost:8090
  # The logs, beside the metrics: VictoriaLogs (deploy/kind/victoria-logs-values.yaml) as a
  # data source, read in Explore (docs/RUNBOOK.md, Logs). Its plugin isn't part of Grafana:
  # Grafana downloads it from grafana.com before it starts, at every start of the pod (its
  # disk is an emptyDir). Pinned to a version, signed by its publisher: a bump is a change
  # here. The store's NetworkPolicy admits Grafana's pods by name (tests/test_platform.py).
  plugins:
    - victoriametrics-logs-datasource@0.33.1
  additionalDataSources:
    - name: VictoriaLogs
      uid: victorialogs
      type: victoriametrics-logs-datasource
      access: proxy # Grafana's server asks the store; the browser never reaches it
      url: http://victoria-logs.monitoring.svc:9428
  # Dashboards come from ConfigMaps labelled grafana_dashboard=1 in any namespace (the
  # chart's defaults); shortly's prod release ships the SLO dashboard that way.
  resources:
    requests: { cpu: 50m, memory: 128Mi }

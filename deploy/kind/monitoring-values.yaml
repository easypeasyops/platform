# kube-prometheus-stack for the local kind cluster, deployed by Argo CD (deploy/argocd/platform/): enough
# to scrape shortly, evaluate its rules, route its alerts and show the SLO dashboard.
# Components that can't work in kind (or that shortly doesn't need) are off.

fullnameOverride: kps # predictable Service names: kps-prometheus, kps-alertmanager

# The operator starts after its CRDs: at start-up it turns off, for good, the controller of
# each CRD not yet installed (prometheus-operator's checkPrerequisites, "not installed in
# the cluster"), and on a fresh cluster the big Prometheus CRD can land after the operator
# runs. Its Deployment is in wave 1 of this Application, so Argo CD starts it once wave 0's
# CRDs are Established. Prometheus and Alertmanager go with it: wave 0 waits for its
# resources to be healthy, which they never are without the operator. (The CRDs come from
# the chart's crds/ directory, which takes no annotation: they stay in wave 0.)
prometheusOperator:
  annotations: { argocd.argoproj.io/sync-wave: "1" }

# The control-plane components aren't reachable for scraping in kind; their targets and
# rules would only produce permanent TargetDown noise.
kubeEtcd: { enabled: false }
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeProxy: { enabled: false }
# The API server's scrape was 52% of Prometheus's series (PT-37, 2026-11-16: 56.5k of 108k),
# most of them buckets of ten histograms that no rule and no dashboard reads, the stack's
# or the platform's (tests/test_platform.py checks). Those buckets are dropped as they are
# scraped (37.9k series); each histogram's _sum and _count stay, so an average is still
# there (etcd's request latency as the API server sees it, say). To read one's quantiles
# again, take it off the list. The first rule is the chart's default, repeated because a
# list here replaces the chart's.
kubeApiServer:
  serviceMonitor:
    metricRelabelings:
      - action: drop
        sourceLabels: [__name__, le]
        regex: (etcd_request|apiserver_request_slo|apiserver_request_sli|apiserver_request)_duration_seconds_bucket;(0\.15|0\.2|0\.3|0\.35|0\.4|0\.45|0\.6|0\.7|0\.8|0\.9|1\.25|1\.5|1\.75|2|3|3\.5|4|4\.5|6|7|8|9|15|20|40|45|50)(\.0)?
      - action: drop
        sourceLabels: [__name__]
        regex: "(\
          apiserver_request_body_size_bytes|\
          apiserver_request_duration_seconds|\
          apiserver_response_sizes|\
          apiserver_storage_list_duration_seconds|\
          apiserver_watch_cache_initialization_duration_seconds|\
          apiserver_watch_cache_read_wait_seconds|\
          apiserver_watch_events_dispatch_duration_seconds|\
          apiserver_watch_events_sizes|\
          apiserver_watch_list_duration_seconds|\
          etcd_request_duration_seconds\
          )_bucket"
# The bundled node-exporter needs host access the namespace's Pod Security level forbids:
# it runs from its own chart in a namespace of its own (deploy/kind/node-exporter-values.yaml).
# Its dashboards and rules (defaultRules.rules.node*, the chart's default: on) are this
# chart's all the same; without the other operating systems' dashboards.
nodeExporter:
  enabled: false
  forceDeployDashboards: true
  operatingSystems: { aix: { enabled: false }, darwin: { enabled: false } }
windowsMonitoring: { enabled: false }
defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    windows: false
  # Off because a sleeping laptop sets it off (PT-15): the cluster's VM is frozen, the clock
  # jumps on wake, and every rule group counts the sleep as missed evaluations. The platform
  # ships its own, which leaves sleeps out (deploy/argocd/platform/files/prometheus-rules.yaml;
  # docs/RUNBOOK.md, Prometheus misses rule evaluations).
  disabled:
    PrometheusMissingRuleEvaluations: true
  # The Docker VM's kernel never reports its clock as synchronised (node_timex_sync_status
  # is 0 for good: the VM takes its time from the laptop, not from NTP), so this one would
  # fire for ever.
    NodeClockNotSynchronising: true
  # Every node alert (the node-exporter group) links to Node Exporter / Nodes in Slack
  # (alertmanager.templateFiles, links-slack.tmpl): a path under Grafana's root_url.
  additionalRuleGroupAnnotations:
    nodeExporterAlerting:
      dashboard_url: /d/7d57716318ee0dddbac5a7f451fb7753

kube-state-metrics:
  fullnameOverride: kube-state-metrics
  # Every HTTPRoute's status conditions as series (custom resource state): the route's
  # status is the one place that says a route has no backend to send to. Envoy counts those
  # answers per listener only, and only when someone asks (docs/RUNBOOK.md, A route with no
  # backend). gateway_httproute_status_condition{route_namespace, route, type, reason} is 1
  # for True, 0 for False; the labels are the ones a route's Envoy series carry
  # (deploy/argocd/platform/templates/monitoring.yaml). The first parent's conditions only
  # (a path can't walk two lists): every route here attaches to the one Gateway.
  # The Gateways' own status too: Programmed False, or a listener not Accepted, shows in no
  # other metric (docs/RUNBOOK.md, The front door is down). gateway_status_condition{
  # gateway_namespace, gateway, type, reason}, the Gateway's conditions; and
  # gateway_listener_accepted{gateway_namespace, gateway, listener, reason}, each listener's
  # Accepted condition, picked from its list by type.
  rbac:
    extraRules:
      - apiGroups: [gateway.networking.k8s.io]
        resources: [httproutes, gateways]
        verbs: [list, watch]
      - apiGroups: [argoproj.io]
        resources: [applications]
        verbs: [list, watch]
      - apiGroups: [argoproj.io]
        resources: [analysisruns]
        verbs: [list, watch]
  customResourceState:
    enabled: true
    config:
      kind: CustomResourceStateMetrics
      spec:
        resources:
          - groupVersionKind: { group: gateway.networking.k8s.io, version: v1, kind: HTTPRoute }
            metricNamePrefix: gateway_httproute
            labelsFromPath:
              route_namespace: [metadata, namespace]
              route: [metadata, name]
            metrics:
              - name: status_condition
                help: A condition of the HTTPRoute's first parent (1 True, 0 False)
                each:
                  type: Gauge
                  gauge:
                    path: [status, parents, "0", conditions]
                    labelsFromPath: { type: [type], reason: [reason] }
                    valueFrom: [status]
          # What each Argo CD Application's last sync deployed: the dashboards' deploy marks
          # (docs/RUNBOOK.md, The front door). Argo CD's own metrics carry no revision.
          # argocd_application_synced_revision_info{name, project, revision} for an
          # Application with one source; ..._revisions_info{..., source}, one series per
          # source (an app's chart digest, its values repo's commit, the platform's), for
          # several. A new revision is a new series: the dashboards mark the minute one
          # appears. One metric per source index, `source` the index: two sources from one
          # repo and branch sync the same commit, and a series per list entry would then
          # repeat in a scrape, which Prometheus drops (PrometheusDuplicateTimestamps,
          # PT-63). Indexes 0-2 cover the most sources an Application has (3).
          - groupVersionKind: { group: argoproj.io, version: v1alpha1, kind: Application }
            metricNamePrefix: argocd_application
            labelsFromPath:
              name: [metadata, name]
              project: [spec, project]
            metrics:
              - name: synced_revision_info
                help: The revision an Application's last sync deployed (one source)
                each:
                  type: Info
                  info:
                    path: [status, operationState, syncResult, revision]
                    labelsFromPath: { revision: [] }
              - name: synced_revisions_info
                help: The revision an Application's last sync deployed from one of its sources
                commonLabels: { source: "0" }
                each:
                  type: Info
                  info:
                    path: [status, operationState, syncResult, revisions, "0"]
                    labelsFromPath: { revision: [] }
              - name: synced_revisions_info
                help: The revision an Application's last sync deployed from one of its sources
                commonLabels: { source: "1" }
                each:
                  type: Info
                  info:
                    path: [status, operationState, syncResult, revisions, "1"]
                    labelsFromPath: { revision: [] }
              - name: synced_revisions_info
                help: The revision an Application's last sync deployed from one of its sources
                commonLabels: { source: "2" }
                each:
                  type: Info
                  info:
                    path: [status, operationState, syncResult, revisions, "2"]
                    labelsFromPath: { revision: [] }
          # Which Rollout each Argo Rollouts AnalysisRun belongs to, from its ownerReferences:
          # the controller's own analysis_run_info carries the run's name only, and a name
          # can't be split back into Rollout, pod hash and revision for sure.
          # argo_rollouts_analysisrun_owner_info{exported_namespace, analysisrun, owner_kind,
          # owner}, a series per owner; the first two are the labels CanaryAnalysisErrored
          # joins on (deploy/argocd/platform/files/argo-rollouts-rules.yaml).
          - groupVersionKind: { group: argoproj.io, version: v1alpha1, kind: AnalysisRun }
            metricNamePrefix: argo_rollouts_analysisrun
            labelsFromPath:
              exported_namespace: [metadata, namespace]
              analysisrun: [metadata, name]
            metrics:
              - name: owner_info
                help: An owner of the AnalysisRun (its Rollout)
                each:
                  type: Info
                  info:
                    path: [metadata, ownerReferences]
                    labelsFromPath: { owner_kind: [kind], owner: [name] }
          - groupVersionKind: { group: gateway.networking.k8s.io, version: v1, kind: Gateway }
            metricNamePrefix: gateway
            labelsFromPath:
              gateway_namespace: [metadata, namespace]
              gateway: [metadata, name]
            metrics:
              - name: status_condition
                help: A condition of the Gateway (1 True, 0 False)
                each:
                  type: Gauge
                  gauge:
                    path: [status, conditions]
                    labelsFromPath: { type: [type], reason: [reason] }
                    valueFrom: [status]
              - name: listener_accepted
                help: Whether the Gateway's listener is Accepted (1 True, 0 False)
                each:
                  type: Gauge
                  gauge:
                    path: [status, listeners]
                    labelsFromPath: { listener: [name], reason: [conditions, "[type=Accepted]", reason] }
                    valueFrom: [conditions, "[type=Accepted]", status]

prometheus:
  annotations: { argocd.argoproj.io/sync-wave: "1" } # with the operator (prometheusOperator)
  prometheusSpec:
    scrapeInterval: 15s
    evaluationInterval: 15s
    # 10 days on a volume of its own, so the data outlives the pod (an emptyDir lost it at
    # every recreation). About 0.5 GB a day at today's scrape load; retentionSize keeps it
    # inside the claim if that grows.
    retention: 10d
    retentionSize: 12GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: standard # kind's local-path provisioner
          accessModes: [ReadWriteOnce]
          resources:
            requests: { storage: 15Gi }
    # Where it's reached (deploy/kind/tools/monitoring.yaml): alert links ("Source") use it.
    externalUrl: http://prometheus.localhost:8090
    # Select ServiceMonitors and PrometheusRules from every release in every namespace,
    # not only those labelled for this Helm release: shortly's chart ships its own.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false # and Probes: the front door's (the platform chart)
    ruleSelectorNilUsesHelmValues: false
    # Memory from 7 days of use (2026-11-16, PT-39): working set p95 970 MiB, peak RSS 907.
    # The limit is about 1.5x the peak RSS; fewer series (PT-37) would lower all three.
    resources:
      requests: { cpu: 100m, memory: 1Gi }
      limits: { memory: 1536Mi }

alertmanager:
  annotations: { argocd.argoproj.io/sync-wave: "1" } # with the operator (prometheusOperator)
  alertmanagerSpec:
    externalUrl: http://alertmanager.localhost:8090 # links in notifications point here
    # Slack's bot token (deploy/secrets/alertmanager-slack.yaml), mounted at
    # /etc/alertmanager/secrets/alertmanager-slack/bot-token for the receivers' app_token_file.
    secrets: [alertmanager-slack]
    resources:
      requests: { cpu: 10m, memory: 32Mi }
  # Routing. Every app's alerts go to its environment's Slack channel, #<app>-alerts-<env>
  # (aipostit's with its own messages), and the platform's own (Argo CD's, and the stack's
  # warning and critical alerts on the platform's namespaces) to #platform-alerts
  # (docs/RUNBOOK.md, Slack alerts). The rest (the ops namespaces' alerts) go to named
  # placeholders with no integration, so nothing of theirs leaves the cluster; in a real
  # setup `pager` gets pagerduty_configs and `tickets` slack_configs.
  # tests/test_alerting.py checks these routes and the Slack messages with amtool.
  config:
    templates: [/etc/alertmanager/config/*.tmpl] # templateFiles below
    route:
      receiver: "null"
      group_by: [alertname, namespace, slo]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: "null" # always-firing heartbeat from the stack: proves the pipeline works
          matchers: ['alertname = "Watchdog"']
        # aipostit, one Slack channel per environment, before the generic staging route.
        # Its own rules' severities only: the stack's warning/critical alerts on the same
        # pods stay on "null". For PagerDuty later, aipostit-prod gets child routes: one
        # for severity="page" to a receiver with pagerduty_configs, `continue: true`, and a
        # catch-all to aipostit-prod, so Slack still has every alert.
        - receiver: aipostit-staging
          matchers: ['namespace = "aipostit-staging"', 'severity =~ "page|ticket"']
          group_by: [alertname, namespace]
        - receiver: aipostit-prod
          matchers: ['namespace = "aipostit-prod"', 'severity =~ "page|ticket"']
          group_by: [alertname, namespace]
        # Argo CD's alerts on aipostit's Applications have no namespace, only the
        # Application's name and project: staging's go to staging, any other to prod, so
        # none is lost.
        - receiver: aipostit-staging
          matchers: ['project = "aipostit"', 'name = "aipostit-staging"']
          group_by: [alertname, name]
        - receiver: aipostit-prod
          matchers: ['project = "aipostit"']
          group_by: [alertname, name]
        # deploybot (hotel_social_posts' /aipostit Slack command, aipostit's release tool):
        # Argo CD's alerts on its Application go to aipostit's prod channel, as tickets. It
        # has no rules of its own: a crash loop, a pod never Ready (no Slack connection) or a
        # refused sync makes the Application unhealthy or its sync fail, which these cover.
        - receiver: aipostit-prod
          matchers: ['project = "deploybot"']
          group_by: [alertname, name]
        # The platform's own alerts (deploy/argocd/platform/files/argocd-rules.yaml), after
        # the apps' routes above: ArgoCDDown, which has no project (the empty alternative),
        # and Argo CD's alerts on the platform's Applications (projects platform and apps).
        # Another app's go to its own channel (the `apps` routes, below).
        - receiver: platform
          matchers: ['alertname =~ "ArgoCD.+"', 'project =~ "|platform|apps"']
          group_by: [alertname, name]
        # The stack's own alerts (a crash loop, a volume filling up, a target down, a failed
        # rule evaluation) on the platform's namespaces, or on none (KubeAPIDown). The
        # namespaces are listed, so an app's never match: its own rules cover its pods.
        # tests/test_alerting.py checks the list has every namespace the platform chart
        # names. By severity too: some of these alerts exist as warning and as critical.
        - receiver: platform
          matchers:
            - 'severity =~ "warning|critical"'
            - 'namespace =~ "|argo-rollouts|argocd|backups|cert-manager|cnpg-system|envoy-gateway-system|event-exporter|external-secrets|gateway|kube-system|kyverno|local-path-storage|log-collector|monitoring|node-exporter|provenance-canary|secret-store"'
          group_by: [alertname, namespace, severity]
        # The front door's alerts (deploy/argocd/platform/files/front-door-rules.yaml): about
        # the proxies every app shares, so the platform's, whichever app's route it is. To
        # the platform only: the route's namespace is in `route_namespace`, so an app's
        # routes above don't match, and the app's own alerts cover its pods being gone.
        - receiver: platform
          matchers: ['alertname =~ "FrontDoor.+"']
          group_by: [alertname]
        # Any other app (PT-99): its rules' alerts in <app>-prod or <app>-staging, and Argo
        # CD's on its Application <app>-<env>, go to #<app>-alerts-<env>, the channel the
        # `apps` receiver names from the namespace or the Application (apps-slack.tmpl). No
        # change here for a new app: it creates its channels (RUNBOOK, Slack alerts). The ops
        # namespaces (<app>-ops) stay out: they fall through to the placeholders below.
        - receiver: apps
          matchers: ['namespace =~ ".+-(prod|staging)"', 'severity =~ "page|ticket"']
          group_by: [alertname, namespace]
        - receiver: apps
          matchers: ['alertname =~ "ArgoCD.+"', 'name =~ ".+-(prod|staging)"']
          group_by: [alertname, name]
        - receiver: staging # staging never pages anyone, whatever its severity
          # Any app's staging namespace, <app>-staging (platform plan, Phase 2).
          matchers: ['namespace =~ ".+-staging"']
        - receiver: pager
          matchers: ['severity = "page"']
        - receiver: tickets
          matchers: ['severity = "ticket"']
        # Everything else (the stack's info alerts, and its warning/critical alerts on an
        # app's namespace) goes to "null".
    inhibit_rules:
      # A page already covers the ticket for the same SLO and namespace.
      - source_matchers: ['severity = "page"']
        target_matchers: ['severity = "ticket"']
        equal: [alertname, namespace, slo]
      # aipostit: a page in an environment covers its tickets there (the API down covers its
      # errors and readiness; Redis down covers everything that needs Redis).
      - source_matchers: ['alertname =~ "Aipostit.+"', 'severity = "page"']
        target_matchers: ['alertname =~ "Aipostit.+"', 'severity = "ticket"']
        equal: [namespace]
      # The front door down: every hostname's probe fails with it, one incident, not a
      # ticket per hostname (deploy/argocd/platform/files/front-door-probes-rules.yaml).
      - source_matchers: ['alertname = "FrontDoorDown"']
        target_matchers: ['alertname = "FrontDoorProbeFailing"']
    receivers:
      - name: "null"
      - name: pager
      - name: tickets
      - name: staging
      # One bot token for every channel (chat.postMessage, Alertmanager 0.30 and later): a
      # file Alertmanager reads (alertmanagerSpec.secrets above), never in this config. The
      # bot must be in each channel (RUNBOOK, Slack alerts).
      - name: aipostit-prod
        slack_configs:
          - app_token_file: /etc/alertmanager/secrets/alertmanager-slack/bot-token
            channel: "#aipostit-alerts-prod"
            send_resolved: true
            title: '{{ template "aipostit.slack.title" . }}'
            text: '{{ template "aipostit.slack.text" . }}'
      - name: aipostit-staging
        slack_configs:
          - app_token_file: /etc/alertmanager/secrets/alertmanager-slack/bot-token
            channel: "#aipostit-alerts-staging"
            send_resolved: true
            title: '{{ template "aipostit.slack.title" . }}'
            text: '{{ template "aipostit.slack.text" . }}'
      - name: apps
        slack_configs:
          - app_token_file: /etc/alertmanager/secrets/alertmanager-slack/bot-token
            channel: '{{ template "apps.slack.channel" . }}'
            send_resolved: true
            title: '{{ template "apps.slack.title" . }}'
            text: '{{ template "apps.slack.text" . }}'
      - name: platform
        slack_configs:
          - app_token_file: /etc/alertmanager/secrets/alertmanager-slack/bot-token
            channel: "#platform-alerts"
            send_resolved: true
            title: '{{ template "platform.slack.title" . }}'
            text: '{{ template "platform.slack.text" . }}'
  # aipostit's Slack messages. Title: red for a page, yellow for a ticket, the alert and its
  # environment. Text: @channel on a firing page in prod only, each alert's summary, and its
  # runbook link. Resolved alerts say so (send_resolved).
  templateFiles:
    aipostit-slack.tmpl: |-
      {{ define "aipostit.slack.env" }}{{ if .CommonLabels.namespace }}{{ reReplaceAll "^aipostit-" "" .CommonLabels.namespace }}{{ else }}{{ reReplaceAll "^aipostit-" "" .CommonLabels.name }}{{ end }}{{ end }}
      {{ define "aipostit.slack.title" -}}
      {{ if eq .CommonLabels.severity "page" }}🔴{{ else }}🟡{{ end }} {{ if eq .Status "resolved" }}RESOLVED {{ end }}{{ .CommonLabels.alertname }} in {{ template "aipostit.slack.env" . }}
      {{- end }}
      {{ define "aipostit.slack.text" -}}
      {{ if and (eq .Status "firing") (eq .CommonLabels.severity "page") (eq .Receiver "aipostit-prod") }}<!channel> {{ end -}}
      severity *{{ .CommonLabels.severity }}*, env *{{ template "aipostit.slack.env" . }}*
      {{ range .Alerts -}}
      • {{ if eq .Status "resolved" }}resolved: {{ end }}{{ .Annotations.summary }}
      {{ end -}}
      {{ with (index .Alerts 0).Annotations.runbook_url }}<{{ . }}|Runbook>{{ end }}{{ template "slack.links" . }}
      {{- end }}
    # Every other app's messages, as aipostit's: the channel #<app>-alerts-<env> from the
    # group's namespace, or the Application's name for Argo CD's (both <app>-<env>). Title:
    # red for a page, yellow for a ticket, the alert and where. Text: @channel on a firing
    # page in prod only, each alert's summary, and its runbook link.
    apps-slack.tmpl: |-
      {{ define "apps.slack.where" }}{{ or .CommonLabels.namespace .CommonLabels.name }}{{ end }}
      {{ define "apps.slack.channel" }}{{ reReplaceAll "^(.+)-(prod|staging)$" "#${1}-alerts-${2}" (or .CommonLabels.namespace .CommonLabels.name) }}{{ end }}
      {{ define "apps.slack.title" -}}
      {{ if eq .CommonLabels.severity "page" }}🔴{{ else }}🟡{{ end }} {{ if eq .Status "resolved" }}RESOLVED {{ end }}{{ .CommonLabels.alertname }} in {{ template "apps.slack.where" . }}
      {{- end }}
      {{ define "apps.slack.text" -}}
      {{ if and (eq .Status "firing") (eq .CommonLabels.severity "page") (match "-prod$" (or .CommonLabels.namespace .CommonLabels.name)) }}<!channel> {{ end -}}
      severity *{{ .CommonLabels.severity }}*
      {{ range .Alerts -}}
      • {{ if eq .Status "resolved" }}resolved: {{ end }}{{ .Annotations.summary }}
      {{ end -}}
      {{ with (index .Alerts 0).Annotations.runbook_url }}<{{ . }}|Runbook>{{ end }}{{ template "slack.links" . }}
      {{- end }}
    # The links after the runbook, for every channel's messages, from the first firing alert;
    # none on a resolved message. Query: its expression in Prometheus, at the moment it
    # fired. Logs: Explore on VictoriaLogs, its namespace (exported_namespace or
    # route_namespace where it has one) from an hour before it fired to half an hour after;
    # an Argo CD alert with only an Application's name, Argo CD's lines naming it. Dashboard:
    # its dashboard_url annotation (a path), same times. Silence: a new silence, filled in
    # with the labels the group shares. Grafana's address is grafana.ini's root_url, below
    # (tests/test_alerting.py checks they agree).
    links-slack.tmpl: |-
      {{ define "slack.grafana" }}http://grafana.localhost:8090{{ end }}
      {{ define "slack.links" -}}
      {{ if eq .Status "firing" }}{{ with index .Alerts.Firing 0 -}}
      {{ $at := .StartsAt.UTC.Format "2006-01-02 15:04:05" -}}
      {{ $from := (.StartsAt.Add -3600000000000).UnixMilli }}{{ $to := (.StartsAt.Add 1800000000000).UnixMilli -}}
      {{ $ns := or .Labels.exported_namespace .Labels.route_namespace .Labels.namespace -}}
      {{ $logs := "" }}{{ if $ns }}{{ $logs = printf `{kubernetes.pod_namespace=\"%s\"}` $ns }}{{ else if .Labels.name }}{{ $logs = printf `{kubernetes.pod_namespace=\"argocd\"} \"%s\"` .Labels.name }}{{ end -}}
      {{ with .GeneratorURL }} · <{{ . }}&g0.moment_input={{ urlquery $at }}|Query>{{ end -}}
      {{ with $logs }} · <{{ template "slack.grafana" }}/explore?schemaVersion=1&orgId=1&panes={{ urlquery (printf `{"a":{"datasource":"victorialogs","queries":[{"refId":"A","datasource":{"type":"victoriametrics-logs-datasource","uid":"victorialogs"},"expr":"%s"}],"range":{"from":"%d","to":"%d"}}}` . $from $to) }}|Logs>{{ end -}}
      {{ with .Annotations.dashboard_url }} · <{{ template "slack.grafana" }}{{ . }}?from={{ $from }}&to={{ $to }}|Dashboard>{{ end -}}
      {{ "" }} · <{{ $.ExternalURL }}/#/silences/new?filter={{ urlquery "{" }}{{ range $i, $p := $.CommonLabels.SortedPairs }}{{ if $i }}%2C{{ end }}{{ urlquery $p.Name "=\"" $p.Value "\"" }}{{ end }}{{ urlquery "}" }}|Silence>
      {{- end }}{{ end }}
      {{- end }}
    # The platform's Slack messages. Title: red for a critical alert, the alert and, when it
    # is about one, the Argo CD Application, or else its namespace. Text: each alert's summary
    # (Argo CD's, severity ticket) or, for the stack's, its description, which names the pod
    # or the volume; and the runbook link. Never @channel.
    platform-slack.tmpl: |-
      {{ define "platform.slack.title" -}}
      {{ if or (eq .CommonLabels.severity "page") (eq .CommonLabels.severity "critical") }}🔴{{ else }}🟡{{ end }} {{ if eq .Status "resolved" }}RESOLVED {{ end }}{{ .CommonLabels.alertname }}{{ if .CommonLabels.name }} on {{ .CommonLabels.name }}{{ else if .CommonLabels.namespace }} in {{ .CommonLabels.namespace }}{{ end }}
      {{- end }}
      {{ define "platform.slack.text" -}}
      {{ range .Alerts -}}
      • {{ if eq .Status "resolved" }}resolved: {{ end }}{{ if eq .Labels.severity "ticket" }}{{ .Annotations.summary }}{{ else }}{{ or .Annotations.description .Annotations.summary }}{{ end }}
      {{ end -}}
      {{ with (index .Alerts 0).Annotations.runbook_url }}<{{ . }}|Runbook>{{ end }}{{ template "slack.links" . }}
      {{- end }}

grafana:
  fullnameOverride: grafana
  admin:
    existingSecret: grafana-admin # from the secret store (deploy/secrets/monitoring.yaml)
  # Reached at this address (deploy/kind/tools/monitoring.yaml); Grafana builds its links
  # and login redirects from it.
  grafana.ini:
    server:
      root_url: http://grafana.localhost:8090
  # The logs, beside the metrics: VictoriaLogs (deploy/kind/victoria-logs-values.yaml) as a
  # data source, read in Explore (docs/RUNBOOK.md, Logs). Its plugin isn't part of Grafana:
  # Grafana downloads it from grafana.com before it starts, unless its plugin directory
  # already holds this version. Pinned to a version, signed by its publisher (Grafana checks
  # the signature at every start): a bump is a change here. The store's NetworkPolicy admits
  # Grafana's pods by name (tests/test_platform.py).
  plugins:
    - victoriametrics-logs-datasource@0.33.1
  # The plugin directory on a volume of its own (the claim is extraManifests, at the end),
  # so a pod that starts with no route to grafana.com finds the plugin there (PT-13). Only
  # that directory: the rest of Grafana's disk stays an emptyDir, so its database is still
  # rebuilt from git and the secret store at every start.
  extraVolumes:
    - name: plugins
      existingClaim: grafana-plugins
  extraVolumeMounts:
    - name: plugins
      mountPath: /var/lib/grafana/plugins
      readOnly: false
  additionalDataSources:
    - name: VictoriaLogs
      uid: victorialogs
      type: victoriametrics-logs-datasource
      access: proxy # Grafana's server asks the store; the browser never reaches it
      url: http://victoria-logs.monitoring.svc:9428
  # Dashboards come from ConfigMaps labelled grafana_dashboard=1 in any namespace (the
  # chart's defaults); shortly's prod release ships the SLO dashboard that way.
  # Memory from 7 days of use (2026-11-16, PT-39): the process peaked at 640 MiB RSS, typically
  # about 320. Its working set reads higher (~575 MiB) because it counts page cache for the
  # SQLite database and search index on the emptyDirs, which the kernel drops before an OOM
  # kill. The limit is about 1.5x the peak RSS.
  resources:
    requests: { cpu: 50m, memory: 384Mi }
    limits: { memory: 1Gi }
  # The dashboard and data source sidecars: about 75 MiB each, peak 87.
  sidecar:
    resources:
      requests: { cpu: 5m, memory: 96Mi }
      limits: { memory: 128Mi }

# Grafana's plugin directory (grafana.extraVolumes). Deleting the claim only costs a
# download at Grafana's next start.
extraManifests:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: grafana-plugins
    spec:
      storageClassName: standard # kind's local-path provisioner
      accessModes: [ReadWriteOnce]
      resources:
        requests: { storage: 1Gi }

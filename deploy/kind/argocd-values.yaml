# Argo CD for the kind cluster: GitOps for the apps' environments and for the platform under
# them (deploy/argocd/). scripts/cluster.sh bootstraps it with Helm on a fresh cluster; from
# then on its own `argocd` Application syncs this file, so a merged change here lands within
# a minute (PT-109). A change that breaks Argo CD stops it syncing its own fix: RUNBOOK,
# Argo CD broke itself. One replica of everything, no SSO, no notifications: a laptop, not a
# team. The UI is at http://argocd.localhost:8090, through the Gateway's tools listener
# (deploy/kind/tools/argocd.yaml).
global:
  domain: argocd.localhost:8090

crds:
  # The chart's default (server-side apply: they are too large for the last-applied
  # annotation), and never pruned once Argo CD manages its own install (PT-109): deleting
  # the Application CRD deletes every Application.
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true,Prune=false

configs:
  params:
    # No TLS between the browser and the server: the front door listens on 127.0.0.1 only
    # (scripts/cluster.sh). Never on a cluster where the server is exposed.
    server.insecure: true
    # Keep each resource's health in the Application (.status.resources[].health): Argo CD
    # 3 stopped writing it there by default. scripts/cluster.sh's progress lines, its
    # failure output and CI's "Argo CD state" step read it to say what is Degraded and why.
    # Costs more Application updates; nothing at this size.
    controller.resource.health.persist: "true"
    # Apply each watch event to the controller's cache in the watch's own goroutine, in
    # order, not in batches from a queue. With batches (the default), a CRD event holds the
    # cache lock for discovery and an OpenAPI reload; a watch the API server ends meanwhile
    # (it does when a CRD's storage changes) re-lists, and the queued, older events are then
    # applied on top: the cache keeps a stale copy until the watch restarts, 10 minutes
    # later, and no refresh clears it (argoproj/argo-cd#30381). On a fresh cluster, with
    # about 100 CRDs arriving at once, that was CRDs shown OutOfSync, "not established" or
    # Missing, and kube-prometheus-stack's Prometheus "Waiting for initialization", for
    # minutes after the API server had them ready (links' kind e2e, PT-71).
    controller.cluster.cache.batch.events.processing: "false"
    # Cap self-heal's backoff at 30 s instead of 5 minutes. On a fresh cluster each CRD-heavy
    # child (argo-rollouts, barman-cloud, cloudnative-pg, envoy-gateway) self-heals 4 or 5
    # times while its CRDs settle, and the default backoff (2 s, times 3 each attempt, capped
    # at 300 s) left each one waiting 2m40s before its next sync, with every resource already
    # applied and healthy (links run 44192123904, cluster.sh's self-heal report, PT-71). The
    # backoff guards against fighting a controller that rewrites a field; 30 s still does,
    # at one sync per 30 s at most.
    controller.self.heal.backoff.cap.seconds: "30"
  cm:
    # Check the repository for changes every 60 s instead of 180 s: a merged promotion PR
    # reaches the cluster within a minute. (A webhook from GitHub would make it instant;
    # it needs the server reachable from the internet, which a laptop isn't.)
    timeout.reconciliation: 60s
    # Admin login for the UI on a laptop; the generated password is in the Secret
    # argocd-initial-admin-secret.
    admin.enabled: true
    statusbadge.enabled: false
    exec.enabled: false
    # Argo CD's own CRD health check (resource_customizations, v3.5.6), with one change: a
    # CRD with no Established condition is Progressing, not Degraded. Right after a sync
    # re-applies a CRD, Argo CD's cached copy can lack the condition for a minute or two
    # while the API server has long established it; as Degraded it failed the platform
    # root's sync (a Degraded child fails its wave), as Progressing the wave just waits.
    # Names refused or a non-structural schema are still Degraded.
    resource.customizations.health.apiextensions.k8s.io_CustomResourceDefinition: |
      local hs = {}
      if obj.metadata.deletionTimestamp ~= nil then
        hs.status = "Progressing"
        hs.message = "CRD is terminating"
        return hs
      end
      if obj.status == nil or obj.status.conditions == nil or #obj.status.conditions == 0 then
        hs.status = "Progressing"
        hs.message = "Status conditions not found"
        return hs
      end
      local isEstablished = false
      for _, condition in pairs(obj.status.conditions) do
        if condition.type == "Terminating" and condition.status == "True" then
          hs.status = "Progressing"
          hs.message = "CRD is terminating: " .. (condition.message or "")
          return hs
        end
        if condition.type == "NamesAccepted" and condition.status == "False" then
          hs.status = "Degraded"
          hs.message = "CRD names have not been accepted: " .. (condition.message or "")
          return hs
        end
        if condition.type == "NonStructuralSchema" and condition.status == "True" then
          hs.status = "Degraded"
          hs.message = "Schema violations found: " .. (condition.message or "")
          return hs
        end
        if condition.type == "Established" and condition.status == "True" then
          isEstablished = true
        end
      end
      if not isEstablished then
        hs.status = "Progressing"
        hs.message = "CRD is not established yet"
        return hs
      end
      hs.status = "Healthy"
      hs.message = "CRD is healthy"
      return hs
    # Report an Application's own health, so the platform root's sync waves wait for each
    # wave's children to be Healthy before the next (Argo CD dropped this default in 1.8).
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil and obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
      return hs

dex:
  enabled: false # no SSO
notifications:
  enabled: false
applicationSet:
  replicas: 1 # generates every app's Applications from the platform repo's apps/ (platform plan 3.3)
  # Its metrics Service, scraped by the platform as the controller's is (below): with it
  # down, a new app or environment never gets its Application, and nothing else says so.
  metrics:
    enabled: true

controller:
  replicas: 1
  # The metrics Service; the ServiceMonitor and the alerts on Argo CD come with the
  # platform (deploy/argocd/platform/templates/monitoring.yaml), once the monitoring
  # CRDs exist. Argo CD is installed before them, so it can't ship its own.
  metrics:
    enabled: true
  # It caches every resource it manages. 768Mi was enough for the app; with the platform
  # (kube-prometheus-stack, Kyverno, Envoy Gateway and their large CRDs) it crash-looped in
  # CI, and nothing synced while it was down.
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 2Gi }
  # Go lets the heap double before it collects, so a sync burst took it to 1.8 GiB for a live
  # heap of at most 0.6 GiB: memory the kind node needs then (PT-50, docs/RUNBOOK.md, Node
  # memory). A soft limit: past it the controller collects harder, it isn't killed.
  # 768MiB, not 1GiB (PT-104): a sync burst is when the node runs out of room, so the limit
  # sits about 25% above that 0.6 GiB burst peak, close enough to cap the burst and far
  # enough that the collector doesn't run all the time. At rest it holds about 570 MiB for
  # a 425 MiB live heap (2026-11-19).
  env:
    - { name: GOMEMLIMIT, value: 768MiB }
server:
  replicas: 1
  resources:
    # Peak 9m on the laptop (5-minute rate, a day of use, 2026-11-17; PT-71).
    requests: { cpu: 15m, memory: 64Mi }
    limits: { memory: 256Mi }
repoServer:
  replicas: 1
  # Its metrics Service, scraped by the platform as the controller's is (above): its git
  # failures are the one sign that it can't read GitHub (every Application stays Synced).
  metrics:
    enabled: true
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
redis:
  # The chart pulls Redis from ECR Public, which refuses anonymous pulls from shared runner
  # addresses once their data limit is hit (CI failed with ImagePullBackOff, from both
  # ecr-public.aws.com and public.ecr.aws). The same official image from Docker Hub, where
  # postgres:17-alpine already comes from, pinned by the same digest.
  image:
    repository: docker.io/library/redis
    tag: 8.6.4-alpine@sha256:2cc044fc5a07c9b701f8f1255a309ae9ad7856e694ac03513bf3648c01e40763
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }

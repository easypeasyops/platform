# Argo Rollouts for the kind cluster (Argo CD, deploy/argocd/platform/). It runs prod's canary releases:
# a Rollout shifts traffic on the HTTPRoute step by step and checks Prometheus before each.
controller:
  replicas: 1 # a real cluster runs 2 (leader election); here one is enough
  resources:
    # Uses 8m at its peak on the laptop (5-minute rate, a day of use, 2026-11-17): 20m is
    # 2.5x that, and fits the CI node's CPU budget (PT-71, docs/RUNBOOK.md, The CI node's CPU budget).
    requests: { cpu: 20m, memory: 120Mi } # memory: median +10% (PT-121)
    limits: { memory: 256Mi }
  # The Gateway API traffic router is a plugin the controller downloads at start, pinned by
  # version and checksum. The platform chart sets `trafficRouterPlugins` for the node's
  # architecture (amd64 in CI, arm64 on Apple silicon; deploy/argocd/platform/values.yaml).
  # The metrics Service (argo-rollouts-metrics, port `metrics`), scraped by the platform's
  # ServiceMonitor (deploy/argocd/platform/templates/monitoring.yaml). Not the chart's: it
  # renders one whether or not the CRD exists, and a cluster without monitoring could then
  # never sync Argo Rollouts.
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false
dashboard:
  enabled: false
# Least privilege: RBAC for the Gateway API router only, not for every mesh it supports.
providerRBAC:
  enabled: true
  providers:
    istio: false
    smi: false
    ambassador: false
    awsLoadBalancerController: false
    awsAppMesh: false
    traefik: false
    apisix: false
    contour: false
    glooPlatform: false
    gatewayAPI: true

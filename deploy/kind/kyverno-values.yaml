# Kyverno for the kind cluster (Argo CD, deploy/argocd/platform/), sized for one laptop node.
# The policies themselves live in deploy/policies/.
# No PreSync Job checking for legacy kyverno.io policies: there are none
# (tests/test_admission_policies.py), and on a busy node the Job missed its 120 s deadline
# every time, so Argo CD retried the whole sync for an hour (2026-11-16, chart 3.10.0).
upgrade:
  legacyPolicyCheck:
    enabled: false
admissionController:
  # Two, so a restart of one doesn't block app pods: the provenance policy fails closed, so
  # while no admission pod is ready, no Pod can start in staging or prod. The PDB keeps one
  # through a drain; the chart's default anti-affinity spreads them across nodes when there
  # is more than one. Each costs about 90Mi on the laptop (PT-46). In a real cluster run 3.
  replicas: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  container:
    resources:
      # The CI node had no CPU left to schedule the canary's pod at 2 × 100m (links #169).
      # The two together peak at 29m on the laptop (5-minute rate, a day of use, 2026-11-17):
      # 30m each is about twice one's share, and fits the CI node's CPU budget (PT-71).
      # memory: median +10% (PT-121)
      requests: { cpu: 30m, memory: 120Mi }
      limits: { memory: 384Mi }
# We validate, and generate one thing: the background controller runs the restore drills'
# GeneratingPolicy (a CronJob in restore-drill per database with backups, PT-44). Its
# ClusterRole gets only what that needs, on top of the chart's: read the databases'
# ScheduledBackups (the trigger) and manage CronJobs (what it generates). The cleanup
# controller isn't used; the reports controller turns background scans into PolicyReports.
backgroundController:
  enabled: true
  rbac:
    clusterRole:
      extraResources:
        - apiGroups: [postgresql.cnpg.io]
          resources: [scheduledbackups]
          verbs: [get, list, watch]
        - apiGroups: [batch]
          resources: [cronjobs]
          verbs: [get, list, watch, create, update, patch, delete]
  # The chart's 64Mi request and 128Mi limit are below what its sibling, the reports
  # controller, uses on the laptop (about 100Mi, 2026-11-19): requested at that, with room.
  # CPU as the admission controller's: it works only when a ScheduledBackup changes.
  resources:
    requests: { cpu: 25m, memory: 96Mi }
    limits: { memory: 256Mi }
cleanupController:
  enabled: false
reportsController:
  enabled: true
  # Read the databases' ScheduledBackups, which the restore drills' GeneratingPolicy matches:
  # without it the policy reports Ready false ("missing permissions ... scheduledbackups"),
  # though it generates all the same (PT-44).
  rbac:
    clusterRole:
      extraResources:
        - apiGroups: [postgresql.cnpg.io]
          resources: [scheduledbackups]
  # Background work, so a CPU limit is right here (unlike the app, which has none: a
  # limit throttles a latency-sensitive process even on an idle node). Without one, its
  # scans took up to 9 of the node's cores and slowed every request (DESIGN, issues).
  resources:
    # CPU: peak 17m on the laptop (as above; PT-71). Memory: median +10% (PT-121).
    requests: { cpu: 25m, memory: 112Mi }
    limits: { cpu: 500m, memory: 256Mi }

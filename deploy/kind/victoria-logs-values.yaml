# VictoriaLogs (single node) for the local kind cluster, deployed by Argo CD
# (deploy/argocd/platform/, the `logs` Application): where the pods' logs are kept, so they
# outlive the pod that wrote them. In `monitoring`, beside Grafana, which reads it.
# The collector (deploy/kind/log-collector-values.yaml) writes to it (docs/RUNBOOK.md, Logs).

# VictoriaLogs has no login: whoever reaches port 9428 can read and write every log. So only
# these may: the collector's namespace (it holds nothing else), Grafana and Prometheus.
networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: log-collector } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: grafana } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: prometheus } }
      ports: [{ port: 9428, protocol: TCP }]

server:
  fullnameOverride: victoria-logs # the Service the collector and Grafana name, port 9428
  # 30 days, or less if the logs outgrow 800 MiB first: the oldest day goes, whatever its
  # age, so the volume never fills. The disk is what a cloud bills for, so it is sized to the
  # logs: about 15 MB a day before the platform's components went to warn (2026-11-21),
  # and 57 MB on disk then for 10 days. 30 days fit with room.
  retentionPeriod: 30d
  retentionDiskSpaceUsage: 800MiB
  # A StatefulSet's volume template can't be changed in place: after a change here,
  # `kubectl -n monitoring delete statefulset victoria-logs --cascade=orphan`, and Argo CD
  # recreates it (pod and volume stay). The volume itself keeps its old size until it is
  # recreated; kind's local-path doesn't enforce sizes anyway.
  persistentVolume:
    storageClassName: standard # kind's local-path provisioner
    size: 1Gi
  # Memory from 7 days of use (2026-11-16, PT-39): usually about 100 MiB (working set p95
  # 330), with short peaks to 816 MiB RSS during big queries or merges. The limit is about
  # 1.5x that peak.
  resources:
    # CPU: peak 20m on the laptop (5-minute rate, a day of use, 2026-11-17; PT-71).
    requests: { cpu: 25m, memory: 240Mi } # memory: median +10% (PT-121)
    limits: { memory: 1280Mi }
  # The namespace enforces Pod Security "restricted", and the chart's defaults miss one thing
  # it asks for, the seccomp profile. The other three are the chart's defaults, repeated
  # because a map given here replaces them.
  podSecurityContext:
    enabled: true
    fsGroup: 2000
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile: { type: RuntimeDefault }
  # Its own metrics (vl_*), scraped like everything else: Prometheus selects ServiceMonitors
  # in every namespace (deploy/kind/monitoring-values.yaml).
  serviceMonitor:
    enabled: true
    annotations:
      # Its CRD comes with kube-prometheus-stack, another Application in the same wave. Argo
      # CD dry-runs every resource first, and the dry run of a kind that doesn't exist yet
      # fails the whole sync: skip it for this one (as deploy/argocd/platform/templates/monitoring.yaml).
      argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true

# External Secrets Operator for the kind cluster (Argo CD, deploy/argocd/platform/), sized
# for one laptop node. It turns ExternalSecrets into Secrets, reading the platform's store
# (deploy/secrets/store.yaml) and running its generators; nothing else here is used.
# One replica of each: a down controller only delays a refresh, existing Secrets stay.
resources:
  requests: { cpu: 10m, memory: 64Mi }
  limits: { memory: 256Mi }
webhook:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
certController:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
# Scraped like everything else: Prometheus selects ServiceMonitors in every namespace
# (deploy/kind/monitoring-values.yaml). One per Deployment, with a metrics Service each; the
# alerts (deploy/argocd/platform/files/external-secrets-rules.yaml) read the controller's.
# The chart renders them only once the ServiceMonitor CRD exists (renderMode skipIfMissing,
# its default): this chart is in wave -1 and the CRD arrives in wave 0, so on a fresh
# cluster they come with Argo CD's next comparison, and never without the monitoring stack.
serviceMonitor:
  enabled: true

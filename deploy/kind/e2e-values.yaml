# Test-only values that scripts/k8s-e2e.sh adds to every deploy (DEPLOY_EXTRA_VALUES), and
# to the Argo CD Application in step 12. Same logic as production, shorter clocks:
#   - Prometheus scrapes the app every 5 s instead of 15 s, so a new canary pod has data
#     within seconds of starting;
#   - canary analysis: 15 s delay (three scrapes), then 2 checks 5 s apart (production:
#     60 s, 4 x 30 s). Still two measurements, so a latency check (which aborts on the
#     second bad one) can still fail a canary.
#   - the canary's minimum traffic: 0.2 req/s instead of 0.5. On CI's shared kind node k6
#     delivers about 7 of its 20 req/s, so the canary's 10% step gets 0.5 to 0.7 req/s, and
#     its first measurements, over a pod a few seconds old, read lower still (0.25 and 0.42
#     in links #136's first run). At 0.5 the `traffic` check aborted healthy canaries in 3
#     of 6 runs; 0.2 still proves traffic reaches the canary.
# Together they take a canary step from about 2 minutes to about 20 s.
monitoring:
  scrapeInterval: 5s
canary:
  analysis:
    initialDelay: 15s
    interval: 5s
    count: 2
    minRequestRate: 0.2

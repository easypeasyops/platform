# The cluster's front door: one Gateway (Gateway API, served by Envoy Gateway) that routes
# by hostname. Deployed by Argo CD (the platform's `gateway` Application, wave 1: after
# Envoy Gateway and its CRDs).
#
#   listener http  (users)   http://sho.rt.localhost:8080          prod
#                            http://staging.sho.rt.localhost:8080  staging
#   listener tools (you)     http://argocd.localhost:8090          Argo CD
#                            http://grafana.localhost:8090         Grafana
#                            http://prometheus.localhost:8090      Prometheus
#                            http://alertmanager.localhost:8090    Alertmanager
#
# `.localhost` names resolve to 127.0.0.1 on any machine. Ports 8080 and 8090 on the laptop
# are always there: scripts/cluster.sh runs a small forwarder container next to the kind
# node (the "front door", RUNBOOK), so no `kubectl port-forward` to start or restart.
#
# Two listeners, so the app's routes and the tools' routes can't mix: only staging and
# prod may attach to `http`, only argocd and monitoring to `tools` (deploy/kind/tools/).
# On a real cluster the tools would sit behind a separate, internal load balancer with SSO.
#
# The chart's HTTPRoute (deploy/helm/shortly/templates/httproute.yaml) attaches each release
# to this Gateway. In prod, Argo Rollouts shifts that route's weights during a canary.
---
# How Envoy Gateway runs the proxy for this class: a NodePort Service with a fixed name and
# fixed node ports. kind has no load balancer; the front-door containers forward the
# laptop's 8080 and 8090 to these node ports (scripts/cluster.sh, FRONT_DOOR_PORTS).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: shortly
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        name: shortly-gateway
        type: NodePort
        # Envoy Gateway picks random node ports; pin them (merged by port number).
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - { port: 80, nodePort: 30080 }
                - { port: 8081, nodePort: 30081 }
      envoyDeployment:
        replicas: 1
        container:
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
  # The access log: one JSON line per request to stdout, which the log collector sends to
  # VictoriaLogs like any pod's (RUNBOOK, The access log). The keys are the fields
  # to search by: `msg` and `time` become `_msg` and `_time`, `request_id` is the
  # X-Request-ID the proxy gave the request (Envoy Gateway generates one at the edge) and the
  # app logs too. No query string (REQ_WITHOUT_QUERY) and no other header: they can carry
  # secrets. Without this, Envoy Gateway's default format logs both, and no `_msg`.
  # One setting with no `type`: route-level lines, plus listener-level ones for requests no
  # route matched (NR), so a 404 for an unknown hostname is logged too.
  telemetry:
    accessLog:
      settings:
        - format:
            type: JSON
            json:
              time: "%START_TIME%"
              msg: "%REQ(:METHOD)% %REQ(:AUTHORITY)%%REQ_WITHOUT_QUERY(X-ENVOY-ORIGINAL-PATH?:PATH)% %RESPONSE_CODE% %RESPONSE_FLAGS%"
              request_id: "%REQ(X-REQUEST-ID)%"
              method: "%REQ(:METHOD)%"
              authority: "%REQ(:AUTHORITY)%"
              path: "%REQ_WITHOUT_QUERY(X-ENVOY-ORIGINAL-PATH?:PATH)%"
              response_code: "%RESPONSE_CODE%"
              response_flags: "%RESPONSE_FLAGS%"
              response_code_details: "%RESPONSE_CODE_DETAILS%"
              duration_ms: "%DURATION%"
              upstream_host: "%UPSTREAM_HOST%"
              route_name: "%ROUTE_NAME%"
          sinks:
            - type: File
              file: { path: /dev/stdout }
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: shortly
    namespace: envoy-gateway-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: gateway
  labels:
    pod-security.kubernetes.io/enforce: restricted # holds no pods; the proxy runs in envoy-gateway-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shortly
  namespace: gateway
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      # Only the app namespaces may attach routes: a route elsewhere can't capture a hostname.
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              # Every app's namespaces, by the label the apps ApplicationSet gives them (5.7).
              - { key: easypeasyops.github.io/app, operator: Exists }
    # The dev tools (Argo CD, Grafana, Prometheus, Alertmanager). Its own port, so nothing on
    # the users' listener can reach them, and its own namespace allowlist.
    - name: tools
      protocol: HTTP
      port: 8081
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - { key: kubernetes.io/metadata.name, operator: In, values: [argocd, monitoring] }

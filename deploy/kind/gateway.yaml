# The cluster's front door: one Gateway (Gateway API, served by Envoy Gateway) that routes
# by hostname. Deployed by Argo CD (the platform's `gateway` Application, wave 1: after
# Envoy Gateway and its CRDs).
#
#   listener http  (users)   http://<app>.localhost:8080           prod, e.g. aipostit
#                            http://staging.<app>.localhost:8080   staging
#   listener tools (you)     http://argocd.localhost:8090          Argo CD
#                            http://grafana.localhost:8090         Grafana
#                            http://prometheus.localhost:8090      Prometheus
#                            http://alertmanager.localhost:8090    Alertmanager
#                            http://servicemonitor.localhost:8090  servicemonitor (an app)
#
# Each app's values name its hostnames; every hostname served is also probed: an app's in
# appFrontDoorProbes (apps/front-door-probes.yaml), a tool's in frontDoorProbes
# (deploy/argocd/platform/values.yaml). CI checks both against the routes.
#
# `.localhost` names resolve to 127.0.0.1 on any machine. Ports 8080 and 8090 on the laptop
# are always there: scripts/cluster.sh runs a small forwarder container next to the kind
# node (the "front door", RUNBOOK), so no `kubectl port-forward` to start or restart.
#
# Two listeners, so the app's routes and the tools' routes can't mix: any app namespace
# may attach to `http` (by the easypeasyops.github.io/app label: staging, prod and ops
# alike), only argocd and monitoring to `tools` (deploy/kind/tools/), and the one app that
# is a tool, by its namespace's name (its route names the listener).
# On a real cluster the tools would sit behind a separate, internal load balancer with SSO.
#
# The service chart's HTTPRoute (charts/service/templates/httproute.yaml) attaches each release
# to this Gateway. In prod, Argo Rollouts shifts that route's weights during a canary.
---
# How Envoy Gateway runs the proxy for this class: a NodePort Service with a fixed name and
# fixed node ports. kind has no load balancer; the front-door containers forward the
# laptop's 8080 and 8090 to these node ports (scripts/cluster.sh, FRONT_DOOR_PORTS).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: front-door
  namespace: envoy-gateway-system
  annotations:
    # Before the GatewayClass that names it. In one wave Argo CD applies these kinds in
    # name order, so GatewayClass `envoy` went first; Envoy Gateway then marks the class
    # InvalidParameters and, now and then, never looks again (links CI, 2026-11-16).
    argocd.argoproj.io/sync-wave: "-1"
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        name: front-door
        type: NodePort
        # Not Envoy Gateway's default, Local. With Local (v1.10), the Gateway's address is
        # the nodes with a ready proxy endpoint, read only when the Gateway's status is
        # written: after a laptop sleep the endpoint is briefly not ready, the Gateway is
        # left with no address and Programmed=False (AddressNotAssigned) until the
        # controller restarts (PT-68). Cluster gives it the node's address always. One
        # node and no client IP logged, so nothing is lost.
        externalTrafficPolicy: Cluster
        # Envoy Gateway picks random node ports; pin them (merged by port number).
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - { port: 80, nodePort: 30080 }
                - { port: 8081, nodePort: 30081 }
      envoyDeployment:
        replicas: 1
        container:
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
  # The access log: one JSON line per request to stdout, which the log collector sends to
  # VictoriaLogs like any pod's (RUNBOOK, The access log). The keys are the fields
  # to search by: `msg` and `time` become `_msg` and `_time`, `request_id` is the
  # X-Request-ID the proxy gave the request (Envoy Gateway generates one at the edge) and the
  # app logs too. No query string (REQ_WITHOUT_QUERY) and no other header: they can carry
  # secrets. Without this, Envoy Gateway's default format logs both, and no `_msg`.
  # One setting with no `type`: route-level lines, plus listener-level ones for requests no
  # route matched (NR), so a 404 for an unknown hostname is logged too.
  telemetry:
    accessLog:
      settings:
        - format:
            type: JSON
            json:
              time: "%START_TIME%"
              msg: "%REQ(:METHOD)% %REQ(:AUTHORITY)%%REQ_WITHOUT_QUERY(X-ENVOY-ORIGINAL-PATH?:PATH)% %RESPONSE_CODE% %RESPONSE_FLAGS%"
              request_id: "%REQ(X-REQUEST-ID)%"
              method: "%REQ(:METHOD)%"
              authority: "%REQ(:AUTHORITY)%"
              path: "%REQ_WITHOUT_QUERY(X-ENVOY-ORIGINAL-PATH?:PATH)%"
              response_code: "%RESPONSE_CODE%"
              response_flags: "%RESPONSE_FLAGS%"
              response_code_details: "%RESPONSE_CODE_DETAILS%"
              duration_ms: "%DURATION%"
              upstream_host: "%UPSTREAM_HOST%"
              route_name: "%ROUTE_NAME%"
          sinks:
            - type: File
              file: { path: /dev/stdout }
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: front-door
    namespace: envoy-gateway-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: gateway
  labels:
    pod-security.kubernetes.io/enforce: restricted # holds no pods; the proxy runs in envoy-gateway-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: front-door
  namespace: gateway
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      # Only the app namespaces may attach routes: a route elsewhere can't capture a hostname.
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              # Every app's namespaces, by the label the apps ApplicationSet gives them (5.7).
              - { key: easypeasyops.github.io/app, operator: Exists }
    # The dev tools (Argo CD, Grafana, Prometheus, Alertmanager). Its own port, so nothing on
    # the users' listener can reach them, and its own namespace allowlist.
    - name: tools
      protocol: HTTP
      port: 8081
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              # By name, never by a label an app's namespace could carry: the tools' own two,
              # and servicemonitor-ops, an app served here (the service chart's
              # gateway.sectionName).
              - key: kubernetes.io/metadata.name
                operator: In
                values: [argocd, monitoring, servicemonitor-ops]

# Applied to each app namespace by scripts/cluster.sh. With the service chart's own policies
# (the app's, and its database's: charts/service/templates/networkpolicy.yaml and
# database.yaml), traffic inside a namespace is:
#
#   anyone ──8000──▶ shortly ──5432──▶ shortly-db (CloudNativePG)   (and ──53──▶ kube-dns)
#   prometheus (monitoring ns) ──9100──▶ shortly, ──9187──▶ shortly-db
#   cnpg-system (the operator) ──8000──▶ shortly-db
#
# and nothing else gets in. Proven by links' scripts/k8s-e2e.sh (step 9), which needs these
# refusals to happen: a CNI that ignored NetworkPolicy would fail it, not pass silently.

# Default deny: a pod receives traffic only if some policy lets it in. New workloads start
# closed, and an allow rule has to be written (and reviewed) to open them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]

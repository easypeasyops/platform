# The chaos drill: once a week, hold the External Secrets controller down until its alert
# fires, then check it comes back and the alert resolves (drill.py says how and why that
# component). It runs in `monitoring`, beside the provenance canary, and reports the same
# way: a failed run is a failed Job, which the stack's KubeJobFailed sends to
# #platform-alerts. tests/test_chaos_drill.py checks what it is allowed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chaos-drill
  namespace: monitoring
---
# Read the controller's Deployment, watch and delete pods in its namespace. RBAC can't
# name pods by label: the policy below keeps the deletes to the controller's.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chaos-drill
  namespace: external-secrets
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [external-secrets]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, watch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chaos-drill
  namespace: external-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: chaos-drill
subjects:
  - { kind: ServiceAccount, name: chaos-drill, namespace: monitoring }
---
# The drill deletes the controller's pods and no others: not the webhook's (a refused
# ExternalSecret), not the cert controller's.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: chaos-drill-controller-pods-only
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [DELETE]
        resources: [pods]
  matchConditions:
    - name: the-drill
      expression: request.userInfo.username == "system:serviceaccount:monitoring:chaos-drill"
  validations:
    - expression: >-
        has(oldObject.metadata.labels) &&
        "app.kubernetes.io/name" in oldObject.metadata.labels &&
        oldObject.metadata.labels["app.kubernetes.io/name"] == "external-secrets"
      message: the chaos drill deletes the External Secrets controller's pods only
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: chaos-drill-controller-pods-only
spec:
  policyName: chaos-drill-controller-pods-only
  validationActions: [Deny]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: chaos-drill
  namespace: monitoring
  labels: { app.kubernetes.io/name: chaos-drill }
  annotations:
    # As the provenance canary's: a failed run is the drill's finding, not a broken deploy.
    argocd.argoproj.io/ignore-healthcheck: "true"
spec:
  # Mondays at 10:00 in the laptop's time zone: awake, and the week's first look at the
  # channel sees it. A missed run (the laptop asleep) starts on wake.
  schedule: "0 10 * * 1"
  timeZone: America/Los_Angeles
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    metadata:
      labels: { app.kubernetes.io/name: chaos-drill }
    spec:
      backoffLimit: 0 # one try a week: a second outage straight after the first proves nothing new
      activeDeadlineSeconds: 1800 # the three deadlines (25 minutes), and room
      # Kept for six days: KubeJobFailed speaks for a failed run until it is gone, or
      # until it is deleted by hand once understood (RUNBOOK).
      ttlSecondsAfterFinished: 518400
      template:
        metadata:
          labels: { app.kubernetes.io/name: chaos-drill }
        spec:
          serviceAccountName: chaos-drill
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: drill
              image: python:3.14.10-alpine3.24@sha256:5862d971d1f0ae26b258cefa4e893556b1d3aba81bd2ff30888704ad378bab67
              args: [python, -u, /drill/drill.py]
              env:
                - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: [ALL] }
                readOnlyRootFilesystem: true
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { memory: 64Mi }
              volumeMounts:
                - { name: drill, mountPath: /drill, readOnly: true }
          volumes:
            - name: drill
              configMap: { name: chaos-drill }

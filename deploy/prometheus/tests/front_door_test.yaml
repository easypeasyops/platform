# promtool unit tests for the front door's alerts: synthetic series in, expected alerts
# out. Run by tests/test_alerting.py with the other files here.
rule_files:
  - ../../argocd/platform/files/front-door-rules.yaml

evaluation_interval: 1m

tests:
  # Staging's pods are gone and nobody asks for the route: its status says so all the same.
  # Prod's route, with a backend, stays quiet. The series as kube-state-metrics gives them
  # (deploy/kind/monitoring-values.yaml), with its own pod's namespace.
  - name: a route with no ready pod for ten minutes opens a ticket that names it
    interval: 1m
    input_series:
      - series: 'gateway_httproute_status_condition{job="kube-state-metrics",namespace="monitoring",route_namespace="aipostit-staging",route="aipostit",type="Accepted",reason="Accepted"}'
        values: '1x25'
      - series: 'gateway_httproute_status_condition{job="kube-state-metrics",namespace="monitoring",route_namespace="aipostit-staging",route="aipostit",type="ResolvedRefs",reason="ResolvedRefs"}'
        values: '1x25'
      - series: 'gateway_httproute_status_condition{job="kube-state-metrics",namespace="monitoring",route_namespace="aipostit-staging",route="aipostit",type="BackendsAvailable",reason="EndpointsNotFound"}'
        values: '_x5 0x20'
      - series: 'gateway_httproute_status_condition{job="kube-state-metrics",namespace="monitoring",route_namespace="aipostit-prod",route="aipostit",type="ResolvedRefs",reason="ResolvedRefs"}'
        values: '1x25'
    alert_rule_test:
      - eval_time: 8m # no backend for three minutes: still pending
        alertname: FrontDoorRouteWithoutBackend
        exp_alerts: []
      - eval_time: 15m
        alertname: FrontDoorRouteWithoutBackend
        exp_alerts:
          - exp_labels: {route_namespace: aipostit-staging, route: aipostit, type: BackendsAvailable, reason: EndpointsNotFound, severity: ticket}
            exp_annotations:
              summary: "Route aipostit-staging/aipostit has no backend to send to (EndpointsNotFound): the front door answers 5xx itself"
              description: Requests to a route whose Service has no ready pod, or doesn't exist, get a 503 or 500 from the proxy. They never reach the app, so its own metrics and alerts don't show them.
              runbook_url: https://github.com/easypeasyops/platform/blob/main/docs/RUNBOOK.md#a-route-with-no-backend
              dashboard_url: /d/front-door

  - name: a route to a Service that doesn't exist opens one too
    interval: 1m
    input_series:
      - series: 'gateway_httproute_status_condition{job="kube-state-metrics",namespace="monitoring",route_namespace="monitoring",route="grafana",type="ResolvedRefs",reason="BackendNotFound"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: FrontDoorRouteWithoutBackend
        exp_alerts:
          - exp_labels: {route_namespace: monitoring, route: grafana, type: ResolvedRefs, reason: BackendNotFound, severity: ticket}
            exp_annotations:
              summary: "Route monitoring/grafana has no backend to send to (BackendNotFound): the front door answers 5xx itself"
              description: Requests to a route whose Service has no ready pod, or doesn't exist, get a 503 or 500 from the proxy. They never reach the app, so its own metrics and alerts don't show them.
              runbook_url: https://github.com/easypeasyops/platform/blob/main/docs/RUNBOOK.md#a-route-with-no-backend
              dashboard_url: /d/front-door

  # What must not open one: a route no listener accepts (a 404, another row of the
  # runbook's table), and a few minutes without a ready pod while a single one restarts.
  - name: a route not accepted and a restart's gap stay quiet
    interval: 1m
    input_series:
      - series: 'gateway_httproute_status_condition{job="kube-state-metrics",namespace="monitoring",route_namespace="links-staging",route="links",type="Accepted",reason="NotAllowedByListeners"}'
        values: '0x30'
      - series: 'gateway_httproute_status_condition{job="kube-state-metrics",namespace="monitoring",route_namespace="links-staging",route="links",type="ResolvedRefs",reason="ResolvedRefs"}'
        values: '1x30'
      - series: 'gateway_httproute_status_condition{job="kube-state-metrics",namespace="monitoring",route_namespace="aipostit-prod",route="aipostit",type="BackendsAvailable",reason="EndpointsNotFound"}'
        values: '_x5 0x3 stale'
    alert_rule_test:
      - eval_time: 10m
        alertname: FrontDoorRouteWithoutBackend
        exp_alerts: []
      - eval_time: 25m
        alertname: FrontDoorRouteWithoutBackend
        exp_alerts: []

  # The proxy's pod is gone and the controller is down too, so nothing replaces it: no
  # series at all for the job. The controller's own alert waits longer.
  - name: no proxy scraped for three minutes says the front door is down
    interval: 1m
    input_series:
      - series: 'up{job="envoy",namespace="envoy-gateway-system",pod="envoy-gateway-shortly-abc"}'
        values: '1x5 stale'
      - series: 'up{job="envoy-gateway",namespace="envoy-gateway-system"}'
        values: '1x5 stale'
    alert_rule_test:
      - eval_time: 8m # gone since 6m: still pending
        alertname: FrontDoorDown
        exp_alerts: []
      - eval_time: 10m
        alertname: FrontDoorDown
        exp_alerts:
          - exp_labels: {namespace: envoy-gateway-system, severity: critical}
            exp_annotations:
              summary: "The front door is down: no Envoy proxy is running (or scraped)"
              description: No Envoy proxy has been scraped for 3 minutes. Every request to every app and tool goes through it, so nothing is reachable from outside; the apps' own alerts stay quiet, as their pods are fine.
              runbook_url: https://github.com/easypeasyops/platform/blob/main/docs/RUNBOOK.md#the-front-door-is-down
      - eval_time: 10m
        alertname: FrontDoorControllerDown
        exp_alerts: []
      - eval_time: 17m
        alertname: FrontDoorControllerDown
        exp_alerts:
          - exp_labels: {namespace: envoy-gateway-system, severity: warning}
            exp_annotations:
              summary: Envoy Gateway's controller isn't running (or isn't scraped)
              description: Envoy Gateway's controller hasn't been scraped for 10 minutes. The proxies keep serving the routes they have, but no route or Gateway change reaches them, and a proxy that goes away is not replaced.
              runbook_url: https://github.com/easypeasyops/platform/blob/main/docs/RUNBOOK.md#the-front-door-is-down

  # A proxy that is there and failing its scrape (up 0) is down too; a proxy replaced
  # within a minute (a rollout, or the controller recreating a deleted Deployment) is not.
  - name: a failing scrape is down, a replaced proxy is not
    interval: 1m
    input_series:
      - series: 'up{job="envoy",namespace="envoy-gateway-system",pod="envoy-gateway-shortly-old"}'
        values: '1x5 0 stale'
      - series: 'up{job="envoy",namespace="envoy-gateway-system",pod="envoy-gateway-shortly-new"}'
        values: '_x7 1x5 0x10'
      - series: 'up{job="envoy-gateway",namespace="envoy-gateway-system"}'
        values: '1x25'
    alert_rule_test:
      - eval_time: 11m # no proxy up at 6m only: the new one is up from 7m
        alertname: FrontDoorDown
        exp_alerts: []
      - eval_time: 17m # the new one's scrape fails since 13m
        alertname: FrontDoorDown
        exp_alerts:
          - exp_labels: {namespace: envoy-gateway-system, severity: critical}
            exp_annotations:
              summary: "The front door is down: no Envoy proxy is running (or scraped)"
              description: No Envoy proxy has been scraped for 3 minutes. Every request to every app and tool goes through it, so nothing is reachable from outside; the apps' own alerts stay quiet, as their pods are fine.
              runbook_url: https://github.com/easypeasyops/platform/blob/main/docs/RUNBOOK.md#the-front-door-is-down
      - eval_time: 25m
        alertname: FrontDoorControllerDown
        exp_alerts: []

  # The Gateway as kube-state-metrics gives it: Accepted, then Programmed False once its
  # proxy has no ready replica. A few minutes of it during a rollout stay quiet.
  - name: a Gateway not Programmed for five minutes warns, and names it
    interval: 1m
    input_series:
      - series: 'gateway_status_condition{job="kube-state-metrics",namespace="monitoring",gateway_namespace="gateway",gateway="shortly",type="Accepted",reason="Accepted"}'
        values: '1x25'
      - series: 'gateway_status_condition{job="kube-state-metrics",namespace="monitoring",gateway_namespace="gateway",gateway="shortly",type="Programmed",reason="Programmed"}'
        values: '1x4 stale'
      - series: 'gateway_status_condition{job="kube-state-metrics",namespace="monitoring",gateway_namespace="gateway",gateway="shortly",type="Programmed",reason="NoResources"}'
        values: '_x5 0x3 stale _x3 0x12'
    alert_rule_test:
      - eval_time: 11m # False from 5m to 8m, then back: quiet
        alertname: FrontDoorGatewayNotProgrammed
        exp_alerts: []
      - eval_time: 20m # False again since 13m
        alertname: FrontDoorGatewayNotProgrammed
        exp_alerts:
          - exp_labels: {gateway_namespace: gateway, gateway: shortly, type: Programmed, reason: NoResources, severity: warning}
            exp_annotations:
              summary: "Gateway gateway/shortly isn't Programmed (NoResources)"
              description: "Gateway gateway/shortly has not been Programmed for 5 minutes (NoResources): its routes' changes don't reach the proxies, or no proxy serves it."
              runbook_url: https://github.com/easypeasyops/platform/blob/main/docs/RUNBOOK.md#the-front-door-is-down

  # The tools' listener refused, the users' one fine: the alert names the listener.
  - name: a listener not Accepted for five minutes warns, and names it
    interval: 1m
    input_series:
      - series: 'gateway_listener_accepted{job="kube-state-metrics",namespace="monitoring",gateway_namespace="gateway",gateway="shortly",listener="http",reason="Accepted"}'
        values: '1x15'
      - series: 'gateway_listener_accepted{job="kube-state-metrics",namespace="monitoring",gateway_namespace="gateway",gateway="shortly",listener="tools",reason="PortUnavailable"}'
        values: '0x15'
      - series: 'gateway_status_condition{job="kube-state-metrics",namespace="monitoring",gateway_namespace="gateway",gateway="shortly",type="Programmed",reason="Programmed"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 3m
        alertname: FrontDoorListenerNotAccepted
        exp_alerts: []
      - eval_time: 10m
        alertname: FrontDoorListenerNotAccepted
        exp_alerts:
          - exp_labels: {gateway_namespace: gateway, gateway: shortly, listener: tools, reason: PortUnavailable, severity: warning}
            exp_annotations:
              summary: "Listener tools of Gateway gateway/shortly isn't Accepted (PortUnavailable)"
              description: "Listener tools of Gateway gateway/shortly has not been Accepted for 5 minutes (PortUnavailable): no route attached to it is served."
              runbook_url: https://github.com/easypeasyops/platform/blob/main/docs/RUNBOOK.md#the-front-door-is-down
      - eval_time: 10m
        alertname: FrontDoorGatewayNotProgrammed
        exp_alerts: []

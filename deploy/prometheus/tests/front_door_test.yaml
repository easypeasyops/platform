# promtool unit tests for the front door's alerts: synthetic series in, expected alerts
# out. Run by tests/test_alerting.py with the other files here.
rule_files:
  - ../../argocd/platform/files/front-door-rules.yaml

evaluation_interval: 1m

tests:
  # Staging's pods are gone and nobody asks for the route: its status says so all the same.
  # Prod's route, with a backend, stays quiet. The series as kube-state-metrics gives them
  # (deploy/kind/monitoring-values.yaml), with its own pod's namespace.
  - name: a route with no ready pod for ten minutes opens a ticket that names it
    interval: 1m
    input_series:
      - series: 'gateway_httproute_status_condition{job="kube-state-metrics",namespace="monitoring",route_namespace="aipostit-staging",route="aipostit",type="Accepted",reason="Accepted"}'
        values: '1x25'
      - series: 'gateway_httproute_status_condition{job="kube-state-metrics",namespace="monitoring",route_namespace="aipostit-staging",route="aipostit",type="ResolvedRefs",reason="ResolvedRefs"}'
        values: '1x25'
      - series: 'gateway_httproute_status_condition{job="kube-state-metrics",namespace="monitoring",route_namespace="aipostit-staging",route="aipostit",type="BackendsAvailable",reason="EndpointsNotFound"}'
        values: '_x5 0x20'
      - series: 'gateway_httproute_status_condition{job="kube-state-metrics",namespace="monitoring",route_namespace="aipostit-prod",route="aipostit",type="ResolvedRefs",reason="ResolvedRefs"}'
        values: '1x25'
    alert_rule_test:
      - eval_time: 8m # no backend for three minutes: still pending
        alertname: FrontDoorRouteWithoutBackend
        exp_alerts: []
      - eval_time: 15m
        alertname: FrontDoorRouteWithoutBackend
        exp_alerts:
          - exp_labels: {route_namespace: aipostit-staging, route: aipostit, type: BackendsAvailable, reason: EndpointsNotFound, severity: ticket}
            exp_annotations:
              summary: "Route aipostit-staging/aipostit has no backend to send to (EndpointsNotFound): the front door answers 5xx itself"
              description: Requests to a route whose Service has no ready pod, or doesn't exist, get a 503 or 500 from the proxy. They never reach the app, so its own metrics and alerts don't show them.
              runbook_url: https://github.com/easypeasyops/platform/blob/main/docs/RUNBOOK.md#a-route-with-no-backend
              dashboard_url: /d/front-door

  - name: a route to a Service that doesn't exist opens one too
    interval: 1m
    input_series:
      - series: 'gateway_httproute_status_condition{job="kube-state-metrics",namespace="monitoring",route_namespace="monitoring",route="grafana",type="ResolvedRefs",reason="BackendNotFound"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: FrontDoorRouteWithoutBackend
        exp_alerts:
          - exp_labels: {route_namespace: monitoring, route: grafana, type: ResolvedRefs, reason: BackendNotFound, severity: ticket}
            exp_annotations:
              summary: "Route monitoring/grafana has no backend to send to (BackendNotFound): the front door answers 5xx itself"
              description: Requests to a route whose Service has no ready pod, or doesn't exist, get a 503 or 500 from the proxy. They never reach the app, so its own metrics and alerts don't show them.
              runbook_url: https://github.com/easypeasyops/platform/blob/main/docs/RUNBOOK.md#a-route-with-no-backend
              dashboard_url: /d/front-door

  # What must not open one: a route no listener accepts (a 404, another row of the
  # runbook's table), and a few minutes without a ready pod while a single one restarts.
  - name: a route not accepted and a restart's gap stay quiet
    interval: 1m
    input_series:
      - series: 'gateway_httproute_status_condition{job="kube-state-metrics",namespace="monitoring",route_namespace="links-staging",route="links",type="Accepted",reason="NotAllowedByListeners"}'
        values: '0x30'
      - series: 'gateway_httproute_status_condition{job="kube-state-metrics",namespace="monitoring",route_namespace="links-staging",route="links",type="ResolvedRefs",reason="ResolvedRefs"}'
        values: '1x30'
      - series: 'gateway_httproute_status_condition{job="kube-state-metrics",namespace="monitoring",route_namespace="aipostit-prod",route="aipostit",type="BackendsAvailable",reason="EndpointsNotFound"}'
        values: '_x5 0x3 stale'
    alert_rule_test:
      - eval_time: 10m
        alertname: FrontDoorRouteWithoutBackend
        exp_alerts: []
      - eval_time: 25m
        alertname: FrontDoorRouteWithoutBackend
        exp_alerts: []

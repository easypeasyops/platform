# promtool unit tests for the alerts on cert-manager: synthetic series in, expected alerts
# out, with the labels the scrape gives them (namespace: the controller's;
# exported_namespace: the Certificate's). Run by tests/test_alerting.py with the others.
rule_files:
  - ../../argocd/platform/files/cert-manager-rules.yaml

evaluation_interval: 1m

tests:
  # An Issuer that never became ready: the Certificate stays not Ready and has no expiry
  # (reported as 0). One issued a few minutes late stays quiet, and so does a healthy one.
  - name: a Certificate that is never issued warns as not Ready only, a slow start doesn't
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_ready_status{namespace="cert-manager",exported_namespace="cnpg-system",name="barman-cloud-client",condition="False"}'
        values: '1x30'
      - series: 'certmanager_certificate_ready_status{namespace="cert-manager",exported_namespace="cnpg-system",name="barman-cloud-client",condition="True"}'
        values: '0x30'
      - series: 'certmanager_certificate_expiration_timestamp_seconds{namespace="cert-manager",exported_namespace="cnpg-system",name="barman-cloud-client"}'
        values: '0x30'
      - series: 'certmanager_certificate_ready_status{namespace="cert-manager",exported_namespace="cnpg-system",name="barman-cloud-server",condition="Unknown"}'
        values: '1 1 1 1 1 0x25'
      - series: 'certmanager_certificate_ready_status{namespace="cert-manager",exported_namespace="cnpg-system",name="barman-cloud-server",condition="True"}'
        values: '0 0 0 0 0 1x25'
      - series: 'certmanager_certificate_expiration_timestamp_seconds{namespace="cert-manager",exported_namespace="cnpg-system",name="barman-cloud-server"}'
        values: '0 0 0 0 0 7776000x25' # 90 days after the test's start
      - series: 'up{job="cert-manager",namespace="cert-manager"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: CertificateNotReady
        exp_alerts: []
      - eval_time: 20m
        alertname: CertificateNotReady
        exp_alerts:
          - exp_labels: {namespace: cert-manager, exported_namespace: cnpg-system, name: barman-cloud-client, severity: warning}
            exp_annotations:
              summary: Certificate cnpg-system/barman-cloud-client hasn't been Ready for 15 minutes
              description: "Certificate cnpg-system/barman-cloud-client hasn't been Ready for 15 minutes: it was never issued, or it has expired. What mounts its Secret can't start or can't connect."
              runbook_url: https://github.com/easypeasyops/platform/blob/main/docs/RUNBOOK.md#cert-manager-alerts
      - eval_time: 30m
        alertname: CertificateExpiresSoon
        exp_alerts: []
      - eval_time: 30m
        alertname: CertManagerDown
        exp_alerts: []

  # The two certificates as they are on the cluster: 90 days, renewed 15 days before the
  # end. One reaches its renewal time during the test and is renewed (15 days left is the
  # least a healthy one ever has); the other's renewal has failed for 8 days, and it stays
  # Ready all the while.
  - name: a Certificate whose renewal fails warns 7 days before it expires, a renewed one never does
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_expiration_timestamp_seconds{namespace="cert-manager",exported_namespace="cnpg-system",name="barman-cloud-client"}'
        values: '606600x120' # 7 days and 30 minutes after the test's start, never renewed
      - series: 'certmanager_certificate_ready_status{namespace="cert-manager",exported_namespace="cnpg-system",name="barman-cloud-client",condition="True"}'
        values: '1x120'
      - series: 'certmanager_certificate_ready_status{namespace="cert-manager",exported_namespace="cnpg-system",name="barman-cloud-client",condition="False"}'
        values: '0x120'
      - series: 'certmanager_certificate_expiration_timestamp_seconds{namespace="cert-manager",exported_namespace="cnpg-system",name="barman-cloud-server"}'
        values: '1296000x60 7779600x59' # 15 days left, then renewed for 90 at 1h
    alert_rule_test:
      # 7 days and 5 minutes left.
      - eval_time: 25m
        alertname: CertificateExpiresSoon
        exp_alerts: []
      # Under 7 days for 30 minutes: not yet an hour.
      - eval_time: 1h
        alertname: CertificateExpiresSoon
        exp_alerts: []
      - eval_time: 1h35m
        alertname: CertificateExpiresSoon
        exp_alerts:
          - exp_labels: {namespace: cert-manager, exported_namespace: cnpg-system, name: barman-cloud-client, severity: warning}
            exp_annotations:
              summary: Certificate cnpg-system/barman-cloud-client expires in less than 7 days
              description: "Certificate cnpg-system/barman-cloud-client expires in less than 7 days and hasn't been renewed. cert-manager renews long before that, so renewal is failing; when the certificate expires, what uses it stops connecting."
              runbook_url: https://github.com/easypeasyops/platform/blob/main/docs/RUNBOOK.md#cert-manager-alerts
      - eval_time: 1h35m
        alertname: CertificateNotReady
        exp_alerts: []

  # The cainjector and the webhook have Services of their own: they don't stand in for the
  # controller.
  - name: no cert-manager controller scraped for 10 minutes warns
    interval: 1m
    input_series:
      - series: 'up{job="cert-manager",namespace="cert-manager"}'
        values: '1 1 0x15'
      - series: 'up{job="cert-manager-webhook",namespace="cert-manager"}'
        values: '1x17'
    alert_rule_test:
      - eval_time: 8m
        alertname: CertManagerDown
        exp_alerts: []
      - eval_time: 14m
        alertname: CertManagerDown
        exp_alerts:
          - exp_labels: {namespace: cert-manager, severity: warning}
            exp_annotations:
              summary: The cert-manager controller isn't running (or isn't scraped)
              description: The cert-manager controller hasn't been scraped for 10 minutes. No certificate is issued or renewed while it is down; issued certificates keep working until they expire.
              runbook_url: https://github.com/easypeasyops/platform/blob/main/docs/RUNBOOK.md#cert-manager-alerts

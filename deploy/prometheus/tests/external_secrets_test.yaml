# promtool unit tests for the alerts on External Secrets: synthetic series in, expected
# alerts out, with the labels the scrape gives them (namespace: the controller's;
# exported_namespace: the ExternalSecret's). Run by tests/test_alerting.py with the others.
rule_files:
  - ../../argocd/platform/files/external-secrets-rules.yaml

evaluation_interval: 1m

tests:
  # A key missing from the store: Ready is False until someone fixes it. One that failed
  # for a few minutes while its store came up stays quiet, and so does a healthy one.
  - name: an ExternalSecret that stopped syncing warns, a slow start doesn't
    interval: 1m
    input_series:
      - series: 'externalsecret_status_condition{namespace="external-secrets",exported_namespace="aipostit-prod",name="aipostit-env",condition="Ready",status="False"}'
        values: '0 0 1x28'
      - series: 'externalsecret_status_condition{namespace="external-secrets",exported_namespace="aipostit-prod",name="aipostit-env",condition="Ready",status="True"}'
        values: '1 1 0x28'
      - series: 'externalsecret_status_condition{namespace="external-secrets",exported_namespace="backups",name="seaweedfs-s3",condition="Ready",status="False"}'
        values: '1 1 1 1 1 0x25'
      - series: 'externalsecret_status_condition{namespace="external-secrets",exported_namespace="backups",name="seaweedfs-s3",condition="Ready",status="True"}'
        values: '0 0 0 0 0 1x25'
      - series: 'externalsecret_status_condition{namespace="external-secrets",exported_namespace="monitoring",name="grafana-admin",condition="Ready",status="False"}'
        values: '0x30'
      - series: 'up{job="external-secrets-metrics",namespace="external-secrets"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: ExternalSecretNotSyncing
        exp_alerts: []
      - eval_time: 20m
        alertname: ExternalSecretNotSyncing
        exp_alerts:
          - exp_labels: {namespace: external-secrets, exported_namespace: aipostit-prod, name: aipostit-env, severity: warning}
            exp_annotations:
              summary: ExternalSecret aipostit-prod/aipostit-env hasn't synced for 15 minutes
              description: "ExternalSecret aipostit-prod/aipostit-env hasn't synced for 15 minutes. Its Secret keeps the last value it got, or doesn't exist yet: what reads it runs on a stale secret or can't start."
              runbook_url: https://github.com/easypeasyops/platform/blob/main/docs/RUNBOOK.md#external-secrets-alerts
      - eval_time: 20m
        alertname: ExternalSecretsDown
        exp_alerts: []

  # The webhook and the cert controller are scraped too (other jobs): they don't stand in
  # for the controller.
  - name: no External Secrets controller scraped for 10 minutes warns
    interval: 1m
    input_series:
      - series: 'up{job="external-secrets-metrics",namespace="external-secrets"}'
        values: '1 1 0x15'
      - series: 'up{job="external-secrets-webhook",namespace="external-secrets"}'
        values: '1x17'
    alert_rule_test:
      - eval_time: 8m
        alertname: ExternalSecretsDown
        exp_alerts: []
      - eval_time: 14m
        alertname: ExternalSecretsDown
        exp_alerts:
          - exp_labels: {namespace: external-secrets, severity: warning}
            exp_annotations:
              summary: The External Secrets controller isn't running (or isn't scraped)
              description: The External Secrets controller hasn't been scraped for 10 minutes. No Secret is refreshed or created while it is down; existing Secrets keep their values.
              runbook_url: https://github.com/easypeasyops/platform/blob/main/docs/RUNBOOK.md#external-secrets-alerts

# Slack's bot token, the one secret Alertmanager posts to every channel with (PT-103).
# Mounted into Alertmanager at /etc/alertmanager/secrets/alertmanager-slack/bot-token
# (`alertmanagerSpec.secrets`, deploy/kind/monitoring-values.yaml), where the Slack receivers
# read it (`app_token_file`); the channels are named there, in git.
# Not generated: the token comes from a Slack app, saved once in macOS Keychain by
# scripts/load-slack.sh, and copied into the store by every scripts/cluster.sh up
# (docs/RUNBOOK.md, Slack alerts). Without it this ExternalSecret can never sync and the
# monitoring Application would wait on it for good, so this file is synced only where the
# store has the token: `components.slack` (deploy/argocd/platform/values.yaml), which
# scripts/cluster.sh sets from the store.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-slack
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-1" # before Alertmanager, as grafana-admin above
spec:
  secretStoreRef: { kind: ClusterSecretStore, name: platform }
  refreshInterval: 1h # a token replaced in the store reaches Alertmanager within the hour
  target:
    name: alertmanager-slack
    template:
      metadata: { annotations: {} }
      data:
        bot-token: "{{ .botToken }}"
  data:
    - secretKey: botToken
      remoteRef: { key: alertmanager-slack, property: bot-token }

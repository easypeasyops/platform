# The backup bucket's S3 identity, for the apps' databases (platform plan 4.2): each app's
# CloudNativePG Cluster archives to the bucket with these keys, copied into its namespace by
# an ExternalSecret the service chart renders.
#
# A store of its own, not the `platform` one: its reader may get this one Secret and nothing
# else in the store (Grafana's admin password stays out of the app namespaces), and its
# conditions name the app namespaces only. Every app shares the one identity for now, so an
# app could read another's backups; an identity per app is the next step when a second app
# arrives.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bucket-reader
  namespace: secret-store
automountServiceAccountToken: false # no pod runs as it: External Secrets requests a token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bucket-reader
  namespace: secret-store
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [seaweedfs-s3]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bucket-reader
  namespace: secret-store
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: bucket-reader }
subjects:
  - { kind: ServiceAccount, name: bucket-reader, namespace: secret-store }
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: backup-bucket
spec:
  provider:
    kubernetes:
      remoteNamespace: secret-store
      server:
        url: https://kubernetes.default.svc
        caProvider: { type: ConfigMap, name: kube-root-ca.crt, key: ca.crt, namespace: secret-store }
      auth:
        serviceAccount: { name: bucket-reader, namespace: secret-store }
  conditions:
    # The app's namespaces: <app>-<env> (platform plan, Phase 2).
    - namespaces: [shortly-staging, shortly-prod]

# The platform's secrets, made in the store (platform plan 4.1b). A Password generator
# makes each value, and an ExternalSecret writes it into the store, once:
#   - `refreshPolicy: CreatedOnce`: the ExternalSecret writes on its first sync and never
#     refreshes after, so a resync doesn't rotate a password everything uses. What it does
#     NOT do: its first sync writes even if the Secret already exists (External Secrets
#     2.14, shouldRefresh), so a store can't be seeded with older values this way.
#   - `immutable: true`: once written, the value is replaced only by deleting it (the
#     ExternalSecret then makes a new one: RUNBOOK, rotate a platform secret). If the
#     ExternalSecret is ever recreated, its first sync fails loudly (SecretImmutable)
#     instead of silently rotating every consumer's password.
#   - `creationPolicy: Orphan`: removing the ExternalSecret leaves the value.
# Templates set the Secret's metadata, so Argo CD's labels and annotations on the
# ExternalSecret are not copied onto the Secret it makes.
#
# Consumers read these through the `platform` ClusterSecretStore (store.yaml) and derive
# what else they need in their own ExternalSecret's template.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: grafana-admin
  namespace: secret-store
spec:
  secretKeys: [admin-password]
  length: 24
  digits: 6
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: secret-store
spec:
  refreshPolicy: CreatedOnce
  target:
    name: grafana-admin
    creationPolicy: Orphan
    immutable: true
    template:
      metadata: { labels: { app.kubernetes.io/part-of: platform }, annotations: {} }
  dataFrom:
    - sourceRef:
        generatorRef: { apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: grafana-admin }
---
# The backup bucket's one S3 identity (SeaweedFS, deploy/kind/backups.yaml).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: seaweedfs-s3
  namespace: secret-store
spec:
  secretKeys: [access-key, secret-key]
  length: 40
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seaweedfs-s3
  namespace: secret-store
spec:
  refreshPolicy: CreatedOnce
  target:
    name: seaweedfs-s3
    creationPolicy: Orphan
    immutable: true
    template:
      metadata: { labels: { app.kubernetes.io/part-of: platform }, annotations: {} }
  dataFrom:
    - sourceRef:
        generatorRef: { apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: seaweedfs-s3 }

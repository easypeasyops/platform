# The platform's secrets, made in the store (platform plan 4.1b). A Password generator
# makes each value, and an ExternalSecret writes it into the store, once:
# `refreshPolicy: CreatedOnce` creates a Secret only if the store lacks it and never
# updates it, so a value isn't rotated by a resync, and a store seeded from an older
# cluster keeps the values in use (scripts/cluster.sh, seed_secret_store).
# `creationPolicy: Orphan`: removing the ExternalSecret leaves the value in the store.
# Templates set the Secret's metadata, so Argo CD's labels and annotations on the
# ExternalSecret are not copied onto the Secret it makes.
#
# Consumers read these through the `platform` ClusterSecretStore (store.yaml) and derive
# what else they need in their own ExternalSecret's template.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: grafana-admin
  namespace: secret-store
spec:
  secretKeys: [admin-password]
  length: 24
  digits: 6
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: secret-store
spec:
  refreshPolicy: CreatedOnce
  target:
    name: grafana-admin
    creationPolicy: Orphan
    template:
      metadata: { labels: { app.kubernetes.io/part-of: platform }, annotations: {} }
  dataFrom:
    - sourceRef:
        generatorRef: { apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: grafana-admin }
---
# The backup bucket's one S3 identity (SeaweedFS, deploy/kind/backups.yaml).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: seaweedfs-s3
  namespace: secret-store
spec:
  secretKeys: [access-key, secret-key]
  length: 40
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seaweedfs-s3
  namespace: secret-store
spec:
  refreshPolicy: CreatedOnce
  target:
    name: seaweedfs-s3
    creationPolicy: Orphan
    template:
      metadata: { labels: { app.kubernetes.io/part-of: platform }, annotations: {} }
  dataFrom:
    - sourceRef:
        generatorRef: { apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: seaweedfs-s3 }

# Each app's own store for its keys (platform plan 5.6/5.7): the API keys an app can't
# generate, loaded into the platform's store by hand (scripts/load-app-env.sh), never into
# git. The service chart's `secretEnv` copies them into the app's namespaces as <release>-env.
#
# One store per app, not one for all: External Secrets' conditions say which namespaces may
# use a store, not which Secret each may read, so a shared store would let any app read every
# app's keys. Here an app's reader may get its one Secret, <app> in the store, and only its
# own namespaces (the app label the apps ApplicationSet gives them) may use its store.
#
# Adding an app: copy one block, name it after the app, and load its keys.

# ------------------------------------------------------------------------------- aipostit
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aipostit-reader
  namespace: secret-store
automountServiceAccountToken: false # no pod runs as it: External Secrets requests a token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aipostit-reader
  namespace: secret-store
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [aipostit]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aipostit-reader
  namespace: secret-store
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: aipostit-reader }
subjects:
  - { kind: ServiceAccount, name: aipostit-reader, namespace: secret-store }
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aipostit
spec:
  provider:
    kubernetes:
      remoteNamespace: secret-store
      server:
        url: https://kubernetes.default.svc
        caProvider: { type: ConfigMap, name: kube-root-ca.crt, key: ca.crt, namespace: secret-store }
      auth:
        serviceAccount: { name: aipostit-reader, namespace: secret-store }
  conditions:
    - namespaceSelector:
        matchLabels: { easypeasyops.github.io/app: aipostit }


# The platform's secret store (platform plan 4.1): the namespace `secret-store` holds the
# source of every platform secret, and External Secrets copies them to where they are used.
# A real cluster points the ClusterSecretStore below at a secret manager (AWS Secrets
# Manager, Vault...) instead; the ExternalSecrets that read it don't change.
#
# Only External Secrets reads it: through the ServiceAccount below, which may read Secrets
# in this namespace and nowhere else, and only on behalf of the namespaces the store's
# conditions name. Nothing else runs here.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: store-reader
  namespace: secret-store
automountServiceAccountToken: false # no pod runs as it: External Secrets requests a token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: store-reader
  namespace: secret-store
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: store-reader
  namespace: secret-store
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: store-reader }
subjects:
  - { kind: ServiceAccount, name: store-reader, namespace: secret-store }
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: platform
spec:
  provider:
    kubernetes:
      remoteNamespace: secret-store
      server:
        url: https://kubernetes.default.svc
        caProvider: { type: ConfigMap, name: kube-root-ca.crt, key: ca.crt, namespace: secret-store }
      auth:
        serviceAccount: { name: store-reader, namespace: secret-store }
  # Which namespaces may read from it: the platform's own consumers. The apps' namespaces
  # read the bucket's keys through their own store (bucket-store.yaml), never this one.
  conditions:
    - namespaces: [monitoring, backups]

# The secret store's files, for a cluster whose stores read a cloud's secret manager: the
# platform chart's secret-store Application patches each ClusterSecretStore's provider
# from create's outputs (cluster.secret_store). kind's Application includes the same four
# files as a plain directory and ignores this file (tests/test_platform.py keeps them equal).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - store.yaml
  - bucket-store.yaml
  - app-stores.yaml
  - generated.yaml

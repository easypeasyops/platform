# The backup bucket's S3 identity, from the store. SeaweedFS reads it as s3.json; the keys
# themselves are what each app namespace's backup Job uses (copied there by
# scripts/cluster.sh until the app's database moves to CloudNativePG, platform plan 4.3).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seaweedfs-s3
  namespace: backups
  annotations:
    # Before the workload that reads the Secret, in the same Application: Argo CD applies
    # it, waits until it is synced (its health), then starts the workload. In one wave the
    # sync could wait for the workload's health, which waits for this Secret (seen in CI on
    # a fresh cluster, links #108). A failed apply (External Secrets still starting) is
    # retried before the workload is touched.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretStoreRef: { kind: ClusterSecretStore, name: platform }
  refreshInterval: 1h
  target:
    name: seaweedfs-s3
    template:
      metadata: { annotations: {} }
      data:
        access-key: "{{ .accessKey }}"
        secret-key: "{{ .secretKey }}"
        s3.json: >-
          {"identities":[{"name":"backup","credentials":[{"accessKey":"{{ .accessKey }}","secretKey":"{{ .secretKey }}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
  data:
    - secretKey: accessKey
      remoteRef: { key: seaweedfs-s3, property: access-key }
    - secretKey: secretKey
      remoteRef: { key: seaweedfs-s3, property: secret-key }

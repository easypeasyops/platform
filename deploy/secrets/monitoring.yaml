# Grafana's admin login (kube-prometheus-stack's `grafana.admin.existingSecret`), from the
# store. Synced with the monitoring Application, beside the chart that reads it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
  annotations:
    # Before the workload that reads the Secret, in the same Application: Argo CD applies
    # it, waits until it is synced (its health), then starts the workload. In one wave the
    # sync could wait for the workload's health, which waits for this Secret (seen in CI on
    # a fresh cluster, links #108). A failed apply (External Secrets still starting) is
    # retried before the workload is touched.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretStoreRef: { kind: ClusterSecretStore, name: platform }
  refreshInterval: 1h
  target:
    name: grafana-admin
    template:
      metadata: { annotations: {} }
      data:
        admin-user: admin
        admin-password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef: { key: grafana-admin, property: admin-password }
---
# The Slack incoming webhooks Alertmanager posts to, one per channel, keyed
# <app>-<env>-webhook-url (the platform's own: platform-webhook-url). Mounted into Alertmanager at
# /etc/alertmanager/secrets/alertmanager-slack/ (`alertmanagerSpec.secrets`,
# deploy/kind/monitoring-values.yaml), where the Slack receivers read them (`api_url_file`).
# Not generated: a webhook is made in Slack and loaded into the store by hand
# (docs/RUNBOOK.md, Slack alerts). Load it BEFORE this syncs: without it this ExternalSecret
# fails, the monitoring Application waits on it, and Alertmanager can't mount its Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-slack
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-1" # before Alertmanager, as grafana-admin above
spec:
  secretStoreRef: { kind: ClusterSecretStore, name: platform }
  refreshInterval: 1h # a webhook replaced in the store reaches Alertmanager within the hour
  target:
    name: alertmanager-slack
    template:
      metadata: { annotations: {} }
      data:
        aipostit-prod-webhook-url: "{{ .aipostitProd }}"
        aipostit-staging-webhook-url: "{{ .aipostitStaging }}"
        platform-webhook-url: "{{ .platform }}"
  data:
    - secretKey: aipostitProd
      remoteRef: { key: alertmanager-slack, property: aipostit-prod-webhook-url }
    - secretKey: aipostitStaging
      remoteRef: { key: alertmanager-slack, property: aipostit-staging-webhook-url }
    - secretKey: platform
      remoteRef: { key: alertmanager-slack, property: platform-webhook-url }

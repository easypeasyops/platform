# Service level objectives for servicemonitor: the source of truth for its SLO rules.
#
# The platform's scripts/gen_slo_rules.py turns this file into
# deploy/service/slo-rules.values.yaml (committed, so reviewers see the real PromQL; CI
# fails if the two drift apart). From tools/servicemonitor, with the generator of this
# checkout:
#
#   uv run --script ../../scripts/gen_slo_rules.py --spec deploy/prometheus/slos.yaml \
#     --values --out deploy/service/slo-rules.values.yaml
#
# Valid events are requests to the app's own routes: probes are left out (most of the
# traffic, and they always succeed), and so is `unmatched` (paths the app doesn't have).
# 4xx counts as good: the app answered. 5xx counts as bad.

window: 30d # the generator's burn-rate factors assume a 30-day window
# Where every SLO alert's runbook_url points.
runbook_url: https://github.com/easypeasyops/platform/blob/main/tools/servicemonitor/README.md#slo-burn-rate-alerts

slos:
  - name: servicemonitor-availability
    description: The app answers without a server error
    objective: 0.995 # budget: 0.5% of requests, about 3.6 hours of full outage in 30 days
    sli:
      type: availability
      selector: 'job="servicemonitor", route!~"/healthz|/readyz|unmatched"'

  - name: servicemonitor-latency
    description: The app answers in under 0.5 s
    objective: 0.99
    sli:
      type: latency
      selector: 'job="servicemonitor", route!~"/healthz|/readyz|unmatched"'
      threshold_seconds: 0.5 # must be a histogram bucket edge (app/main.py)

[project]
name = "servicemonitor"
version = "0.1.0"
description = "Shows whether Prometheus sees every app and platform tool"
requires-python = ">=3.15,<3.16"
dependencies = [
    "fastapi==0.163.1",
    "httpx==0.28.1",
    "prometheus-client==0.26.0",
    "uvicorn==0.54.0",
]

[tool.uv]
package = false # an app, not a library: `app/` runs from the project directory

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "DTZ"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # assert is how pytest checks

[tool.mypy]
python_version = "3.15"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

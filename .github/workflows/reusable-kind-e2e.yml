name: kind e2e (reusable)

# One app in one environment on the platform its repo pins (PT-81): a kind cluster with the
# platform from this repo at the caller's platform.lock commit (scripts/cluster.sh up, Argo
# CD, monitoring and policies on, no backups), the app's image built from its repo, the
# service chart at the caller's pin with the app's values for that environment, then checks
# (scripts/kind-e2e.sh): workloads Ready, the front door routes each hostname, metrics
# targets up, PrometheusRules loaded. With `run: false` the job reports success without
# doing the work: the caller decides which changes need it (a lock or chart pin move).
# Optional, for a caller that isn't the app (the platform's own CI, PT-82): app-repository
# and app-ref name the app's repo and commit, platform-ref the platform commit instead of
# platform.lock's, values-files the values files when the platform has no env file for the
# app. Empty, as apps call it, each keeps the default above.
on:
  workflow_call:
    inputs:
      run:
        description: "false: report success without doing the work"
        type: boolean
        default: true
      app:
        description: "The app (apps/<app>/ in this repo, its Helm release and store)"
        type: string
        required: true
      env:
        description: "The environment whose values it deploys with (apps/<app>/envs/<env>.yaml)"
        type: string
        required: true
      context:
        description: "The app image's Docker build context in the caller's repo"
        type: string
        required: true
      chart:
        description: "The service chart the caller renders with (oci://...@sha256:...)"
        type: string
        required: true
      platform-ref:
        description: "The platform commit to run (a SHA); empty: the app's platform.lock"
        type: string
        default: ""
      app-repository:
        description: "The app's repo (owner/name); empty: the caller's"
        type: string
        default: ""
      app-ref:
        description: "The app repo's commit; empty: the caller's (or app-repository's default branch)"
        type: string
        default: ""
      values-files:
        description: "For an app the platform doesn't deploy: its values files in its repo, in order (scripts/kind-e2e.sh VALUES_FILES); empty: apps/<app>/envs/<env>.yaml's"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  e2e:
    name: kind e2e (${{ inputs.app }} ${{ inputs.env }})
    runs-on: ubuntu-latest
    # The platform takes about 12 minutes to come up on a runner, the app a few more, and a
    # failed start-up gets one more try.
    timeout-minutes: 45
    env:
      IMAGE: ${{ inputs.app }}:e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.run
        with:
          repository: ${{ inputs.app-repository || github.repository }}
          ref: ${{ inputs.app-ref }}
          persist-credentials: false

      - name: Which platform (platform-ref, else platform.lock)
        if: inputs.run
        id: platform
        env:
          PLATFORM_REF: ${{ inputs.platform-ref }}
        run: |
          if [[ -n "$PLATFORM_REF" ]]; then
            [[ "$PLATFORM_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::platform-ref is not a commit SHA: $PLATFORM_REF"; exit 1; }
            echo "sha=$PLATFORM_REF" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          sha=$(sed -nE 's/^easypeasyops\/platform@([0-9a-f]{40})$/\1/p' platform.lock)
          [[ -n "$sha" ]] || { echo "::error::platform.lock names no easypeasyops/platform@<sha>"; exit 1; }
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.run
        with:
          repository: easypeasyops/platform
          ref: ${{ steps.platform.outputs.sha }}
          path: .platform
          persist-credentials: false

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        if: inputs.run
        with:
          version: v4.3.1

      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        if: inputs.run
        with:
          cluster_name: shortly
          config: .platform/deploy/kind/cluster.yaml

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: inputs.run

      - name: Build image
        if: inputs.run
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha # what the caller's image job (reusable-image.yml) cached

      - name: Load image into kind
        if: inputs.run
        run: kind load docker-image "$IMAGE" --name shortly

      # Start-up flaked once in four runs (PT-81), so it gets a second try, once, in a step of
      # its own so the log shows it: cluster.sh up is idempotent. Nothing else is retried.
      - name: Platform through Argo CD
        if: inputs.run
        id: up
        continue-on-error: true
        timeout-minutes: 18 # it takes about 12
        run: .platform/scripts/cluster.sh up
        env:
          PLATFORM_REVISION: ${{ steps.platform.outputs.sha }}
          ARGOCD_APPS: "0" # the app is deployed by the next step, as Argo CD would
          BACKUPS: "0" # no database here; CI's node has little CPU to spare (PT-71)
          SLACK: "0" # no bot token in CI; alerts stay in Alertmanager (PT-97)

      - name: Platform through Argo CD (retry, the first try failed)
        if: inputs.run && steps.up.outcome == 'failure'
        run: |
          echo "::warning::platform start-up failed on its first try; retrying it once"
          kubectl -n argocd get applications || true
          .platform/scripts/cluster.sh up
        env:
          PLATFORM_REVISION: ${{ steps.platform.outputs.sha }}
          ARGOCD_APPS: "0"
          BACKUPS: "0"
          SLACK: "0"

      # Argo CD manages its own install (PT-109): its Application is Synced and Healthy (up
      # waited for it with the other platform children), Helm's release is handed over, and
      # a live edit to its config is put back from git. On the platform repo's own runs
      # only: an app's e2e doesn't pay for checking the platform.
      - name: Argo CD manages itself
        if: inputs.run && github.repository == 'easypeasyops/platform'
        run: |
          state=$(kubectl -n argocd get application argocd -o jsonpath='{.status.sync.status}/{.status.health.status}')
          echo "argocd Application: $state"
          [[ "$state" == Synced/Healthy ]]
          records=$(kubectl -n argocd get secret -l owner=helm,name=argocd -o name)
          [[ -z "$records" ]] || { echo "::error::Helm still has release records for Argo CD: $records"; exit 1; }
          read_cap() { kubectl -n argocd get cm argocd-cmd-params-cm -o jsonpath='{.data.controller\.self\.heal\.backoff\.cap\.seconds}'; }
          want=$(read_cap)
          kubectl -n argocd patch cm argocd-cmd-params-cm --type merge \
            -p '{"data":{"controller.self.heal.backoff.cap.seconds":"31"}}'
          for i in $(seq 1 60); do
            if [[ "$(read_cap)" == "$want" ]]; then
              echo "argocd-cmd-params-cm edited by hand, put back to git's $want by Argo CD in about $((i * 2)) s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Argo CD didn't put its own argocd-cmd-params-cm back to git's value in 120 s"
          exit 1

      # The front door as on a cloud (PT-117): the proxies' Service is a LoadBalancer with an
      # address from cloud-provider-kind (cluster.sh create), the Gateway took that address,
      # and a tool's hostname answers there and through the runner's forwarder (8090). The
      # apps' hostnames go through the other forwarder (8080) in the checks below. On the
      # platform repo's own runs only.
      - name: The front door is a LoadBalancer
        if: inputs.run && github.repository == 'easypeasyops/platform'
        run: |
          kubectl -n envoy-gateway-system get svc front-door
          docker ps --filter label=io.x-k8s.cloud-provider-kind.cluster --format '{{.Names}} {{.Image}} {{.Status}}'
          ip=$(kubectl -n envoy-gateway-system get svc front-door -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          if [[ -z "$ip" ]]; then
            echo "::error::the front door's LoadBalancer Service has no address"
            docker logs --tail 50 shortly-cloud-provider-kind
            exit 1
          fi
          gateway=$(kubectl -n gateway get gateway front-door -o jsonpath='{.status.addresses[0].value}')
          echo "Service front-door: $ip; Gateway front-door: $gateway"
          [[ "$gateway" == "$ip" ]] || { echo "::error::the Gateway's address isn't its load balancer's"; exit 1; }
          for url in "http://$ip:8081/" http://127.0.0.1:8090/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 5 -H 'Host: argocd.localhost' "$url" || true)
            echo "argocd.localhost at $url answered ${code:-nothing}"
            [[ "$code" == 200 ]]
          done

      # What runs beside the kind node, outside its memory: the load balancer and the
      # forwarders (cluster.sh create).
      - name: Containers beside the node
        if: always() && inputs.run
        run: docker stats --no-stream --format '{{.Name}} {{.MemUsage}} {{.CPUPerc}}' || true

      # When a sync never finishes, the job's timeout kills the wait before it can explain.
      - name: Argo CD state (on failure)
        if: (failure() || cancelled()) && inputs.run
        run: |
          kubectl -n argocd get applications -o wide || true
          kubectl -n argocd get applications -o jsonpath='{range .items[*]}{"== "}{.metadata.name}{" "}{.status.sync.status}/{.status.health.status}{"\n"}{range .status.conditions[*]}  {.type}: {.message}{"\n"}{end}{range .status.resources[?(@.health.status!="Healthy")]}  {.health.status}: {.kind}/{.namespace}/{.name} {.health.message}{"\n"}{end}{.status.operationState.phase}: {.status.operationState.message}{"\n"}{end}' || true
          kubectl get pods -A | grep -vE "Running|Completed" || true

      - name: Deploy and check
        if: inputs.run
        run: .platform/scripts/kind-e2e.sh "$APP" "$APP_ENV"
        env:
          APP: ${{ inputs.app }}
          APP_ENV: ${{ inputs.env }}
          CHART: ${{ inputs.chart }}
          APP_REPO: ${{ github.workspace }}
          VALUES_FILES: ${{ inputs.values-files }}

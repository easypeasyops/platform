name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the default GITHUB_TOKEN can write to the repo; CI only needs to read.
permissions:
  contents: read

# A new push to the same PR/branch cancels the now-stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Checks on what the platform repo holds. The kind end-to-end test runs in each app's repo,
# against the platform commit the app pins (links: platform.lock): a platform change reaches
# an app's e2e when the app moves its pin.
env:
  # CRD schemas for kubeconform (Kyverno, Argo CD, Gateway API, Prometheus Operator), pinned
  # by commit.
  CRDS: https://raw.githubusercontent.com/datreeio/CRDs-catalog/501527ab9c40c827144c8f45945b25a023e344ce
  KUBECONFORM: ghcr.io/yannh/kubeconform:v0.8.0

jobs:
  manifests:
    name: manifests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.1

      - name: Schema-validate the policies, Argo CD objects, chart and dev routes
        run: |
          kc() { docker run --rm -i -v "$PWD:/repo:ro" -w /repo "$KUBECONFORM" -strict -summary \
            -kubernetes-version 1.37.0 -schema-location default \
            -schema-location "$CRDS/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" "$@"; }
          # The Kyverno admission policies, and the secret store External Secrets reads.
          kc deploy/policies deploy/secrets
          # The platform's root Application and its AppProject, as one document stream.
          awk 'FNR == 1 { print "---" } 1' deploy/argocd/*.yaml | kc -
          # The child Applications the platform chart renders, for both CPU architectures and
          # with every optional component switched off once.
          helm lint deploy/argocd/platform --set arch=amd64
          for args in "--set arch=amd64" "--set arch=arm64" \
            "--set arch=amd64 --set components.monitoring=false --set components.policies=false --set components.backups=false"; do
            # shellcheck disable=SC2086 # word splitting intended
            helm template platform deploy/argocd/platform $args | kc -
          done
          # The vendored metrics-server manifest with its kind patch (Argo CD runs kustomize).
          kubectl kustomize deploy/platform/metrics-server | kc -
          # The dev tools' routes on the kind Gateway.
          kc deploy/kind/tools
          # The event exporter and the provenance canary, plain manifests Argo CD syncs as they are.
          kc deploy/kind/event-exporter.yaml deploy/kind/provenance-canary.yaml

      # A manifest fetched or edited after it was pinned would be unreviewed code running
      # with cluster-admin (see deploy/platform/metrics-server/kustomization.yaml).
      - name: Vendored metrics-server is the pinned release
        working-directory: deploy/platform/metrics-server
        run: sha256sum --check --strict SHA256SUMS

  # The service chart apps deploy with. Its golden renders (scripts/chart-golden.sh) are its
  # behaviour: every app fixture under charts/service/tests/ must render byte for byte as
  # checked in.
  chart:
    name: service chart
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.1

      - name: Lint
        run: |
          for values in charts/service/tests/*/*-values.yaml; do
            app=$(basename "$(dirname "$values")"); env=$(basename "$values" -values.yaml)
            mapfile -t args < <(scripts/chart-golden.sh --values-args "$app" "$env")
            helm lint charts/service --strict "${args[@]}" --set image.tag=ci
          done

      - name: Renders match the golden files
        run: scripts/chart-golden.sh

      # The generator apps run for their SLO rules (uv run --script; its dependencies are
      # pinned in the script).
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: SLO rule generator
        run: scripts/test-slo-generator.sh

      - name: Schema-validate the golden renders
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo "$KUBECONFORM" -strict -summary \
            -kubernetes-version 1.37.0 -schema-location default \
            -schema-location "$CRDS/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
            charts/service/tests/*/*.golden.yaml

  # apps/: what Argo CD will do with every env file (scripts/check-apps.py): its project
  # allows it, its chart digest is a released, verified service chart of the version it
  # names, and the chart renders with the app's values from the app's repo. Then the
  # renders, the ApplicationSet and the AppProjects are schema-validated.
  apps:
    name: apps
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Every env file deploys what it says
        env:
          GH_TOKEN: ${{ github.token }} # gh attestation verify
          VERIFY: "1"
        run: uv run --quiet --script scripts/check-apps.py --out "$RUNNER_TEMP/renders"

      - name: Schema-validate the renders and the apps objects
        run: |
          docker run --rm -v "$PWD:/repo:ro" -v "$RUNNER_TEMP/renders:/renders:ro" -w /repo \
            "$KUBECONFORM" -strict -summary -kubernetes-version 1.37.0 -schema-location default \
            -schema-location "$CRDS/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
            /renders apps/applicationset.yaml apps/*/project.yaml

  # The chart release (release-chart.yml runs scripts/release-chart.sh on a service/v* tag),
  # rehearsed against a throwaway registry on every PR, so a broken release path shows up
  # here and not at release time: publish (push, digest, pull back by digest), then a second
  # release of the same version must be refused. On this throwaway runner, origin/main is
  # pointed at the PR's commit (as it will be once merged), so check runs every test in order.
  chart-release:
    name: chart release rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      registry:
        image: registry:3.0.0
        ports: ["5000:5000"]
    env:
      PLAIN_HTTP: "1"
      REGISTRY: localhost:5000/charts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.1

      - name: Publish
        run: scripts/release-chart.sh publish

      - name: A second release of the same version is refused
        run: |
          git update-ref refs/remotes/origin/main HEAD # the rehearsal: this commit, merged
          version=$(sed -nE 's/^version: *"?([^"[:space:]]+)"?.*/\1/p' charts/service/Chart.yaml)
          if out=$(scripts/release-chart.sh check "service/v$version" 2>&1); then
            echo "::error::check allowed re-releasing $version"; exit 1
          fi
          echo "$out"
          grep -q "already in" <<<"$out" || { echo "::error::refused for the wrong reason"; exit 1; }

  # tests/ (pytest): what a schema can't check, such as which revision every child
  # Application deploys or which namespaces a policy covers. Run by the same reusable
  # workflow app repos call, from this commit: the platform is its first caller.
  tests:
    uses: ./.github/workflows/reusable-python-check.yml
    with:
      typecheck-paths: tests
      coverage-min: 0 # no package to cover: the tests check manifests and scripts
      helm-version: v4.3.1 # tests render the platform chart

  # The tools that live in this repo (tools/<app>/, docs/DESIGN.md): their checks run only
  # when a pull request changes them or what the checks use. The jobs below still run and
  # report success when it doesn't (`run: false`), so `ci` never waits on a skipped job. A
  # push to main runs everything.
  tools-scope:
    name: tools change scope
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2 # the PR merge commit and its first parent
      - name: Does this change touch the tools or their checks?
        id: scope
        run: |
          run=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            changed=$(git diff --name-only HEAD^1 HEAD)
            grep -qE '^(tools/|\.github/workflows/(ci|reusable-[a-z-]+)\.yml$|scripts/gen_slo_rules\.py$)' \
              <<<"$changed" || run=false
          fi
          echo "run=$run" | tee -a "$GITHUB_OUTPUT"

  # servicemonitor's own checks, with its own pyproject, lock and coverage floor (90).
  servicemonitor-check:
    needs: tools-scope
    uses: ./.github/workflows/reusable-python-check.yml
    with:
      run: ${{ needs.tools-scope.outputs.run == 'true' }}
      working-directory: tools/servicemonitor
      typecheck-paths: app tests

  servicemonitor-image:
    needs: tools-scope
    uses: ./.github/workflows/reusable-image.yml
    with:
      run: ${{ needs.tools-scope.outputs.run == 'true' }}
      context: tools/servicemonitor
      smoke-command: tools/servicemonitor/scripts/smoke.sh # reads $IMAGE

  # Each tool's deploy values (tools/<app>/deploy/), as an app's own CI checks them: the SLO
  # rules are what this commit's generator writes from their spec, and each environment
  # renders with the released service chart, as Argo CD will, and passes the schemas. The
  # chart is the release apps/<app>/envs/ pin: move CHART with them.
  tools-deploy:
    name: tools deploy values
    needs: tools-scope
    if: needs.tools-scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CHART: oci://ghcr.io/easypeasyops/charts/service@sha256:514c85572c0141e16fd1dc9d8a38505034e8dd27a1866c5794645cd6a4955584 # 1.5.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: SLO rules match their spec
        working-directory: tools
        run: |
          for spec in */deploy/prometheus/slos.yaml; do
            (cd "${spec%%/*}" && uv run --script ../../scripts/gen_slo_rules.py --check \
              --spec deploy/prometheus/slos.yaml \
              --values --out deploy/service/slo-rules.values.yaml)
          done

      - name: Render each environment and validate it
        working-directory: tools
        run: |
          # An env file without a release yet renders with a placeholder digest.
          placeholder="sha256:$(printf '0%.0s' {1..64})"
          mkdir -p "$RUNNER_TEMP/rendered"
          for env_file in */deploy/envs/*.yaml; do
            app=${env_file%%/*} env=$(basename "$env_file" .yaml)
            digest=$(yq -r '.image.digest // ""' "$env_file")
            # The cluster-wide environment ships the SLO rules (prod, or a tool's ops).
            slo=()
            if [[ "$env" =~ ^(ops|prod)$ && -f "$app/deploy/service/slo-rules.values.yaml" ]]; then
              slo=(--values "$app/deploy/service/slo-rules.values.yaml")
            fi
            helm template "$app" "$CHART" --namespace "$app-$env" \
              --values "$app/deploy/service/values.yaml" "${slo[@]}" --values "$env_file" \
              --set "image.digest=${digest:-$placeholder}" \
              --kube-version 1.37.0 \
              --api-versions monitoring.coreos.com/v1/ServiceMonitor \
              --api-versions monitoring.coreos.com/v1/PodMonitor \
              --api-versions monitoring.coreos.com/v1/PrometheusRule >"$RUNNER_TEMP/rendered/$app-$env.yaml"
            echo "$app $env: $(grep -c '^kind:' "$RUNNER_TEMP/rendered/$app-$env.yaml") objects"
          done
          docker run --rm -v "$RUNNER_TEMP/rendered:/r:ro" -w /r "$KUBECONFORM" -strict -summary \
            -kubernetes-version 1.37.0 -schema-location default \
            -schema-location "$CRDS/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
            .

  scripts:
    name: scripts and workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Entry points only, following `source` (-x): scripts/lib/ defines variables for its
      # callers, so checked on its own every one of them looks unused (SC2034).
      - name: shellcheck
        run: |
          shellcheck --version | sed -n 2p
          shellcheck -x scripts/*.sh tools/*/scripts/*.sh

      # The reusable workflows are this repo's API for app repos; actionlint also runs
      # shellcheck on every `run:` block when shellcheck is on PATH (it is on the runner).
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.12 -color

  # The one required status check (ruleset main-rules requires `ci` only). It passes when
  # every job above passed, so jobs can be split, renamed or added without a ruleset change.
  # Add a new job to `needs` or it isn't gating anything. One job may be skipped:
  # tools-deploy, when tools-scope (which must itself pass) says the change doesn't touch
  # the tools.
  gate:
    name: ci
    if: always()
    needs:
      - manifests
      - chart
      - chart-release
      - apps
      - tests
      - tools-scope
      - servicemonitor-check
      - servicemonitor-image
      - tools-deploy
      - scripts
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'all(to_entries[]; .value.result == "success"
            or (.key == "tools-deploy" and .value.result == "skipped"))' <<<"$NEEDS" >/dev/null

# Pinned versions only stay safe if something bumps them. Dependabot opens PRs; CI decides
# whether they're safe to merge.
#
# The reusable workflows are what app repos call (pinned by this repo's commit SHA), so a
# bump here reaches an app only when that app moves its pin.
#
# Not covered by Dependabot: the tool images ci.yml runs with `docker run` (kubeconform,
# actionlint) and the upstream charts the platform chart pins by digest in
# deploy/argocd/platform/values.yaml. Renovate bumps those (renovate.json5).
version: 2
updates:
  - package-ecosystem: github-actions # bumps the pinned SHAs (and their # vX comments)
    directory: /
    schedule:
      interval: weekly
    groups:
      # Minor and patch updates together, one PR a week; a major update arrives in a PR of
      # its own, because its inputs or behaviour can change.
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  # The tools that live here (tools/<app>/): their Python dependencies and base images. CI
  # (the image scan and smoke test included) decides whether a bump is safe to merge.
  - package-ecosystem: uv
    directories: [/tools/*]
    schedule:
      interval: weekly
    groups:
      # Minor and patch updates together, one PR a week; a major update arrives in a PR of
      # its own, because it can break the code.
      python-deps:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker # the base image digests in the Dockerfiles
    directories: [/tools/*]
    schedule:
      interval: weekly

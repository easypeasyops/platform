# The platform's chart for an HTTP service. Defaults are production-shaped; an app supplies
# its values (app, image, env...) and each environment's file overrides them.

# The app this chart deploys. `name` is its app.kubernetes.io/name label (and so its pods'
# selector); `partOf` is app.kubernetes.io/part-of on every pod of the chart, which the
# database's network policy admits (the platform's deploy/kind/network-policies.yaml).
app:
  name: ""   # required
  partOf: "" # default: the app's name

# The environment's name (staging, prod), set by the app's file for that environment.
# Empty: the namespace's name.
environment: ""

image:
  repository: "" # required
  # Deploy by digest (sha256:...) whenever possible: a digest is immutable, so the bits
  # tested in staging are exactly the bits promoted to production. `tag` is a fallback.
  digest: ""
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Used only when autoscaling is disabled.
replicaCount: 2

# Size from a load test: the CPU request is the HPA's 100%, so a 70% target leaves ~30%
# headroom for traffic that grows while new pods start.
autoscaling:
  enabled: true
  minReplicas: 2 # survive one pod loss / a drain; the PDB keeps 1 up
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  # Rendering fails if maxReplicas x config.dbPoolSize exceeds this. Postgres default
  # max_connections is 100; keep room for migrations, admin sessions and the other env.
  maxDbConnections: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0 # react to a spike at once
      policies:
        - { type: Percent, value: 100, periodSeconds: 15 } # at most double every 15 s
        - { type: Pods, value: 4, periodSeconds: 15 }
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300 # scale in only after 5 quiet minutes: no flapping
      policies:
        - { type: Pods, value: 1, periodSeconds: 60 }

# Settings the chart itself reads. An app's own settings go in `config` too (env entries can
# template them from here) or straight into `env`.
config:
  # /metrics is served on this port, not the app port: the Service exposes it to Prometheus
  # only, and the network policy admits nothing else to it.
  metricsPort: 9100
  # Database connections per pod; with autoscaling, maxReplicas x dbPoolSize must stay
  # within autoscaling.maxDbConnections. 0: the app holds no pool.
  dbPoolSize: 0

# The database URL is a secret and is NEVER put in values files (they live in git).
# Create it out of band (kubectl, External Secrets, Sealed Secrets, Vault...) and point here.
database:
  existingSecret: ""
  secretKey: url
  # A Postgres for the app, run by the platform's CloudNativePG operator (platform plan 4.2;
  # templates/database.yaml): a Cluster named <release>-db in the app's namespace, archiving
  # WAL and base backups to the platform's bucket. Its app user's credentials are in the
  # Secret <release>-db-app, whose key `uri` is a connection URL: the app uses it once
  # existingSecret / secretKey above point there. Off: the app brings its own database.
  cluster:
    enabled: false
    instances: 1 # a primary; 2 or more adds streaming replicas the operator fails over to
    # Postgres 17, the line the admission policy admits (deploy/policies/allowed-images.yaml).
    imageName: ghcr.io/cloudnative-pg/postgresql:17.11-minimal-trixie@sha256:87f97b9a922e469b91faaaa36ced7c2092cf890efd3622f29095d252b70b9718
    storage: 1Gi
    resources:
      requests: { cpu: 50m, memory: 256Mi }
      limits: { memory: 512Mi }
    # How the database starts. Empty: a new one (initdb), the database and its owner named
    # after the app. Anything else is the Cluster's `bootstrap` as it is (an import from
    # another database, a recovery from a backup), with `externalClusters` the sources it
    # names.
    bootstrap: {}
    externalClusters: []
    backup:
      enabled: true
      # Six fields, seconds first (the operator's cron format): hourly, off the hour. A base
      # backup; WAL is archived continuously in between, so a restore can reach any moment.
      schedule: "0 23 * * * *"
      retention: 7d # base backups and WAL older than this are deleted
      # The bucket: SeaweedFS in the `backups` namespace on the platform's clusters. One
      # folder per namespace; the operator adds the Cluster's name below it.
      endpointURL: http://seaweedfs.backups.svc:8333
      destinationPath: "" # default: s3://cnpg-backups/<namespace>
      # Its keys, copied into the namespace by an ExternalSecret from this ClusterSecretStore
      # (the platform's deploy/secrets/bucket-store.yaml).
      secretStore: backup-bucket
      remoteSecret: seaweedfs-s3

# OpenTelemetry: tracing is on only if an endpoint is set.
otel:
  endpoint: ""

# The app's environment variables. The chart renders this list as it is, in order: which
# variables the app reads is the app's business, not the chart's. Each string is a template,
# so it can read other values (config.* above, which env files override). An entry with
# `when` is rendered only if `when` renders to something other than "", "0" or "false".
env: []

migrations:
  enabled: false
  # The Job runs as a Helm pre-install/pre-upgrade hook: the schema is migrated BEFORE
  # new pods start, and a failed migration aborts the release (old pods keep serving).
  # With database.cluster, after the database instead (templates/migrate-job.yaml).
  backoffLimit: 1
  activeDeadlineSeconds: 300
  # The app's migration command, run from its image (required when enabled).
  command: []
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }

service:
  type: ClusterIP
  port: 80

# Route users in through a Gateway API Gateway (the platform's deploy/kind/gateway.yaml in
# kind; its Gateway is still named after the first app). Off by
# default: the chart works without one, and a cluster without the Gateway API CRDs.
gateway:
  enabled: false
  name: shortly
  namespace: gateway
  hostnames: []

# Canary releases with Argo Rollouts (links' docs/DESIGN.md, Canary releases). Needs the Argo
# Rollouts controller with its Gateway API plugin (the platform) and gateway.enabled.
# On: a Rollout replaces the Deployment; a new release first gets each `weights` share of
# the Gateway's traffic in turn, and moves on only if analysis passes; else it is aborted
# and all traffic stays on the old version. A first install, or a rollback to one of the
# last `rollbackWindow` revisions, skips the steps.
canary:
  enabled: false
  weights: [10, 50] # % of traffic to the new version per step; 100 follows the last
  # A pod that isn't ready this long after its step starts aborts the release.
  progressDeadlineSeconds: 180
  rollbackWindow: 3
  # Rendered only where Prometheus scrapes the app (monitoring.enabled and the Prometheus
  # Operator CRDs): no metrics, no analysis. Without it each step is a plain `pause`.
  analysis:
    prometheusUrl: http://kps-prometheus.monitoring.svc:9090
    initialDelay: 60s # let Prometheus discover and scrape the new pods twice first
    interval: 30s
    count: 4 # measurements per step, so a step lasts initialDelay + count x interval
    # Judged on the CANARY's pods only (label rollouts_pod_template_hash), over [1m].
    minRequestRate: 0.5 # req/s: below this there's too little traffic to judge: fail
    maxErrorRatio: 0.01 # 5xx share of all non-probe requests; one bad measurement aborts
    # p99 latency checks, one analysis metric each, judged like the error ratio. `selector`
    # narrows http_request_duration_seconds to a route; p99 is coarse on small samples, so
    # a check aborts only after `failureLimit` + 1 bad measurements (default 1, so 2).
    #   - { name: redirect-p99, selector: 'method="GET", route="/{code}"', maxP99Seconds: 0.25 }
    latencyChecks: []
    # Requests to judge the canary on: a k6 Job runs beside each analysis step, sending this
    # many req/s through the Gateway with the first gateway hostname (`script`, below).
    # Part of the analysis, so a canary started by anyone (Argo CD, deploy.sh) gets it.
    # A prod with real users turns it off; then `minRequestRate` guards a quiet hour.
    syntheticTraffic:
      enabled: true
      rate: 20
      image: grafana/k6:2.3.0
      url: http://shortly-gateway.envoy-gateway-system.svc
      # The k6 script (the app's: which routes, in what mix), run with BASE_URL, HOST, RATE
      # and DURATION in its environment. Required when syntheticTraffic is enabled.
      script: ""
  pauseWithoutAnalysis: 60s

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    # No CPU limit on purpose: CPU limits cause throttling even when the node is idle.
    # Memory limit stays: a leak should OOM-kill one pod, not the node.
    memory: 256Mi

# Seconds the pod keeps serving after it's told to stop, so the endpoint removal can
# propagate to every kube-proxy / load balancer before the process stops accepting.
preStopSleepSeconds: 5
# Must exceed preStop + the app's own graceful drain after SIGTERM.
terminationGracePeriodSeconds: 30

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Prometheus Operator integration (kube-prometheus-stack; the platform installs it in
# kind). Off by default because the ServiceMonitor and PrometheusRule kinds need its CRDs.
monitoring:
  enabled: false # a ServiceMonitor: Prometheus scrapes /metrics on every pod
  scrapeInterval: 15s
  # The alert rules and the SLO dashboard are cluster-wide: every rule already aggregates
  # `by (namespace)`, so they cover all environments. Exactly ONE release per cluster may
  # ship them (prod); two copies would evaluate every recording rule twice and collide.
  clusterWide: false
  # The app's alert rules, rendered where clusterWide is: one PrometheusRule per entry, named
  # <release>-<key>; each entry is the text of a Prometheus rule file (`groups: ...`), so
  # the file the app tests with promtool is exactly what ships. SLO rules generated from the
  # app's SLO spec are one more entry.
  rules: {}
  # Grafana dashboards, rendered where clusterWide is: <file name>: <dashboard JSON>, in one
  # ConfigMap that Grafana's sidecar loads.
  dashboards: {}
  # The platform's SLO dashboard (files/slo-dashboard.json): error budgets, burn rates,
  # traffic, latency, pods and firing alerts, for an app with SLO rules (rules.slo). Rendered
  # into the same ConfigMap as slo.json; an app dashboard of that name replaces it.
  sloDashboard:
    enabled: true
    runbookUrl: "" # required: where its Runbook link points (the SLO spec's runbook_url)

nodeSelector: {}
tolerations: []
affinity: {}

# Scheduled jobs (templates/cronjobs.yaml): one CronJob per entry, named <release>-<key>,
# from the release image, with the app's env plus its own. Their pods are labelled
# <app.name>-<key>, so neither the HPA nor the PodDisruptionBudget counts them, and get a
# network policy of their own: DNS and the database only. Set an entry to null to drop it.
cronJobs: {}

# Who may talk to the pods, and whom they may talk to (templates/networkpolicy.yaml). Needs a
# CNI that enforces NetworkPolicy (kind's kindnet does; the e2e proves it); on one that
# doesn't, these objects are silently ignored.
networkPolicy:
  enabled: true
  # Callers of the app port. [] = anyone: the Service is the public entry point. On a real
  # cluster, narrow this to the ingress controller's namespace.
  httpFrom: []
  # Scrapers of the metrics port: Prometheus from kube-prometheus-stack, and nobody else.
  metricsFrom:
    - namespaceSelector:
        matchLabels: { kubernetes.io/metadata.name: monitoring }
      podSelector:
        matchLabels: { app.kubernetes.io/name: prometheus }
  # The only place the app (and its migration Job) may connect to, besides DNS. A managed
  # database outside the cluster would be an ipBlock here.
  databaseTo:
    - podSelector:
        matchLabels: { app: postgres }
  databasePort: 5432
  # More egress rules, e.g. to an OpenTelemetry collector when otel.endpoint is set.
  extraEgress: []

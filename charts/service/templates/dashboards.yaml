{{- if and .Values.monitoring.enabled .Values.monitoring.clusterWide .Values.monitoring.dashboards }}
# Grafana's sidecar loads every ConfigMap labelled grafana_dashboard=1, in any namespace.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "service.fullname" . }}-dashboards
  labels:
    {{- include "service.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  {{- toYaml .Values.monitoring.dashboards | nindent 2 }}
{{- end }}

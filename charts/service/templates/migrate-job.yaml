{{- if .Values.migrations.enabled }}
# Runs the app's migration command (migrations.command) from the SAME image as the
# release, before the new pods start. One Job per release — not an initContainer in every
# replica, which would have N pods racing to migrate the same schema.
#
# Rule this enables: migrations must be backward-compatible with the PREVIOUS app
# version (expand → deploy → contract), because old pods keep serving while new ones roll
# out, and a rollback runs old code against the new schema.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "service.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    {{- if .Values.database.cluster.enabled }}
    # The app's own database (database.cluster) is created by this release, so the
    # migration can't run before everything else: it would wait for a database that
    # doesn't exist yet. Under Argo CD it is a Sync hook after the database (wave -2,
    # which Argo CD holds until the Cluster is healthy) and before the app (wave 0); an
    # Argo CD hook annotation overrides the Helm ones below. Under plain Helm, on a first
    # install it runs after the release's objects (the app's pods start against an empty
    # schema for that once); on an upgrade, still before the new pods.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    "helm.sh/hook": post-install,pre-upgrade
    {{- else }}
    "helm.sh/hook": pre-install,pre-upgrade
    {{- end }}
    "helm.sh/hook-weight": "0"
    # Keep a failed Job around for `kubectl logs`; delete successful ones.
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "service.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
        app.kubernetes.io/part-of: {{ include "service.partOf" . }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        {{- include "service.podSecurityContext" . | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "service.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            {{- if not .Values.migrations.command }}{{ fail "migrations.command: the app's migration command, run from its image" }}{{ end }}
            {{- toYaml .Values.migrations.command | nindent 12 }}
          env:
            {{- include "service.env" . | trim | nindent 12 }}
          securityContext:
            {{- include "service.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
{{- end }}

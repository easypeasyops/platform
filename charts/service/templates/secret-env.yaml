{{- with .Values.secretEnv }}
{{- if .store }}
# The app's secret environment (values.yaml, secretEnv): every key of the store's remoteKey,
# copied into <release>-env. Env entries read single keys from it (`secret:`).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "service.fullname" $ }}-env
  labels:
    {{- include "service.labels" $ | nindent 4 }}
  annotations:
    # Before anything that reads it: a pod whose Secret is missing doesn't start.
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshInterval: {{ .refreshInterval }}
  secretStoreRef: { kind: ClusterSecretStore, name: {{ .store }} }
  target:
    name: {{ include "service.fullname" $ }}-env
    template:
      metadata:
        labels:
          {{- include "service.labels" $ | nindent 10 }}
        annotations: {} # not Argo CD's tracking annotation: the Secret isn't in git
  dataFrom:
    - extract:
        key: {{ .remoteKey | default (include "service.name" $) }}
{{- end }}
{{- end }}

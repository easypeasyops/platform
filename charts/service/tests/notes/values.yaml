# An app with its own Postgres (database.cluster, platform plan 4.2), otherwise the chart's
# defaults: this golden shows what `cluster.enabled: true` adds (the Cluster, its backups,
# the bucket's keys, the network rules both ways) and nothing else.
app:
  name: notes
image:
  repository: ghcr.io/easypeasyops/example/notes
database:
  # The URL the operator writes for the app user.
  existingSecret: notes-db-app
  secretKey: uri
  cluster:
    enabled: true

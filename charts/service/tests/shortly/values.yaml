            or (slo:sli_error:ratio_rate6h{slo="redirect-latency"} > 0.06 and slo:sli_error:ratio_rate30m{slo="redirect-latency"} > 0.06 and slo:sli_error:ratio_rate6h{slo="redirect-latency"} * slo:sli_events:increase6h{slo="redirect-latency"} >= 5)
          for: 2m

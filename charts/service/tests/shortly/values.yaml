            route="/{code}"}[1h])))
          labels:
            slo: redirect-latency
        - record: slo:sli_error:ratio_rate2h
          expr: 1 - (sum by (namespace) (rate(http_request_duration_seconds_bucket{method="GET", route="/{code}", le="0.05"}[2h])) / sum by (namespace) (rate(http_request_duration_seconds_count{method="GET",
            route="/{code}"}[2h])))
          labels:
            slo: redirect-latency
        - record: slo:sli_error:ratio_rate6h
          expr: 1 - (sum by (namespace) (rate(http_request_duration_seconds_bucket{method="GET", route="/{code}", le="0.05"}[6h])) / sum by (namespace) (rate(http_request_duration_seconds_count{method="GET",
            route="/{code}"}[6h])))
          labels:
            slo: redirect-latency
        - record: slo:sli_error:ratio_rate1d
          expr: 1 - (sum by (namespace) (rate(http_request_duration_seconds_bucket{method="GET", route="/{code}", le="0.05"}[1d])) / sum by (namespace) (rate(http_request_duration_seconds_count{method="GET",
            route="/{code}"}[1d])))
          labels:
            slo: redirect-latency
        - record: slo:sli_error:ratio_rate3d
          expr: 1 - (sum by (namespace) (rate(http_request_duration_seconds_bucket{method="GET", route="/{code}", le="0.05"}[3d])) / sum by (namespace) (rate(http_request_duration_seconds_count{method="GET",
            route="/{code}"}[3d])))
          labels:
            slo: redirect-latency
        - record: slo:sli_error:ratio_rate30d
          expr: 1 - (sum by (namespace) (rate(http_request_duration_seconds_bucket{method="GET", route="/{code}", le="0.05"}[30d])) / sum by (namespace) (rate(http_request_duration_seconds_count{method="GET",
            route="/{code}"}[30d])))
          labels:
            slo: redirect-latency
        - record: slo:sli_events:increase1h
          expr: sum by (namespace) (increase(http_request_duration_seconds_count{method="GET", route="/{code}"}[1h]))
          labels:
            slo: redirect-latency
        - record: slo:sli_events:increase6h
          expr: sum by (namespace) (increase(http_request_duration_seconds_count{method="GET", route="/{code}"}[6h]))
          labels:
            slo: redirect-latency
        - record: slo:sli_events:increase1d
          expr: sum by (namespace) (increase(http_request_duration_seconds_count{method="GET", route="/{code}"}[1d]))
          labels:
            slo: redirect-latency

        - record: slo:sli_error:ratio_rate5m
          expr: (sum by (namespace) (rate(http_requests_total{method="POST", route="/links", status=~"5.."}[5m])) or 0 * sum by (namespace) (rate(http_requests_total{method="POST", route="/links"}[5m]))) / sum
            by (namespace) (rate(http_requests_total{method="POST", route="/links"}[5m]))
          labels:
            slo: create-availability
        - record: slo:sli_error:ratio_rate30m
          expr: (sum by (namespace) (rate(http_requests_total{method="POST", route="/links", status=~"5.."}[30m])) or 0 * sum by (namespace) (rate(http_requests_total{method="POST", route="/links"}[30m]))) /
            sum by (namespace) (rate(http_requests_total{method="POST", route="/links"}[30m]))
          labels:
            slo: create-availability
        - record: slo:sli_error:ratio_rate1h
          expr: (sum by (namespace) (rate(http_requests_total{method="POST", route="/links", status=~"5.."}[1h])) or 0 * sum by (namespace) (rate(http_requests_total{method="POST", route="/links"}[1h]))) / sum
            by (namespace) (rate(http_requests_total{method="POST", route="/links"}[1h]))
          labels:
            slo: create-availability
        - record: slo:sli_error:ratio_rate2h
          expr: (sum by (namespace) (rate(http_requests_total{method="POST", route="/links", status=~"5.."}[2h])) or 0 * sum by (namespace) (rate(http_requests_total{method="POST", route="/links"}[2h]))) / sum
            by (namespace) (rate(http_requests_total{method="POST", route="/links"}[2h]))
          labels:
            slo: create-availability
        - record: slo:sli_error:ratio_rate6h
          expr: (sum by (namespace) (rate(http_requests_total{method="POST", route="/links", status=~"5.."}[6h])) or 0 * sum by (namespace) (rate(http_requests_total{method="POST", route="/links"}[6h]))) / sum
            by (namespace) (rate(http_requests_total{method="POST", route="/links"}[6h]))
          labels:
            slo: create-availability
        - record: slo:sli_error:ratio_rate1d
          expr: (sum by (namespace) (rate(http_requests_total{method="POST", route="/links", status=~"5.."}[1d])) or 0 * sum by (namespace) (rate(http_requests_total{method="POST", route="/links"}[1d]))) / sum
            by (namespace) (rate(http_requests_total{method="POST", route="/links"}[1d]))
          labels:
            slo: create-availability
        - record: slo:sli_error:ratio_rate3d
          expr: (sum by (namespace) (rate(http_requests_total{method="POST", route="/links", status=~"5.."}[3d])) or 0 * sum by (namespace) (rate(http_requests_total{method="POST", route="/links"}[3d]))) / sum
            by (namespace) (rate(http_requests_total{method="POST", route="/links"}[3d]))
          labels:
            slo: create-availability
        - record: slo:sli_error:ratio_rate30d
          expr: (sum by (namespace) (rate(http_requests_total{method="POST", route="/links", status=~"5.."}[30d])) or 0 * sum by (namespace) (rate(http_requests_total{method="POST", route="/links"}[30d]))) /
            sum by (namespace) (rate(http_requests_total{method="POST", route="/links"}[30d]))
          labels:
            slo: create-availability
        - record: slo:sli_events:increase1h
          expr: sum by (namespace) (increase(http_requests_total{method="POST", route="/links"}[1h]))
          labels:
            slo: create-availability
        - record: slo:sli_events:increase6h
          expr: sum by (namespace) (increase(http_requests_total{method="POST", route="/links"}[6h]))
          labels:
            slo: create-availability
        - record: slo:sli_events:increase1d
          expr: sum by (namespace) (increase(http_requests_total{method="POST", route="/links"}[1d]))
          labels:
            slo: create-availability
        - record: slo:sli_events:increase3d
          expr: sum by (namespace) (increase(http_requests_total{method="POST", route="/links"}[3d]))
          labels:
            slo: create-availability
        - record: slo:error_budget_remaining:ratio
          expr: 1 - slo:sli_error:ratio_rate30d{slo="create-availability"} / 0.005
          labels:
            slo: create-availability
        - alert: CreateAvailabilityBudgetBurn
          expr: |-
            (slo:sli_error:ratio_rate1h{slo="create-availability"} > 0.072 and slo:sli_error:ratio_rate5m{slo="create-availability"} > 0.072 and slo:sli_error:ratio_rate1h{slo="create-availability"} * slo:sli_events:increase1h{slo="create-availability"} >= 5)
            or (slo:sli_error:ratio_rate6h{slo="create-availability"} > 0.03 and slo:sli_error:ratio_rate30m{slo="create-availability"} > 0.03 and slo:sli_error:ratio_rate6h{slo="create-availability"} * slo:sli_events:increase6h{slo="create-availability"} >= 5)
          for: 2m
          labels:
            severity: page
            slo: create-availability
          annotations:
            summary: 'create-availability: error budget burning fast (14.4x over 1h or 6x over 6h)'
            description: 'POST /links answers without a server error: objective 0.995 over 30 days. At this pace the whole budget lasts only 2 to 5 days.'
            runbook_url: https://github.com/statsguy/shortly/blob/main/docs/RUNBOOK.md#slo-burn-rate-alerts
        - alert: CreateAvailabilityBudgetBurn
          expr: |-
            (slo:sli_error:ratio_rate1d{slo="create-availability"} > 0.015 and slo:sli_error:ratio_rate2h{slo="create-availability"} > 0.015 and slo:sli_error:ratio_rate1d{slo="create-availability"} * slo:sli_events:increase1d{slo="create-availability"} >= 5)
            or (slo:sli_error:ratio_rate3d{slo="create-availability"} > 0.005 and slo:sli_error:ratio_rate6h{slo="create-availability"} > 0.005 and slo:sli_error:ratio_rate3d{slo="create-availability"} * slo:sli_events:increase3d{slo="create-availability"} >= 5)
          for: 15m
          labels:
            severity: ticket
            slo: create-availability
          annotations:
            summary: 'create-availability: error budget burning steadily (3x over 1d or 1x over 3d)'
            description: 'POST /links answers without a server error: objective 0.995 over 30 days. At this pace the whole budget lasts only 10 to 30 days.'
            runbook_url: https://github.com/statsguy/shortly/blob/main/docs/RUNBOOK.md#slo-burn-rate-alerts
      - name: slo-create-latency
        rules:
        - record: slo:objective:ratio
          expr: '0.99'
          labels:
            slo: create-latency
        - record: slo:sli_error:ratio_rate5m
          expr: 1 - (sum by (namespace) (rate(http_request_duration_seconds_bucket{method="POST", route="/links", le="0.1"}[5m])) / sum by (namespace) (rate(http_request_duration_seconds_count{method="POST",
            route="/links"}[5m])))
          labels:
            slo: create-latency
        - record: slo:sli_error:ratio_rate30m
          expr: 1 - (sum by (namespace) (rate(http_request_duration_seconds_bucket{method="POST", route="/links", le="0.1"}[30m])) / sum by (namespace) (rate(http_request_duration_seconds_count{method="POST",
            route="/links"}[30m])))
          labels:
            slo: create-latency
        - record: slo:sli_error:ratio_rate1h
          expr: 1 - (sum by (namespace) (rate(http_request_duration_seconds_bucket{method="POST", route="/links", le="0.1"}[1h])) / sum by (namespace) (rate(http_request_duration_seconds_count{method="POST",
            route="/links"}[1h])))
          labels:
            slo: create-latency
        - record: slo:sli_error:ratio_rate2h
          expr: 1 - (sum by (namespace) (rate(http_request_duration_seconds_bucket{method="POST", route="/links", le="0.1"}[2h])) / sum by (namespace) (rate(http_request_duration_seconds_count{method="POST",
            route="/links"}[2h])))
          labels:
            slo: create-latency
        - record: slo:sli_error:ratio_rate6h
          expr: 1 - (sum by (namespace) (rate(http_request_duration_seconds_bucket{method="POST", route="/links", le="0.1"}[6h])) / sum by (namespace) (rate(http_request_duration_seconds_count{method="POST",
            route="/links"}[6h])))
          labels:
            slo: create-latency
        - record: slo:sli_error:ratio_rate1d
          expr: 1 - (sum by (namespace) (rate(http_request_duration_seconds_bucket{method="POST", route="/links", le="0.1"}[1d])) / sum by (namespace) (rate(http_request_duration_seconds_count{method="POST",
            route="/links"}[1d])))
          labels:
            slo: create-latency
        - record: slo:sli_error:ratio_rate3d
          expr: 1 - (sum by (namespace) (rate(http_request_duration_seconds_bucket{method="POST", route="/links", le="0.1"}[3d])) / sum by (namespace) (rate(http_request_duration_seconds_count{method="POST",
            route="/links"}[3d])))
          labels:
            slo: create-latency
        - record: slo:sli_error:ratio_rate30d
          expr: 1 - (sum by (namespace) (rate(http_request_duration_seconds_bucket{method="POST", route="/links", le="0.1"}[30d])) / sum by (namespace) (rate(http_request_duration_seconds_count{method="POST",
            route="/links"}[30d])))
          labels:
            slo: create-latency
        - record: slo:sli_events:increase1h
          expr: sum by (namespace) (increase(http_request_duration_seconds_count{method="POST", route="/links"}[1h]))
          labels:
            slo: create-latency
        - record: slo:sli_events:increase6h
          expr: sum by (namespace) (increase(http_request_duration_seconds_count{method="POST", route="/links"}[6h]))
          labels:
            slo: create-latency
        - record: slo:sli_events:increase1d
          expr: sum by (namespace) (increase(http_request_duration_seconds_count{method="POST", route="/links"}[1d]))
          labels:
            slo: create-latency
        - record: slo:sli_events:increase3d
          expr: sum by (namespace) (increase(http_request_duration_seconds_count{method="POST", route="/links"}[3d]))
          labels:
            slo: create-latency
        - record: slo:error_budget_remaining:ratio
          expr: 1 - slo:sli_error:ratio_rate30d{slo="create-latency"} / 0.01
          labels:
            slo: create-latency
        - alert: CreateLatencyBudgetBurn
          expr: |-
            (slo:sli_error:ratio_rate1h{slo="create-latency"} > 0.144 and slo:sli_error:ratio_rate5m{slo="create-latency"} > 0.144 and slo:sli_error:ratio_rate1h{slo="create-latency"} * slo:sli_events:increase1h{slo="create-latency"} >= 5)
            or (slo:sli_error:ratio_rate6h{slo="create-latency"} > 0.06 and slo:sli_error:ratio_rate30m{slo="create-latency"} > 0.06 and slo:sli_error:ratio_rate6h{slo="create-latency"} * slo:sli_events:increase6h{slo="create-latency"} >= 5)
          for: 2m
          labels:
            severity: page
            slo: create-latency
          annotations:
            summary: 'create-latency: error budget burning fast (14.4x over 1h or 6x over 6h)'
            description: 'POST /links answers in under 100 ms: objective 0.99 over 30 days. At this pace the whole budget lasts only 2 to 5 days.'
            runbook_url: https://github.com/statsguy/shortly/blob/main/docs/RUNBOOK.md#slo-burn-rate-alerts
        - alert: CreateLatencyBudgetBurn
          expr: |-
            (slo:sli_error:ratio_rate1d{slo="create-latency"} > 0.03 and slo:sli_error:ratio_rate2h{slo="create-latency"} > 0.03 and slo:sli_error:ratio_rate1d{slo="create-latency"} * slo:sli_events:increase1d{slo="create-latency"} >= 5)
            or (slo:sli_error:ratio_rate3d{slo="create-latency"} > 0.01 and slo:sli_error:ratio_rate6h{slo="create-latency"} > 0.01 and slo:sli_error:ratio_rate3d{slo="create-latency"} * slo:sli_events:increase3d{slo="create-latency"} >= 5)
          for: 15m
          labels:
            severity: ticket
            slo: create-latency
          annotations:
            summary: 'create-latency: error budget burning steadily (3x over 1d or 1x over 3d)'
            description: 'POST /links answers in under 100 ms: objective 0.99 over 30 days. At this pace the whole budget lasts only 10 to 30 days.'
            runbook_url: https://github.com/statsguy/shortly/blob/main/docs/RUNBOOK.md#slo-burn-rate-alerts
  dashboards:
    slo.json: |
      {
        "uid": "shortly-slo",
        "title": "shortly / SLOs",
        "tags": [
          "shortly",
          "slo"
        ],
        "timezone": "browser",
        "description": "Error budgets, burn rates and their likely causes. Generated rules: deploy/helm/shortly/rules/slo.yaml.",
        "schemaVersion": 39,
        "version": 1,
        "editable": true,
        "refresh": "30s",
        "time": {
          "from": "now-6h",
          "to": "now"
        },
        "templating": {
          "list": [
            {
              "name": "datasource",
              "type": "datasource",
              "query": "prometheus",
              "label": "Data source",
              "current": {}
            },
            {
              "name": "namespace",
              "type": "query",
              "label": "Environment",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "query": {
                "query": "label_values(slo:sli_error:ratio_rate5m, namespace)",
                "refId": "ns"
              },
              "definition": "label_values(slo:sli_error:ratio_rate5m, namespace)",
              "refresh": 2,
              "current": {
                "text": "shortly-prod",
                "value": "shortly-prod"
              }
            }
          ]
        },
        "links": [
          {
            "title": "Runbook",
            "type": "link",
            "url": "https://github.com/statsguy/shortly/blob/main/docs/RUNBOOK.md#slo-burn-rate-alerts",
            "targetBlank": true
          }
        ],
        "panels": [
          {
            "id": 100,
            "type": "row",
            "title": "Error budgets (30 days)",
            "gridPos": {
              "x": 0,
              "y": 0,
              "w": 24,
              "h": 1
            },
            "collapsed": false,
            "panels": []
          },
          {
            "id": 1,
            "type": "stat",
            "title": "Error budget remaining",
            "description": "Share of each SLO's 30-day error budget still unspent. 100% = untouched; below 0 = overspent (freeze features, fix reliability).",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "gridPos": {
              "x": 0,
              "y": 1,
              "w": 24,
              "h": 5
            },
            "targets": [
              {
                "refId": "A",
                "datasource": {
                  "type": "prometheus",
                  "uid": "${datasource}"
                },
                "expr": "slo:error_budget_remaining:ratio{namespace=\"$namespace\"}",
                "legendFormat": "{{slo}}"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "red",
                      "value": null
                    },
                    {
                      "color": "orange",
                      "value": 0
                    },
                    {
                      "color": "yellow",
                      "value": 0.25
                    },
                    {
                      "color": "green",
                      "value": 0.5
                    }
                  ]
                },
                "min": -1,
                "max": 1,
                "unit": "percentunit"
              },
              "overrides": []
            },
            "options": {
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ],
                "fields": "",
                "values": false
              },
              "colorMode": "background",
              "graphMode": "none",
              "textMode": "value_and_name",
              "orientation": "horizontal"
            }
          },
          {
            "id": 2,
            "type": "timeseries",
            "title": "Burn rate (1h)",
            "description": "How fast each budget is being spent. 1 = on pace to use exactly the 30-day budget. Pages need 14.4 (over 1h and 5m) or 6 (over 6h and 30m).",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "gridPos": {
              "x": 0,
              "y": 6,
              "w": 12,
              "h": 8
            },
            "targets": [
              {
                "refId": "A",
                "datasource": {
                  "type": "prometheus",
                  "uid": "${datasource}"
                },
                "expr": "slo:sli_error:ratio_rate1h{namespace=\"$namespace\"} / on(slo) group_left () (1 - slo:objective:ratio)",
                "legendFormat": "{{slo}}"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "custom": {
                  "thresholdsStyle": {
                    "mode": "line+area"
                  }
                },
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "green",
                      "value": null
                    },
                    {
                      "color": "orange",
                      "value": 6
                    },
                    {
                      "color": "red",
                      "value": 14.4
                    }
                  ]
                },
                "min": 0
              },
              "overrides": []
            },
            "options": {}
          },
          {
            "id": 3,
            "type": "timeseries",
            "title": "Error ratio (5m) vs budget",
            "description": "Share of bad events right now, next to the share each SLO allows (dashed). Above its budget line, that SLO is burning.",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "gridPos": {
              "x": 12,
              "y": 6,
              "w": 12,
              "h": 8
            },
            "targets": [
              {
                "refId": "A",
                "datasource": {
                  "type": "prometheus",
                  "uid": "${datasource}"
                },
                "expr": "slo:sli_error:ratio_rate5m{namespace=\"$namespace\"}",
                "legendFormat": "{{slo}} errors"
              },
              {
                "refId": "B",
                "datasource": {
                  "type": "prometheus",
                  "uid": "${datasource}"
                },
                "expr": "1 - slo:objective:ratio",
                "legendFormat": "{{slo}} budget"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "percentunit",
                "min": 0
              },
              "overrides": [
                {
                  "matcher": {
                    "id": "byRegexp",
                    "options": ".* budget"
                  },
                  "properties": [
                    {
                      "id": "custom.lineStyle",
                      "value": {
                        "fill": "dash",
                        "dash": [
                          10,
                          10
                        ]
                      }
                    }
                  ]
                }
              ]
            },
            "options": {}
          },
          {
            "id": 101,
            "type": "row",
            "title": "Traffic and causes",
            "gridPos": {
              "x": 0,
              "y": 14,
              "w": 24,
              "h": 1
            },
            "collapsed": false,
            "panels": []
          },
          {
            "id": 4,
            "type": "timeseries",
            "title": "Requests by status",
            "description": "User-facing requests per second (probes and scrapes excluded). 404 and 410 are good answers; 5xx burn the availability SLOs.",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "gridPos": {
              "x": 0,
              "y": 15,
              "w": 12,
              "h": 8
            },
            "targets": [
              {
                "refId": "A",
                "datasource": {
                  "type": "prometheus",
                  "uid": "${datasource}"
                },
                "expr": "sum by (status) (rate(http_requests_total{namespace=\"$namespace\", route!~\"/healthz|/readyz|/metrics\"}[$__rate_interval]))",
                "legendFormat": "{{status}}"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "reqps"
              },
              "overrides": []
            },
            "options": {}
          },
          {
            "id": 5,
            "type": "timeseries",
            "title": "p99 latency by route",
            "description": "The latency SLOs: redirects under 50 ms, creates under 100 ms, for 99% of requests.",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "gridPos": {
              "x": 12,
              "y": 15,
              "w": 12,
              "h": 8
            },
            "targets": [
              {
                "refId": "A",
                "datasource": {
                  "type": "prometheus",
                  "uid": "${datasource}"
                },
                "expr": "histogram_quantile(0.99, sum by (le, route) (rate(http_request_duration_seconds_bucket{namespace=\"$namespace\", route!~\"/healthz|/readyz|/metrics\"}[$__rate_interval])))",
                "legendFormat": "{{route}}"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "custom": {
                  "thresholdsStyle": {
                    "mode": "line"
                  }
                },
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "green",
                      "value": null
                    },
                    {
                      "color": "red",
                      "value": 0.05
                    }
                  ]
                },
                "unit": "s"
              },
              "overrides": []
            },
            "options": {}
          },
          {
            "id": 6,
            "type": "timeseries",
            "title": "Pods",
            "description": "Available pods against the autoscaler's ceiling. Pinned at max with burn rising: raise maxReplicas (Capacity in the design doc).",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "gridPos": {
              "x": 0,
              "y": 23,
              "w": 8,
              "h": 7
            },
            "targets": [
              {
                "refId": "A",
                "datasource": {
                  "type": "prometheus",
                  "uid": "${datasource}"
                },
                "expr": "sum(kube_replicaset_status_ready_replicas{namespace=\"$namespace\", replicaset=~\"shortly-[a-z0-9]+\"})",
                "legendFormat": "available"
              },
              {
                "refId": "B",
                "datasource": {
                  "type": "prometheus",
                  "uid": "${datasource}"
                },
                "expr": "kube_horizontalpodautoscaler_spec_max_replicas{namespace=\"$namespace\", horizontalpodautoscaler=\"shortly\"}",
                "legendFormat": "HPA max"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "min": 0,
                "decimals": 0
              },
              "overrides": []
            },
            "options": {}
          },
          {
            "id": 7,
            "type": "timeseries",
            "title": "DB pool in use",
            "description": "Connections checked out across all pods. In use near size with load shed rising: the database is slow, not the app.",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "gridPos": {
              "x": 8,
              "y": 23,
              "w": 8,
              "h": 7
            },
            "targets": [
              {
                "refId": "A",
                "datasource": {
                  "type": "prometheus",
                  "uid": "${datasource}"
                },
                "expr": "sum(db_pool_in_use{namespace=\"$namespace\"})",
                "legendFormat": "in use"
              },
              {
                "refId": "B",
                "datasource": {
                  "type": "prometheus",
                  "uid": "${datasource}"
                },
                "expr": "sum(db_pool_size{namespace=\"$namespace\"})",
                "legendFormat": "size"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "min": 0
              },
              "overrides": []
            },
            "options": {}
          },
          {
            "id": 8,
            "type": "timeseries",
            "title": "Load shed",
            "description": "Requests rejected with 503 + Retry-After because no DB connection freed up within the pool timeout.",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "gridPos": {
              "x": 16,
              "y": 23,
              "w": 8,
              "h": 7
            },
            "targets": [
              {
                "refId": "A",
                "datasource": {
                  "type": "prometheus",
                  "uid": "${datasource}"
                },
                "expr": "sum by (reason) (rate(load_shed_total{namespace=\"$namespace\"}[$__rate_interval]))",
                "legendFormat": "503 shed: {{reason}}"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "min": 0,
                "unit": "reqps"
              },
              "overrides": []
            },
            "options": {}
          },
          {
            "id": 9,
            "type": "table",
            "title": "Firing alerts",
            "description": "Alerts Prometheus is firing for this namespace. Routing, grouping and silences live in Alertmanager.",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "gridPos": {
              "x": 0,
              "y": 30,
              "w": 24,

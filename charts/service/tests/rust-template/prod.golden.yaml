      "version": 1,
      "editable": true,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "label": "Data source",
            "current": {}
          },
          {
            "name": "namespace",
            "type": "query",
            "label": "Environment",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": {
              "query": "label_values(slo:sli_error:ratio_rate5m, namespace)",
              "refId": "ns"
            },
            "definition": "label_values(slo:sli_error:ratio_rate5m, namespace)",
            "refresh": 2,
            "current": {
              "text": "rust-template-prod",
              "value": "rust-template-prod"
            }
          }
        ]
      },
      "annotations": {
        "list": [
          {
            "name": "Deploys",
            "enable": true,
            "iconColor": "blue",
            "datasource": {
              "type": "prometheus",

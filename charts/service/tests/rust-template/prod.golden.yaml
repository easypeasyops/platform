---
# Source: service/templates/networkpolicy.yaml
# Least privilege on the network, for the app pods and the migration Job (both carry the
# selector labels). Once a pod is selected, everything not listed here is denied:
#   in:  the app port from httpFrom (anyone by default), the metrics port from Prometheus
#   out: DNS, and the database. Nothing else: the app calls no other service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rust-template
  labels:
    app.kubernetes.io/name: rust-template
    app.kubernetes.io/instance: rust-template
    app.kubernetes.io/version: "000000000000"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: service-<version>
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rust-template
      app.kubernetes.io/instance: rust-template
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - { port: 8000, protocol: TCP }
    - ports:
        - { port: 9100, protocol: TCP }
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - { port: 5432, protocol: TCP }


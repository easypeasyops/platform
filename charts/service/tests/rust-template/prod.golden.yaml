data:
  slo.json: |
    {
      "uid": "rust-template-slo",
      "title": "rust-template / SLOs",
      "tags": [
        "rust-template",
        "slo"
      ],
      "timezone": "browser",
      "description": "Error budgets, burn rates and their likely causes. Generated rules: the rust-template-slo PrometheusRule (the platform's scripts/gen_slo_rules.py).",

---
# Source: service/templates/servicemonitor.yaml
# Prometheus finds the pods through the Service's endpoints and scrapes each one. The job
# label becomes the Service name (the release name), which the alert rules select on.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rust-template
  labels:
    app.kubernetes.io/name: rust-template
    app.kubernetes.io/instance: rust-template
    app.kubernetes.io/version: "000000000000"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: service-<version>
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: rust-template
      app.kubernetes.io/instance: rust-template
  # Copied from each pod onto its series: tells a canary's metrics from the stable pods'
  # (templates/analysistemplate.yaml). Pods without it (no Rollout) just don't get it.
  podTargetLabels: [rollouts-pod-template-hash]
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s

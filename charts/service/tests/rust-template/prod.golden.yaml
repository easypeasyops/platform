# Source: service/templates/pdb.yaml
# Voluntary disruptions (node drains, cluster upgrades) may evict pods only while at least
# minAvailable stay up. Skipped for a single replica, where it would block every drain.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rust-template
  labels:
    app.kubernetes.io/name: rust-template
    app.kubernetes.io/instance: rust-template
    app.kubernetes.io/version: "000000000000"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: service-<version>
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rust-template
      app.kubernetes.io/instance: rust-template

